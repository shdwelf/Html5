name: arena-relay-probe
on:
  push:
    paths:
      - '.github/workflows/relay-probe.yml'
      - '.arena-relay/trigger'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write marker and commit back
        run: |
          set -e
          mkdir -p .arena-relay
          echo "run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} ts=$(date -u +%FT%TZ)" >> .arena-relay/probe-results.txt
          git config user.name "arena-relay"
          git config user.email "arena-relay@users.noreply.github.com"
          git add .arena-relay/probe-results.txt
          git commit -m "relay probe marker ${GITHUB_RUN_ID}" || echo "nothing to commit"
          git push origin HEAD:${GITHUB_REF_NAME}
