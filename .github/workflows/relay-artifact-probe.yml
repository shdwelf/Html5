name: arena-relay-artifact-probe
on:
  push:
    paths:
      - '.arena-relay/artifact-probe'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: make artifact
        run: |
          mkdir -p out
          head -c 5242880 /dev/urandom > out/probe.bin
          echo "artifact test $(date -u)" > out/note.txt
      - uses: actions/upload-artifact@v4
        with:
          name: relay-probe
          path: out/
          retention-days: 5
