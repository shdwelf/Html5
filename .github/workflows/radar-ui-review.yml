name: Radar tiled UI and explicit network paths

on:
  pull_request:
    paths:
      - 'apps/ads-b-radar-scope'
      - 'apps/radar_scope.html'
      - 'scripts/build-radar-scope.mjs'
      - 'tests/radar-scope*'
      - '.github/workflows/radar-ui-review.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: radar-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tiled-radar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require source-exact browser alias and network-only staging policy
        run: |
          node scripts/build-radar-scope.mjs --check
          node --test tests/radar-scope.test.mjs tests/html5-offline-launcher.test.mjs
      - name: Test six viewports and intercepted direct/proxy paths without real feeds
        run: node --test tests/radar-scope-browser.mjs
