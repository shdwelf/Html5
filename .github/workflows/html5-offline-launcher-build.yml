name: HTML5 Offline Library — Android debug APK

on:
  push:
    branches: ['arena/58dd5623-html5']
    paths:
      - 'apps/html5-offline-launcher/**'
      - 'public/apps/**'
      - 'resources/city-subsurface/**'
      - 'js/city-subsurface.js'
      - 'css/city-subsurface.css'
      - 'resources/city-subsurface-template.html'
      - 'scripts/build-city-subsurface*.mjs'
      - 'scripts/build-html5-offline-launcher-assets.mjs'
      - 'tests/city-subsurface.test.mjs'
      - 'tests/html5-offline-launcher.test.mjs'
      - '.github/workflows/html5-offline-launcher-build.yml'
  pull_request:
    paths:
      - 'apps/html5-offline-launcher/**'
      - 'public/apps/**'
      - 'resources/city-subsurface/**'
      - 'js/city-subsurface.js'
      - 'css/city-subsurface.css'
      - 'resources/city-subsurface-template.html'
      - 'scripts/build-city-subsurface*.mjs'
      - 'scripts/build-html5-offline-launcher-assets.mjs'
      - 'tests/city-subsurface.test.mjs'
      - 'tests/html5-offline-launcher.test.mjs'
      - '.github/workflows/html5-offline-launcher-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: html5-offline-launcher-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK platform 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Test launcher inventory and offline policy
        run: node --test tests/html5-offline-launcher.test.mjs

      - name: Validate app inventory
        run: node scripts/build-html5-offline-launcher-assets.mjs --check

      - name: Build debug APK
        working-directory: apps/html5-offline-launcher
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify packaged microphone and offline permissions
        shell: bash
        run: |
          set -euo pipefail
          apk=apps/html5-offline-launcher/app/build/outputs/apk/debug/app-debug.apk
          aapt="$ANDROID_HOME/build-tools/34.0.0/aapt"
          permissions="$("$aapt" dump permissions "$apk")"
          printf '%s\n' "$permissions"
          grep -Fq 'android.permission.RECORD_AUDIO' <<< "$permissions"
          ! grep -Fq 'android.permission.INTERNET' <<< "$permissions"
          ! grep -Fq 'android.permission.CAMERA' <<< "$permissions"

      - name: Enable KVM group permissions for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android WebView permission and Headline Harry smoke tests
        id: android-smoke-tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 300
          working-directory: apps/html5-offline-launcher
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          # This action runs each nonempty script line in a separate shell; keep these scripts on one line.
          pre-emulator-launch-script: >-
            { echo "PWD=$PWD"; echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"; ls -l /dev/kvm || true; cat "$ANDROID_AVD_HOME/test.avd/config.ini" || true; "$ANDROID_HOME/emulator/emulator" -version || true; } > app/build/emulator-prelaunch.log 2>&1
          script: >-
            gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest > app/build/android-webview-tests.log 2>&1; status=$?; cat app/build/android-webview-tests.log; exit "$status"

      - name: Surface Android instrumentation failure details
        if: ${{ failure() && steps.android-smoke-tests.outcome == 'failure' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import os
          import re
          import xml.etree.ElementTree as ET

          reports = glob.glob("apps/html5-offline-launcher/app/build/outputs/androidTest-results/**/*.xml", recursive=True)
          failures = []
          for report in reports:
              try:
                  root = ET.parse(report).getroot()
              except (ET.ParseError, OSError):
                  continue
              for case in root.iter("testcase"):
                  for result in list(case.findall("failure")) + list(case.findall("error")):
                      detail = " ".join(part.strip() for part in [result.get("message", ""), *result.itertext()] if part and part.strip())
                      detail = re.sub(r"\s+", " ", detail).strip()
                      name = ".".join(filter(None, [case.get("classname"), case.get("name")]))
                      failures.append(f"{name}: {detail[:3000]}")

          if failures:
              for failure in failures:
                  safe = failure.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=Android-instrumentation-failure::{safe}")
          else:
              report_names = ", ".join(os.path.relpath(report) for report in reports) or "none found"
              print(f"::error title=Android-instrumentation-failure::No JUnit failure details; XML reports: {report_names}")

          prelaunch_path = "apps/html5-offline-launcher/app/build/emulator-prelaunch.log"
          if os.path.isfile(prelaunch_path):
              prelaunch_lines = open(prelaunch_path, encoding="utf-8", errors="replace").read().splitlines()[-12:]
              for line in prelaunch_lines:
                  safe = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=Android-emulator-prelaunch::{safe[:1000]}")
          else:
              print(f"::error title=Android-emulator-prelaunch::Pre-launch diagnostics were not written: {prelaunch_path}")

          log_path = "apps/html5-offline-launcher/app/build/android-webview-tests.log"
          if not os.path.isfile(log_path):
              print(f"::error title=Android-instrumentation-log::Gradle log file is missing: {log_path}")
          try:
              lines = open(log_path, encoding="utf-8", errors="replace").read().splitlines()[-25:]
          except OSError:
              lines = []
          for line in lines:
              safe = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Android-instrumentation-log::{safe[:1000]}")
          PY

      - name: Report APK size and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          apk=apps/html5-offline-launcher/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          ls -lh "$apk"
          sha256sum "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: html5-offline-launcher-debug-apk
          path: apps/html5-offline-launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
