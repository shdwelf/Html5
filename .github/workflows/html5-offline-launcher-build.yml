name: HTML5 Offline Library — Android debug APK

on:
  push:
    branches: ['main']
    paths:
      - 'apps/html5-offline-launcher/**'
      - 'public/apps/**'
      - 'resources/city-subsurface/**'
      - 'js/city-subsurface.js'
      - 'css/city-subsurface.css'
      - 'resources/city-subsurface-template.html'
      - 'scripts/build-city-subsurface*.mjs'
      - 'scripts/build-html5-offline-launcher-assets.mjs'
      - 'tests/city-subsurface.test.mjs'
      - 'tests/html5-offline-launcher.test.mjs'
      - '.github/workflows/html5-offline-launcher-build.yml'
  pull_request:
    paths:
      - 'apps/html5-offline-launcher/**'
      - 'public/apps/**'
      - 'resources/city-subsurface/**'
      - 'js/city-subsurface.js'
      - 'css/city-subsurface.css'
      - 'resources/city-subsurface-template.html'
      - 'scripts/build-city-subsurface*.mjs'
      - 'scripts/build-html5-offline-launcher-assets.mjs'
      - 'tests/city-subsurface.test.mjs'
      - 'tests/html5-offline-launcher.test.mjs'
      - '.github/workflows/html5-offline-launcher-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: html5-offline-launcher-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK platform 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Test launcher inventory and offline policy
        run: node --test tests/html5-offline-launcher.test.mjs

      - name: Validate public app inventory
        run: node scripts/build-html5-offline-launcher-assets.mjs --check --profile public

      - name: Validate private app allowlist
        run: node scripts/build-html5-offline-launcher-assets.mjs --check --profile private

      - name: Build public debug APK
        working-directory: apps/html5-offline-launcher
        run: gradle --no-daemon --stacktrace :app:assemblePublicDebug

      - name: Verify public APK permissions
        shell: bash
        run: |
          set -euo pipefail
          apk=apps/html5-offline-launcher/app/build/outputs/apk/public/debug/app-public-debug.apk
          aapt="$ANDROID_HOME/build-tools/34.0.0/aapt"
          permissions="$("$aapt" dump permissions "$apk")"
          printf '%s\n' "$permissions"
          grep -Fq 'android.permission.RECORD_AUDIO' <<< "$permissions"
          grep -Fq 'android.permission.MODIFY_AUDIO_SETTINGS' <<< "$permissions"
          ! grep -Fq 'android.permission.INTERNET' <<< "$permissions"
          ! grep -Fq 'android.permission.CAMERA' <<< "$permissions"

      - name: Build curated private debug APK (do not upload)
        working-directory: apps/html5-offline-launcher
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/private-apk-build.log"
          set +e
          gradle --no-daemon --stacktrace :app:assemblePrivateDebug > "$log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            python3 - "$log" <<'PY'
          import pathlib
          import sys

          lines = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()
          markers = ("failure: build failed", "what went wrong:", "execution failed for task", "caused by:", "could not")
          selected = []
          for index, line in enumerate(lines):
              if any(marker in line.lower() for marker in markers):
                  selected.extend(lines[max(0, index - 2):min(len(lines), index + 6)])
          if not selected:
              selected = lines[-60:]
          details = "\n".join(dict.fromkeys(selected))[-6000:]
          safe = details.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Private-APK-Gradle::{safe}")
          PY
            exit "$status"
          fi
          tail -n 12 "$log"

      - name: Verify private APK allowlist and reduced permissions
        shell: bash
        run: |
          set -euo pipefail
          apk=apps/html5-offline-launcher/app/build/outputs/apk/private/debug/app-private-debug.apk
          aapt="$ANDROID_HOME/build-tools/34.0.0/aapt"
          permissions="$("$aapt" dump permissions "$apk")"
          ! grep -Fq 'android.permission.RECORD_AUDIO' <<< "$permissions"
          ! grep -Fq 'android.permission.MODIFY_AUDIO_SETTINGS' <<< "$permissions"
          ! grep -Fq 'android.permission.INTERNET' <<< "$permissions"
          ! grep -Fq 'android.permission.CAMERA' <<< "$permissions"
          python3 - "$apk" <<'PY'
          import json
          import sys
          import zipfile

          apk_path = sys.argv[1]
          expected = ["helios-observatory", "prime-viewer"]
          with zipfile.ZipFile(apk_path) as apk:
              catalog = json.loads(apk.read("assets/launcher/catalog.json"))
              slugs = sorted(app["slug"] for app in catalog["apps"])
              roots = sorted({
                  name.split("/")[2]
                  for name in apk.namelist()
                  if name.startswith("assets/apps/") and len(name.split("/")) > 3
              })
              if slugs != expected or roots != expected:
                  raise SystemExit(f"Unexpected private APK app set: catalog={slugs}, assets={roots}")
          print("Private APK contains only the two allowlisted apps; it will not be uploaded.")
          PY

      - name: Install PulseAudio runtime for Android emulator microphone tests
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pulseaudio pulseaudio-utils

      - name: Enable KVM group permissions for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android WebView permission and Headline Harry smoke tests
        id: android-smoke-tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/pulse-runtime
          PULSE_SERVER: unix:${{ runner.temp }}/pulse-runtime/native
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 300
          working-directory: apps/html5-offline-launcher
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          # This action runs each nonempty script line in a separate shell; keep these scripts on one line.
          pre-emulator-launch-script: >-
            { set -e; mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"; pulseaudio -n --daemonize=yes --exit-idle-time=-1 --log-target="file:$RUNNER_TEMP/pulseaudio.log" --load="module-native-protocol-unix socket=${PULSE_SERVER#unix:} auth-anonymous=1" --load="module-null-sink sink_name=ci_mic_bus"; pactl set-default-source ci_mic_bus.monitor; echo "PWD=$PWD"; echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"; ls -l /dev/kvm || true; grep -E '^(hw[.]audioInput|hw[.]audioOutput)=' "$ANDROID_AVD_HOME/test.avd/config.ini" || true; pactl info; pactl list short sources; "$ANDROID_HOME/emulator/emulator" -version || true; } > app/build/emulator-prelaunch.log 2>&1
          script: >-
            adb logcat -c || true; if gradle --no-daemon --stacktrace :app:connectedPublicDebugAndroidTest > app/build/android-webview-tests.log 2>&1; then status=0; else status=$?; adb logcat -d -v threadtime -t 4000 > app/build/android-webview-logcat.log 2>&1 || true; fi; cat app/build/android-webview-tests.log; exit "$status"

      - name: Surface Android instrumentation failure details
        if: ${{ failure() && steps.android-smoke-tests.outcome == 'failure' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import os
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          reports = glob.glob("apps/html5-offline-launcher/app/build/outputs/androidTest-results/**/*.xml", recursive=True)
          failures = []
          for report in reports:
              try:
                  root = ET.parse(report).getroot()
              except (ET.ParseError, OSError):
                  continue
              for case in root.iter("testcase"):
                  for result in list(case.findall("failure")) + list(case.findall("error")):
                      attributes = " ".join(f"{key}={value}" for key, value in result.attrib.items())
                      text = " ".join(part.strip() for part in result.itertext() if part and part.strip())
                      detail = re.sub(r"\s+", " ", " | ".join(part for part in [attributes, text] if part)).strip()
                      if not detail:
                          case_output = " ".join(
                              part.strip()
                              for element in list(case.findall("system-out")) + list(case.findall("system-err"))
                              for part in element.itertext()
                              if part and part.strip()
                          )
                          detail = re.sub(r"\s+", " ", case_output).strip()
                      if not detail:
                          detail = "failure element has no attributes, text, or testcase output"
                      name = ".".join(filter(None, [case.get("classname"), case.get("name")]))
                      failures.append(f"{name}: {detail[:4000]}")

          if failures:
              for failure in failures:
                  safe = failure.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=Android-instrumentation-failure::{safe}")
          else:
              report_names = ", ".join(os.path.relpath(report) for report in reports) or "none found"
              print(f"::error title=Android-instrumentation-failure::No JUnit failure details; XML reports: {report_names}")

          prelaunch_path = "apps/html5-offline-launcher/app/build/emulator-prelaunch.log"
          if os.path.isfile(prelaunch_path):
              prelaunch_lines = open(prelaunch_path, encoding="utf-8", errors="replace").read().splitlines()
              relevant = [line for line in prelaunch_lines if re.search(r"(?i)error|fail|pulse|source|audio|kvm|emulator", line)]
              if relevant:
                  message = "\n".join(relevant[-10:])
                  safe = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=Android-emulator-prelaunch::{safe[:5000]}")
          else:
              print(f"::error title=Android-emulator-prelaunch::Pre-launch diagnostics were not written: {prelaunch_path}")

          log_path = "apps/html5-offline-launcher/app/build/android-webview-tests.log"
          if not os.path.isfile(log_path):
              print(f"::error title=Android-instrumentation-log::Gradle log file is missing: {log_path}")
          try:
              lines = open(log_path, encoding="utf-8", errors="replace").read().splitlines()
          except OSError as error:
              lines = [f"Could not read Gradle log: {error}"]
          if not lines:
              lines = [f"Gradle log exists but is empty ({os.path.getsize(log_path)} bytes)"]

          # GitHub clips a single annotation at 4 KB. Emit focused failure
          # contexts and the log tail as separate annotations so the actual
          # Gradle/JUnit cause is not hidden behind hundreds of stack frames.
          marker = re.compile(
              r"(?i)(FAILURE:|what went wrong:|execution failed for task|caused by:|"
              r"assertionerror|headline.?harry|ci-ready|dosbox error|failed to start js-dos|"
              r"instrumentation_status|instrumentation_code|fatal exception|build failed)"
          )
          hits = [index for index, line in enumerate(lines) if marker.search(line)]
          selected = {}
          for index in hits[-12:]:
              for context_index in range(max(0, index - 2), min(len(lines), index + 5)):
                  selected[context_index] = lines[context_index]
          selected.update({index: lines[index] for index in range(max(0, len(lines) - 40), len(lines))})
          diagnostic_lines = [selected[index] for index in sorted(selected)]
          message = "\n".join(diagnostic_lines) if diagnostic_lines else "\n".join(lines[-40:])
          message = message[-20000:]
          for chunk_index, start in enumerate(range(0, len(message), 1000), start=1):
              chunk = message[start:start + 1000]
              safe = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Android-instrumentation-log-{chunk_index}::{safe}")

          # Capture logcat inside the emulator-runner action before it tears
          # down the virtual device; fall back to adb here for older runs.
          logcat_path = "apps/html5-offline-launcher/app/build/android-webview-logcat.log"
          if os.path.isfile(logcat_path):
              try:
                  logcat = open(logcat_path, encoding="utf-8", errors="replace").read().splitlines()
              except OSError as error:
                  logcat = [f"Could not read captured Android logcat: {error}"]
          else:
              try:
                  result = subprocess.run(
                      ["adb", "logcat", "-d", "-t", "1500", "-v", "brief"],
                      capture_output=True, text=True, errors="replace", timeout=20,
                  )
                  logcat = result.stdout.splitlines()
                  if result.returncode and result.stderr:
                      logcat.append(f"adb logcat exited {result.returncode}: {result.stderr.strip()}")
              except (OSError, subprocess.TimeoutExpired) as error:
                  logcat = [f"Could not read adb logcat: {error}"]
          logcat_pattern = re.compile(
              r"(?i)(FATAL EXCEPTION|AndroidRuntime|chromium|crash_dump|SIGSEGV|ANR in|"
              r"WebView|headline.?harry|js-dos|DOSBox error|failed to start|"
              r"HeadlineHarrySmoke|Html5Offline|console)"
          )
          relevant_logcat = [line for line in logcat if logcat_pattern.search(line)][-60:]
          if not relevant_logcat:
              relevant_logcat = ["No matching Android/WebView crash or Headline Harry logcat lines."]
          logcat_text = "\n".join(relevant_logcat)
          for chunk_index, start in enumerate(range(0, len(logcat_text), 1000), start=1):
              chunk = logcat_text[start:start + 1000]
              safe = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Android-logcat-{chunk_index}::{safe}")
          PY

      - name: Report public APK size and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          apk=apps/html5-offline-launcher/app/build/outputs/apk/public/debug/app-public-debug.apk
          test -s "$apk"
          ls -lh "$apk"
          sha256sum "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: html5-offline-launcher-public-debug-apk
          path: apps/html5-offline-launcher/app/build/outputs/apk/public/debug/app-public-debug.apk
          if-no-files-found: error
          retention-days: 30
