name: Headline Harry — Ghidra static analysis

# Disassembles/decompiles the 1991 game executables (INTRO.EXE, MAP.EXE)
# with headless Ghidra on a runner and commits the reports. Same pattern as
# drsolomon-ghidra.yml; reuses the generic exporter in tools/ghidra_scripts.
# Pure static analysis — the game is never executed, emulated, or modified.

on:
  push:
    paths:
      - '.arena-relay/harry-ghidra.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GHIDRA_VERSION: '12.1.4'
      GHIDRA_DATE: '20260921'
      GHIDRA_SHA256: 'ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned official Ghidra release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ghidra.zip"
          url="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/ghidra_${GHIDRA_VERSION}_PUBLIC_${GHIDRA_DATE}.zip"
          curl -fL --retry 6 --retry-all-errors --connect-timeout 30 "$url" -o "$archive"
          echo "$GHIDRA_SHA256  $archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/ghidra_${GHIDRA_VERSION}_PUBLIC/support/analyzeHeadless"

      - name: Require installer-recovered executables
        shell: bash
        run: |
          test -f .xfer/harry/installed/MAP.EXE || {
            echo "::error title=missing input::Run arena-headline-harry first - .xfer/harry/installed is produced by the unattended DOSBox install. The raw floppy EXEs are packed (scrambled) and not analyzable."
            exit 2
          }
          head -c2 .xfer/harry/installed/MAP.EXE | grep -q MZ || {
            echo "::error title=packed input::installed MAP.EXE is not a clean MZ yet"
            exit 2
          }

      - name: Disassemble game executables
        shell: bash
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/harry-reports"
          projects="$RUNNER_TEMP/ghidra-projects"
          headless="$RUNNER_TEMP/ghidra_${GHIDRA_VERSION}_PUBLIC/support/analyzeHeadless"
          mkdir -p "$reports" "$projects"
          failures=0
          for exe in INTRO.EXE MAP.EXE; do
            project=$(printf 'HH_%s' "$exe" | tr -c 'A-Za-z0-9_' '_')
            echo "===== $exe ====="
            if ! timeout 15m "$headless" "$projects" "$project" \
                -import ".xfer/harry/installed/$exe" \
                -analysisTimeoutPerFile 600 \
                -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" \
                -postScript EncyclopediaReport.java "$reports" \
                -deleteProject; then
              failures=$((failures + 1))
              echo "GHIDRA_FAILURE $exe"
            fi
          done
          echo "failures=$failures"
          find "$reports" -type f | sort
          test "$(find "$reports" -name '*.ghidra.json' | wc -l)" -gt 0

      - name: Summarize reports
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/harry-reports" > "$RUNNER_TEMP/REPORT.md" <<'PY'
          import json, pathlib, sys
          d = pathlib.Path(sys.argv[1])
          print("# Headline Harry — headless Ghidra report\n")
          print("Generated by arena-headline-harry-ghidra workflow. Pure static analysis;")
          print("the game was never executed. Binaries are 16-bit real-mode DOS MZ (1991).\n")
          for j in sorted(d.glob("*.ghidra.json")):
              m = json.loads(j.read_text())
              print(f"\n## {m['program']}")
              for k in ("executableFormat", "language", "compiler", "imageBase", "md5", "sha256"):
                  print(f"- {k}: `{m.get(k)}`")
              eps = m.get("entryPoints", [])
              print(f"- entry points: {len(eps)}")
              for e in eps[:8]:
                  print("  -", e if isinstance(e, str) else e.get("address", e))
              fns = m.get("functions", [])
              print(f"- functions: {len(fns)}")
              for f in fns[:12]:
                  print("  -", f if isinstance(f, str) else f.get("name"), ("" if isinstance(f, str) else f.get("address", "")))
          print("\nFull artifacts: `.asm`, `.c`, `.strings.txt`, `.ghidra.json` next to this file.\n")
          PY
          cat "$RUNNER_TEMP/REPORT.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p webxdc-headline-harry/ghidra
          cp "$RUNNER_TEMP/harry-reports"/* webxdc-headline-harry/ghidra/
          cp "$RUNNER_TEMP/REPORT.md" webxdc-headline-harry/ghidra/ANALYSIS.md
          git config user.name arena-ghidra-research
          git config user.email arena-ghidra-research@users.noreply.github.com
          git add webxdc-headline-harry/ghidra/
          git commit -q -m "ghidra: Headline Harry static analysis (INTRO.EXE, MAP.EXE)" || exit 0
          for i in 1 2 3 4 5; do
            git push origin HEAD:${GITHUB_REF_NAME} && break || {
              git pull --rebase -X theirs origin ${GITHUB_REF_NAME}; sleep 3; }
          done
