name: arena-sneakers-smoke

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - '.github/workflows/arena-sneakers-smoke.yml'
      - 'webxdc-dos/index.html'
      - 'webxdc-dos/scripts/build-rom-bundles.mjs'
      - 'webxdc-dos/public/roms/SNEAKERS*'
      - 'webxdc-dos/public/roms/README_SNEAKERS.md'
      - 'tests/webxdc-packages.test.mjs'
      - 'tools/smoke_sneakers_dosbox.sh'
      - 'tools/smoke_sneakers_original_dosbox.sh'
      - 'scripts/build-sneakers-press-kit-exact-xdc.mjs'
      - 'webxdc-sneakers-exact/**'
  pull_request:
    paths:
      - '.github/workflows/arena-sneakers-smoke.yml'
      - 'webxdc-dos/index.html'
      - 'webxdc-dos/scripts/build-rom-bundles.mjs'
      - 'webxdc-dos/public/roms/SNEAKERS*'
      - 'webxdc-dos/public/roms/README_SNEAKERS.md'
      - 'tests/webxdc-packages.test.mjs'
      - 'tools/smoke_sneakers_dosbox.sh'
      - 'tools/smoke_sneakers_original_dosbox.sh'
      - 'scripts/build-sneakers-press-kit-exact-xdc.mjs'
      - 'webxdc-sneakers-exact/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dosbox-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install DOSBox and headless display tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dosbox xvfb x11-utils xdotool imagemagick unzip tesseract-ocr

      - name: Run reconstructed Sneakers package under DOSBox
        env:
          SNEAKERS_SMOKE_DIR: ${{ runner.temp }}/sneakers-smoke
        run: bash tools/smoke_sneakers_dosbox.sh

      - name: Run original ZIP executable under DOSBox and Xvfb
        env:
          SNEAKERS_ORIGINAL_SMOKE_DIR: ${{ runner.temp }}/sneakers-original-smoke
        run: bash tools/smoke_sneakers_original_dosbox.sh

      - name: Upload DOSBox screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sneakers-dosbox-smoke
          path: |
            ${{ runner.temp }}/sneakers-smoke/
            ${{ runner.temp }}/sneakers-original-smoke/
          if-no-files-found: error
