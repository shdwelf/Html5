name: Gateway planner and Torrent Atlas review

on:
  pull_request:
    paths:
      - 'apps/riseup-invizible-gateway/**'
      - 'apps/torrent-atlas/**'
      - 'public/apps/torrent-atlas/**'
      - 'js/gateway-config.js'
      - 'js/vpn-analysis-tools.js'
      - 'gateway-config.html'
      - 'gateway-config.war'
      - 'research/gateway-config/**'
      - 'tools/gateway-config/**'
      - 'tools/torrent-atlas-interop*'
      - 'scripts/build-gateway*'
      - 'scripts/build-torrent-atlas.mjs'
      - 'tests/gateway*'
      - 'tests/vpn-analysis*'
      - 'tests/kodachi-evidence.test.mjs'
      - 'docs/research/kodachi-vpn-iso-inspection-2026-11-17.json'
      - 'tools/kodachi/**'
      - 'tools/ghidra_scripts/KodachiCryptoReport.java'
      - '.github/workflows/kodachi-native-analysis.yml'
      - 'tools/wikiinajar/public-corpus-policy.mjs'
      - 'tests/torrent*'
      - 'tests/fixtures/torrent-atlas*'
      - '.github/workflows/arena-gateway-build.yml'
  workflow_dispatch:

# No source-writing jobs, automatic commits, conflict-favoring rebases or pushes.
permissions:
  contents: read
  actions: read
concurrency:
  group: gateway-atlas-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  planner-and-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install locked build/test dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python3 -m pip install --no-deps --require-hashes --target "$RUNNER_TEMP/atlas-libtorrent" -r tools/torrent-atlas-interop-requirements.txt
      - name: Check delivered planner, inert samples, WAR and static Atlas
        env:
          GATEWAY_REQUIRE_JAVA: '1'
        run: |
          node scripts/build-torrent-atlas.mjs --check
          node scripts/build-html5-browser-catalog.mjs --check
          node --test tests/gateway-config.test.mjs tests/gateway-java.test.mjs tests/gateway-war.test.mjs tests/gateway-delivery.test.mjs tests/vpn-analysis-tools.test.mjs tests/kodachi-evidence.test.mjs tests/torrent-atlas*.test.mjs
      - name: Independently validate torrent metadata without network sessions
        run: PYTHONPATH="$RUNNER_TEMP/atlas-libtorrent" node tools/torrent-atlas-interop.mjs
      - name: Exercise real browser workers and offline UX
        run: |
          node tests/torrent-atlas-browser.mjs
          node --test tests/vpn-analysis-tools-browser.mjs
      - name: Build canonical JDK planner JAR and verify JS parity again
        env:
          GATEWAY_REQUIRE_JAVA: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/gateway-delivery"
          node scripts/build-gateway-java.mjs --out "$RUNNER_TEMP/gateway-delivery/gateway-config.jar"
          GATEWAY_JAR="$RUNNER_TEMP/gateway-delivery/gateway-config.jar" node --test tests/gateway-java.test.mjs
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK platform 34
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Reverify delivered planner APK and successful measured source build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk=research/gateway-config/gateway-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/delivered-gateway-signature.txt"
          diff -u research/gateway-config/apk-signature.txt "$RUNNER_TEMP/delivered-gateway-signature.txt"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump permissions "$apk" > "$RUNNER_TEMP/delivered-gateway-permissions.txt"
          diff -u research/gateway-config/apk-permissions.txt "$RUNNER_TEMP/delivered-gateway-permissions.txt"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml > "$RUNNER_TEMP/delivered-gateway-manifest.txt"
          diff -u research/gateway-config/apk-manifest.txt "$RUNNER_TEMP/delivered-gateway-manifest.txt"
          run_id="$(node -p 'JSON.parse(require("fs").readFileSync("research/gateway-config/build-receipt.json")).runId')"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$RUNNER_TEMP/gateway-measured-run.json"
          python3 - <<'PY'
          import json, os, pathlib
          receipt = json.loads(pathlib.Path('research/gateway-config/build-receipt.json').read_text())
          run = json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'gateway-measured-run.json').read_text())
          assert run['status'] == 'completed' and run['conclusion'] == 'success', 'measured build did not succeed'
          assert str(run['id']) == receipt['runId'] and run['head_sha'] == receipt['sourceCommit'], 'source/run mismatch'
          assert run['path'].split('@')[0] == '.github/workflows/arena-gateway-build.yml', 'unexpected build workflow'
          print('Delivered original planner APK signature, manifest, exact hashes/current inputs and successful measured source build verified. No packet protection claimed.')
          PY
      - name: Build and lint offline Android planner
        shell: bash
        run: |
          set -euo pipefail
          gradle -p apps/riseup-invizible-gateway assembleDebug lintDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gateway-gradle.log"
      - name: Expose bounded build diagnostics if the log CDN is unreachable
        if: failure()
        shell: python
        run: |
          import os, pathlib
          log = pathlib.Path(os.environ['RUNNER_TEMP'])/'gateway-gradle.log'
          if log.exists():
              text = log.read_text(errors='replace')[-16000:]
              print('::notice title=Gateway build diagnostics::'+text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
      - name: Inspect APK identity, permissions and signing; write measured receipt
        shell: bash
        run: |
          set -euo pipefail
          delivery="$RUNNER_TEMP/gateway-delivery"
          cp apps/riseup-invizible-gateway/app/build/outputs/apk/debug/app-debug.apk "$delivery/gateway-debug.apk"
          aapt="$ANDROID_HOME/build-tools/34.0.0/aapt"
          "$aapt" dump permissions "$delivery/gateway-debug.apk" | tee "$delivery/apk-permissions.txt"
          ! grep -Eq 'uses-permission|BIND_VPN_SERVICE' "$delivery/apk-permissions.txt"
          "$aapt" dump xmltree "$delivery/gateway-debug.apk" AndroidManifest.xml > "$delivery/apk-manifest.txt"
          ! grep -Fq 'android.net.VpnService' "$delivery/apk-manifest.txt"
          ! grep -Eq 'E: service' "$delivery/apk-manifest.txt"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$delivery/gateway-debug.apk" > "$delivery/apk-signature.txt"
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gateway-delivery'
          paths = ['GatewayConfig.java', 'GatewayVpnService.java', 'MainActivity.java']
          source = pathlib.Path('apps/riseup-invizible-gateway/app/src/main/java/org/arena/gateway')
          files = [source / p for p in paths] + [pathlib.Path(p) for p in ['apps/riseup-invizible-gateway/app/build.gradle', 'apps/riseup-invizible-gateway/app/src/main/AndroidManifest.xml', 'tools/gateway-config/GatewayMain.java', 'scripts/build-gateway-java.mjs', 'apps/riseup-invizible-gateway/build.gradle', 'apps/riseup-invizible-gateway/settings.gradle', 'apps/riseup-invizible-gateway/gradle.properties']]
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          outputs = {p.name: {'bytes': p.stat().st_size, 'sha256': digest(p)} for p in [out/'gateway-config.jar', out/'gateway-debug.apk']}
          receipt = {'schema': 2, 'sourceCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'runId': os.environ['GITHUB_RUN_ID'], 'runUrl': os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'], 'javaVersion': subprocess.check_output(['java','-version'], stderr=subprocess.STDOUT, text=True).strip(), 'protectionActive': False, 'testScope': 'Offline planner build/lint/manifest and JS-Java parity; no packet path or owner device test', 'sourceSha256': {str(p): digest(p) for p in files}, 'outputs': outputs}
          (out/'build-receipt.json').write_text(json.dumps(receipt, indent=2)+'\n')
          (out/'SHA256SUMS.txt').write_text(''.join(v['sha256']+'  '+k+'\n' for k,v in outputs.items()))
          # Only non-secret build outputs. This sandbox cannot reach the artifact
          # CDN; bounded Checks annotations let it retrieve this tiny review APK
          # and measured receipt without source-writing CI or a write token.
          def notice(title, text):
              print('::notice title='+title+'::'+text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          notice('Gateway planner build receipt', json.dumps(receipt, separators=(',',':')))
          for name in ['apk-permissions.txt', 'apk-manifest.txt', 'apk-signature.txt']:
              value = (out/name).read_bytes()
              if len(value) > 4000: raise SystemExit('Review text output exceeds its annotation bound')
              # Checks API messages are truncated at 4096 characters.
              chunks = [base64.b64encode(value[i:i+2000]).decode() for i in range(0,len(value),2000)]
              for index, chunk in enumerate(chunks): notice('Gateway output '+name+' '+str(index+1)+' of '+str(len(chunks)), chunk)
          PY
      - name: Expose the tiny original review APK without source-writing CI
        # Ten notices per step and 4096 characters per message are hard API
        # limits, not just log-viewer limits. Do not mix these with metadata.
        shell: python
        run: |
          import base64, os, pathlib
          value = (pathlib.Path(os.environ['RUNNER_TEMP'])/'gateway-delivery/gateway-debug.apk').read_bytes()
          if len(value) > 20000: raise SystemExit('APK exceeds bounded review transport; use its artifact instead')
          chunks = [base64.b64encode(value[i:i+2000]).decode() for i in range(0,len(value),2000)]
          for index, chunk in enumerate(chunks):
              print('::notice title=Gateway output gateway-debug.apk '+str(index+1)+' of '+str(len(chunks))+'::'+chunk)
      - name: Upload review-only planner deliverables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gateway-plan-only-review
          path: ${{ runner.temp }}/gateway-delivery/
          if-no-files-found: error
          retention-days: 14
