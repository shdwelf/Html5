name: arena-dropbox-probe

# Temporary diagnostic workflow (backlog round 56). The standing
# arena-drive-sync fetch of the 2026-09-27 worktree tarball has failed on every
# run since 2026-10-23: Drive's anonymous endpoints 404 on quota, and the
# Dropbox shared-link override served "Error - Simplify your life" rate-limit
# pages to the runner. This probe tries several fetch forms of the SAME valid
# public link (metadata re-verified 2026-10-29 via the authorized connector:
# public audience, download allowed, size 33,141,885), verifies the bytes by
# size + SHA-256 against the run-1 value from docs/chipwright-restore-status,
# and on success performs the already-fixed restore (drive-sync-apply --write)
# and commits everything. On failure it commits the probe log so the next
# attempt can see the exact responses. Delete this workflow once the restore
# lands.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probe URL forms and restore on success
        run: |
          set -u
          mkdir -p docs/drive-sync
          LOG=docs/drive-sync/dropbox-probe.log
          WANT=33141885
          EXPECT_SHA=c4cb0bc0276e2af4
          BASE="https://www.dropbox.com/scl/fi/8bqpiz6qenx8z9c7dvjfn/Html5-worktree-2026-09-27-12c463f.tar.gz"
          RLKEY="rlkey=wpuinbr6h9un7d0a083nzoh1j"
          UAB="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          {
            echo "# dropbox probe $(date -u '+%Y-%m-%dT%H:%M:%SZ') run=$GITHUB_RUN_ID"
          } > "$LOG"

          try_fetch() { # label url ua
            local label="$1" url="$2" ua="$3" sz
            echo "## form=$label" >> "$LOG"
            rm -f /tmp/p.bin
            curl -sS -A "$ua" -L --max-time 240 -c /tmp/pc.jar -b /tmp/pc.jar \
              -o /tmp/p.bin -w 'curl: code=%{http_code} type=%{content_type} dl=%{size_download}\n' \
              "$url" >> "$LOG" 2>&1 || true
            sz=$(stat -c%s /tmp/p.bin 2>/dev/null || echo 0)
            echo "size=$sz" >> "$LOG"
            if [ "$sz" = "$WANT" ]; then
              echo "WINNER form=$label sha256=$(sha256sum /tmp/p.bin | cut -d' ' -f1)" >> "$LOG"
              echo "$url" > /tmp/winner_url
              echo "$label" > /tmp/winner_form
              return 0
            fi
            head -c 300 /tmp/p.bin 2>/dev/null | tr -d '\0' | head -5 >> "$LOG" || true
            echo >> "$LOG"
            return 1
          }

          ok=0
          try_fetch browser-dl1 "${BASE}?${RLKEY}&dl=1" "$UAB" && ok=1
          if [ $ok = 0 ]; then try_fetch plain-dl1 "${BASE}?${RLKEY}&dl=1" "curl/8.5.0" && ok=1; fi
          if [ $ok = 0 ]; then try_fetch usercontent-dl1 \
            "https://dl.dropboxusercontent.com/scl/fi/8bqpiz6qenx8z9c7dvjfn/Html5-worktree-2026-09-27-12c463f.tar.gz?${RLKEY}&dl=1" \
            "$UAB" && ok=1; fi

          if [ $ok = 0 ]; then
            echo "## share-page st extraction" >> "$LOG"
            curl -sS -A "$UAB" -L --max-time 120 -c /tmp/pc.jar -b /tmp/pc.jar \
              "${BASE}?${RLKEY}" -o /tmp/share.html \
              -w 'share page: code=%{http_code} dl=%{size_download}\n' >> "$LOG" 2>&1 || true
            ST=$(grep -o 'st=[A-Za-z0-9_%-]*' /tmp/share.html 2>/dev/null | head -1 || true)
            echo "st param: ${ST:-none}" >> "$LOG"
            if [ -n "$ST" ]; then
              try_fetch st-dl1 "${BASE}?${RLKEY}&${ST}&dl=1" "$UAB" && ok=1
            fi
          fi

          if [ $ok = 1 ] && [ -f /tmp/winner_url ]; then
            echo "## restore" >> "$LOG"
            mkdir -p .arena-drive/payload
            cp /tmp/p.bin ".arena-drive/payload/Html5-worktree-2026-09-27-12c463f.tar.gz"
            rm -rf /tmp/snap && mkdir -p /tmp/snap
            tar xzf ".arena-drive/payload/Html5-worktree-2026-09-27-12c463f.tar.gz" -C /tmp/snap
            root=/tmp/snap
            if [ ! -f "$root/chipwright.html" ]; then
              f=$(find /tmp/snap -name chipwright.html -print -quit)
              [ -n "$f" ] && root=$(dirname "$f")
            fi
            echo "snapshot root=$root" >> "$LOG"
            find /tmp/snap -maxdepth 1 | head -10 >> "$LOG"
            man=docs/drive-sync/Html5-file-manifest-2026-09-27-12c463f.sha256
            node scripts/drive-sync-apply.mjs --manifest "$man" --snapshot "$root" --write \
              2>&1 | tee -a docs/drive-sync/restore-12c463f.log
          else
            echo "NO WINNER — see forms above" >> "$LOG"
          fi

      - name: Commit probe results
        if: always()
        run: |
          set -e
          git config user.name arena-dropbox-probe
          git config user.email arena-dropbox-probe@users.noreply.github.com
          git add -A
          if git diff --cached --name-only | grep -q '^\.arena-drive/payload/'; then
            echo "::error::snapshot payload staged for commit — refusing"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -q -m "dropbox-probe: URL-form probe for the worktree tarball"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || true
            sleep 3
          done
          echo "::error::push failed after 5 attempts"
          exit 1
