name: Unofficial PuTTY — Android APK and SSH controls

on:
  push:
    branches: ['arena/74f27a74-html5']
    paths:
      - 'apps/putty-android/**'
      - 'tools/putty-android/**'
      - 'tests/putty_android_source_test.py'
      - '.github/workflows/putty-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: putty-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    if: github.repository == 'shdwelf/Html5' && github.ref == 'refs/heads/arena/74f27a74-html5'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      ANDROID_NDK_VERSION: '27.2.12479018'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.7'
      - name: Core controls and official signed source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/putty-android
          bash tools/putty-android/test-core.sh | tee build/putty-android/core-tests.tap
          python3 -m unittest discover -s tests -p putty_android_source_test.py -v
          python3 tools/putty-android/run-checked.py source python3 tools/putty-android/fetch-source.py
      - name: Install Android build requirements
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/putty-android/run-checked.py sdk "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - name: Compile real PuTTY Plink and private PTY bridge for both ABIs
        run: python3 tools/putty-android/run-checked.py native bash tools/putty-android/build-native.sh
      - name: Assemble APK and instrumentation; enforce Android lint
        working-directory: apps/putty-android
        run: python3 ../../tools/putty-android/run-checked.py gradle gradle assembleDebug assembleDebugAndroidTest lintDebug --no-daemon --stacktrace
      - name: Start disposable loopback-only SSH fixture
        run: python3 tools/putty-android/run-checked.py fixture bash tools/putty-android/ci-ssh.sh
      - name: Enable KVM for the synthetic Android test device
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 emulator — native execution, host-key refusal, synthetic SSH, lifecycle privacy
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            adb reverse tcp:2222 tcp:2222
            cd apps/putty-android && python3 ../../tools/putty-android/run-checked.py android gradle connectedDebugAndroidTest --no-daemon --stacktrace -Pandroid.testInstrumentationRunnerArguments.sshUser="$CI_SSH_USER" -Pandroid.testInstrumentationRunnerArguments.sshPin="$CI_SSH_PIN" -Pandroid.testInstrumentationRunnerArguments.sshPassword="$CI_SSH_PASSWORD"
      - name: Verify APK bytes, signature, source licence, 16 KiB ELF alignment and test receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(sudo grep -c 'Accepted password for puttyci' /tmp/html5-putty-ci/sshd.log)" = 1
          python3 tools/putty-android/run-checked.py receipt python3 tools/putty-android/package-receipt.py
      - name: Store bounded test logs (never upload fixture secrets or home directories)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: putty-android-review-${{ github.run_id }}
          path: |
            research/putty-android/
            build/putty-android/core-tests.tap
            apps/putty-android/app/build/reports/lint-results-debug.html
            apps/putty-android/app/build/outputs/androidTest-results/connected/**/TEST-*.xml
          retention-days: 14
          if-no-files-found: warn
      - name: Deliver small tested APK to this session branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'arena/74f27a74-html5'
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          test "$REMOTE_HEAD" = "$GITHUB_SHA" || { echo 'Branch advanced during build: rerun instead of attaching a stale artifact.' >&2; exit 1; }
          git config user.name 'arena-putty-build'
          git config user.email 'arena-putty-build@users.noreply.github.com'
          git add research/putty-android/unofficial-putty-0.85-review.apk \
            research/putty-android/build-receipt.json research/putty-android/SHA256SUMS.txt \
            research/putty-android/apk-signature.txt research/putty-android/PUTTY-LICENCE.txt
          git commit -m 'build(android): deliver tested unofficial PuTTY 0.85 review APK'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Stop disposable SSH server
        if: always()
        shell: bash
        run: |
          if test -f /tmp/html5-putty-ci/sshd.pid; then
            sudo kill "$(cat /tmp/html5-putty-ci/sshd.pid)"
          fi
