name: arena-gnis-fetch

# Fetches USGS GNIS DomesticNames state text files and extracts the
# candidate rows for the next city-subsurface batch (T4.1). The GNIS web
# app is a JavaScript SPA over a POST API and the sandbox's egress is
# allowlisted, so the runner does the download; only the small screened
# extract is committed (resources/city-subsurface/gnis-candidates-*.json),
# never the bulk gazetteer. The extract path is deliberately NOT a
# trigger path, so the result commit cannot retrigger the fetch.

on:
  push:
    branches: ['arena/ed5d4b7c-html5']
    paths:
      - '.arena-gnis/candidates.json'
      - '.github/workflows/arena-gnis-fetch.yml'
      - 'tools/gnis_extract.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Extract GNIS candidate rows
        run: |
          set -euo pipefail
          python3 tools/gnis_extract.py .arena-gnis/candidates.json \
            resources/city-subsurface/gnis-candidates-batch7.json
          python3 - <<'PY'
          import json
          d = json.load(open("resources/city-subsurface/gnis-candidates-batch7.json"))
          for st, pack in d["states"].items():
              print(st, len(pack["rows"]), "rows; zip sha256", pack["zipSha256"][:16])
              assert pack["rows"], f"no candidate rows extracted for {st}"
          PY

      - name: Commit the extract back to the branch
        run: |
          git config user.name "arena-gnis-fetch"
          git config user.email "actions@github.com"
          git add resources/city-subsurface/gnis-candidates-batch7.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "GNIS batch-7 candidate extract (run ${{ github.run_id }}) [skip ci]"
          git push
