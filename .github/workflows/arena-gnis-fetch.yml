name: arena-gnis-fetch

# Fetches USGS GNIS DomesticNames state text files and extracts the named
# candidate rows. The GitHub runner has access to the published state zips;
# only small screened extracts are committed, never the bulk gazetteers.

on:
  push:
    branches: ['arena/8c721d44-html5', 'arena/fb1c7be1-html5']
    paths:
      - '.arena-gnis/candidates.json'
      - '.github/workflows/arena-gnis-fetch.yml'
      - 'tools/gnis_extract.py'
  workflow_dispatch:
    inputs:
      target:
        description: Which pinned candidate request to extract
        type: choice
        required: true
        default: newyork
        options:
          - newyork
          - current

env:
  GNIS_REQUEST: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'newyork' && '.arena-gnis/candidates-newyork.json' || '.arena-gnis/candidates.json' }}
  GNIS_OUTPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'newyork' && 'resources/city-subsurface/gnis-candidates-newyork.json' || 'resources/city-subsurface/gnis-candidates-batch7.json' }}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Extract GNIS candidate rows
        shell: bash
        run: |
          mkdir -p .arena-gnis
          {
            echo "run ${{ github.run_id }} attempt ${{ github.run_attempt }} · $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "request: $GNIS_REQUEST"
            echo "output: $GNIS_OUTPUT"
            if python3 tools/gnis_extract.py "$GNIS_REQUEST" "$GNIS_OUTPUT"; then
              echo "extract exit: 0"
            else
              status=$?
              echo "extract exit: $status"
              exit "$status"
            fi
            python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ["GNIS_OUTPUT"])
          if p.exists():
              d = json.loads(p.read_text())
              for st, pack in d["states"].items():
                  print(st, len(pack["rows"]), "candidate rows; zip sha256", pack["zipSha256"][:16])
          PY
          } > .arena-gnis/last-run.log 2>&1
          cat .arena-gnis/last-run.log
          test -s "$GNIS_OUTPUT"

      - name: Commit the extract back to the selected branch
        if: always()
        run: |
          git config user.name "arena-gnis-fetch"
          git config user.email "actions@github.com"
          git add .arena-gnis/last-run.log
          if [ -f "$GNIS_OUTPUT" ]; then git add "$GNIS_OUTPUT"; fi
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "GNIS candidate extract for ${{ inputs.target || 'current' }} (run ${{ github.run_id }}) [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
