name: arena-extract
on:
  push:
    paths:
      - '.arena-relay/extract*'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Extract selected ZIP members via ranges
        run: python3 .arena-relay/scripts/extract.py 2>&1 | tee .relay/extract.log
      - name: Commit samples
        if: always()
        run: |
          git config user.name arena-relay
          git config user.email arena-relay@users.noreply.github.com
          git add -f .relay/samples .relay/extract.log
          git commit -q -m "relay: extracted samples" || true
          for i in 1 2 3 4 5; do git push origin HEAD:${GITHUB_REF_NAME} && break || git pull --rebase -X theirs origin ${GITHUB_REF_NAME}; sleep 3; done
