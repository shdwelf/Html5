name: arena-deploy-sync-run2
on:
  push:
    branches:
      - 'arena/deploy-sync-2'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch one-time deploy key from draft release bag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rel=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/387262990")
          echo "$rel" | jq -r '.body' | sed -n '/-----BEGIN OPENSSH PRIVATE KEY-----/,/-----END OPENSSH PRIVATE KEY-----/p' > /tmp/deploy_key
          install -d -m 700 ~/.ssh
          install -m 600 /tmp/deploy_key ~/.ssh/deploy_key
          shred -u /tmp/deploy_key 2>/dev/null || rm -f /tmp/deploy_key
          while IFS= read -r line; do
            case "$line" in *-----*) ;; *) [ "${#line}" -gt 12 ] && echo "::add-mask::$line";; esac
          done < ~/.ssh/deploy_key
      - name: Checkout analysis branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a09164-html5
          fetch-depth: 0
      - name: Push to Html5-sync-incoming (deploy key, SSH)
        run: |
          set -euo pipefail
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key
          git remote add incoming git@github.com:shdwelf/Html5-sync-incoming.git
          # fast-forward / create the per-session sync branch
          git push --force-with-lease incoming HEAD:refs/heads/arena/01a09164-html5-sync-incoming
      - name: Burn one-time key bag (delete draft release)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/387262990" && echo bag-deleted
      - name: Delete own trigger branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs/heads/arena%2Fdeploy-sync-2" && echo branch-deleted || true
