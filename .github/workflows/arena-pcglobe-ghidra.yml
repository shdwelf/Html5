name: PC Globe — Ghidra static analysis

# Disassembles/decompiles PCGLOBE.EXE (1990, 16-bit DOS MZ) with headless
# Ghidra on a runner and commits the reports, plus static string probes of
# the country-database files (COUNTRY1/2.DAT, DATABASE.DAT, NAMES.DAT) as
# the layout head-start for the Java port experiment. Same pattern as
# arena-headline-harry-ghidra. Pure static analysis — the program is never
# executed, emulated, or modified.

on:
  push:
    branches: ['arena/876f9abb-html5']
    paths:
      - '.arena-pcglobe/ghidra.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GHIDRA_VERSION: '12.1.4'
      GHIDRA_DATE: '20260921'
      GHIDRA_SHA256: 'ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned official Ghidra release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ghidra.zip"
          url="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/ghidra_${GHIDRA_VERSION}_PUBLIC_${GHIDRA_DATE}.zip"
          curl -fL --retry 6 --retry-all-errors --connect-timeout 30 "$url" -o "$archive"
          echo "$GHIDRA_SHA256  $archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/ghidra_${GHIDRA_VERSION}_PUBLIC/support/analyzeHeadless"

      - name: Require fetched media
        shell: bash
        run: |
          test -f .xfer/pcglobe/PCGLOBE.EXE || {
            echo "::error title=missing input::Run arena-pcglobe-fetch first - .xfer/pcglobe is produced by the archive.org fetch.\""
            exit 2
          }
          head -c2 .xfer/pcglobe/PCGLOBE.EXE | grep -q MZ || {
            echo "::error title=bad input::PCGLOBE.EXE is not an MZ executable"
            exit 2
          }
          (cd .xfer/pcglobe && sha256sum -c SHA256SUMS)

      - name: Disassemble PCGLOBE.EXE
        shell: bash
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/pcglobe-reports"
          projects="$RUNNER_TEMP/ghidra-projects"
          headless="$RUNNER_TEMP/ghidra_${GHIDRA_VERSION}_PUBLIC/support/analyzeHeadless"
          mkdir -p "$reports" "$projects"
          timeout 20m "$headless" "$projects" PCGLOBE_EXE \
            -import ".xfer/pcglobe/PCGLOBE.EXE" \
            -analysisTimeoutPerFile 900 \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" \
            -postScript EncyclopediaReport.java "$reports" \
            -deleteProject
          find "$reports" -type f | sort
          test "$(find "$reports" -name '*.ghidra.json' | wc -l)" -gt 0

      - name: Static string probes of the database files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pcglobe-reports/dat-strings"
          python3 - "$RUNNER_TEMP/pcglobe-reports/dat-strings" <<'PY'
          import pathlib, re, sys
          outdir = pathlib.Path(sys.argv[1])
          for name in ("COUNTRY1.DAT", "COUNTRY2.DAT", "DATABASE.DAT", "NAMES.DAT", "MENU.DAT", "TEXTMENU.DAT", "HELP.DAT"):
              p = pathlib.Path(f".xfer/pcglobe/{name}")
              if not p.exists():
                  continue
              data = p.read_bytes()
              runs = re.findall(rb"[\x20-\x7e]{4,}", data)
              lines = [f"# {name}: {len(data)} bytes, {len(runs)} printable runs >=4"]
              off = 0
              pos = []
              for m in re.finditer(rb"[\x20-\x7e]{4,}", data):
                  pos.append((m.start(), m.group().decode("ascii", "replace")))
              for o, s in pos[:400]:
                  lines.append(f"{o:08x}  {s}")
              (outdir / f"{name}.strings.txt").write_text("\n".join(lines) + "\n")
              print(name, len(data), len(pos))
          PY

      - name: Summarize reports
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/pcglobe-reports" > "$RUNNER_TEMP/REPORT.md" <<'PY'
          import json, pathlib, sys
          d = pathlib.Path(sys.argv[1])
          print("# PC Globe — headless Ghidra report\n")
          print("Generated by arena-pcglobe-ghidra workflow. Pure static analysis;")
          print("the program was never executed. Binary is a 16-bit real-mode DOS MZ (1990).\n")
          for j in sorted(d.glob("*.ghidra.json")):
              m = json.loads(j.read_text())
              print(f"\n## {m['program']}")
              for k in ("executableFormat", "language", "compiler", "imageBase", "md5", "sha256"):
                  print(f"- {k}: `{m.get(k)}`")
              print(f"- functions: {len(m.get('functions', []))}")
              for f in m.get("functions", [])[:16]:
                  print("  -", f if isinstance(f, str) else f.get("name"), "" if isinstance(f, str) else f.get("address", ""))
          print("\nFull artifacts: `.asm`, `.c`, `.strings.txt`, `.ghidra.json` next to this file;")
          print("database string probes under `dat-strings/`.\n")
          PY
          cat "$RUNNER_TEMP/REPORT.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/pcglobe-ghidra
          cp "$RUNNER_TEMP/pcglobe-reports"/* research/pcglobe-ghidra/ 2>/dev/null || true
          cp -r "$RUNNER_TEMP/pcglobe-reports"/dat-strings research/pcglobe-ghidra/ 2>/dev/null || true
          cp "$RUNNER_TEMP/REPORT.md" research/pcglobe-ghidra/ANALYSIS.md
          git config user.name arena-ghidra-research
          git config user.email arena-ghidra-research@users.noreply.github.com
          git add research/pcglobe-ghidra/
          git commit -q -m "ghidra: PC Globe static analysis (PCGLOBE.EXE) + DAT string probes" || exit 0
          for i in 1 2 3 4 5; do
            git push origin HEAD:${GITHUB_REF_NAME} && break || {
              git pull --rebase -X theirs origin ${GITHUB_REF_NAME}; sleep 3; }
          done
