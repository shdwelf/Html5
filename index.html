<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#07080d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Keyspace Viewer</title>
  <link rel="stylesheet" href="./css/viewer.css" />
  <link rel="icon" href="./icon.png" />
  <script src="./webxdc.js"></script>
</head>
<body>
  <canvas id="stage"></canvas>

  <header class="topbar">
    <div>
      <h1>Keyspace Viewer</h1>
      <p>BIP-39 manifold · WASM entropy · WebGL</p>
    </div>
  </header>

  <section class="sheet" id="sheet">
    <div class="handle" aria-hidden="true"></div>
    <button type="button" class="sheet-toggle" id="sheetToggle" aria-expanded="false">Phrase &amp; entropy</button>
    <div class="sheet-body">
      <label for="wc">Phrase length</label>
      <div class="row">
        <select id="wc">
          <option value="12" selected>12 words · 128-bit</option>
          <option value="15">15 words · 160-bit</option>
          <option value="18">18 words · 192-bit</option>
          <option value="21">21 words · 224-bit</option>
          <option value="24">24 words · 256-bit</option>
        </select>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="act" id="gen" type="button">Sample entropy</button>
        <button class="act" id="apply" type="button">Project</button>
        <button class="act" id="share" type="button">Share in chat</button>
      </div>
      <p class="legend" id="wcNote"></p>

      <label for="phrase">Mnemonic phrase</label>
      <textarea id="phrase" spellcheck="false" autocomplete="off" autocapitalize="none" enterkeyhint="done" placeholder="enter or generate a phrase"></textarea>
      <div id="status" class="status warn">Loading engine…</div>
      <div id="chips" class="chips"></div>

      <div class="metric-grid">
        <div class="metric"><span>Wordlist</span><b id="wl">—</b></div>
        <div class="metric"><span>Entropy</span><b id="entBits">—</b></div>
        <div class="metric"><span>Checksum</span><b id="csBits">—</b></div>
        <div class="metric"><span>Keyspace</span><b id="space">—</b></div>
      </div>
      <label>Entropy hex</label>
      <div class="bits" id="hex">—</div>
      <label>Engine</label>
      <div class="bits" id="model">WASM · WebGL · Three.js (vendored)</div>
      <p class="legend">Cyan = 2048-word keyspace. Green = phrase path. Amber = entropy field. Last chip carries checksum bits. Geometry only — no wallet derivation.</p>
    </div>
  </section>

  <script type="module" src="./js/viewer.js"></script>
</body>
</html>
