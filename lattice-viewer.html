<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lattice Viewer</title><style>body{margin:0;background:#0b1020;color:#e8edf7;font:15px system-ui;max-width:1100px;margin:auto;padding:24px}h1{color:#8be9fd}section{background:#151d35;border:1px solid #2c3a60;border-radius:12px;padding:18px;margin:14px 0}label{display:inline-grid;gap:4px;margin-right:14px}input,button{background:#0b1020;color:inherit;border:1px solid #53658d;border-radius:6px;padding:8px}button{cursor:pointer;background:#22577a}.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:12px}.cell{text-align:center;padding:10px 3px;background:#202e50;border-radius:5px}.cell b{display:block;color:#8be9fd;font-size:11px}.matrix{display:grid;grid-template-columns:repeat(4,minmax(55px,1fr));gap:6px}.note{color:#aebbd5;line-height:1.5}code{color:#f1fa8c}</style><h1>⌬ Lattice Viewer</h1><p class="note">A small, offline viewer for <code>Zq[x]/(xⁿ + 1)</code>. Schoolbook arithmetic only: this is a mathematics laboratory, not ML-KEM or ML-DSA.</p><section><label>n <input id=n type=number min=2 max=8 value=4></label><label>q <input id=q type=number min=3 value=17></label><button id=reset>Build ring</button><div id=ring></div></section><section><h2>Polynomial multiplication</h2><div class=matrix><label>a₀… <input id=a value="1,2,3,4"></label><label>b₀… <input id=b value="4,3,2,1"></label></div><button id=mul>Multiply</button><p id=out></p></section><section><h2>Module-LWE teaching sample</h2><p class=note>Displays <code>t = A·s + e mod q</code> for a 1×2 toy matrix.</p><p id=lwe></p></section><script>
const $=x=>document.getElementById(x), norm=(x,q)=>(x%q+q)%q;let R;
function build(){let n=+$('n').value,q=+$('q').value;R={n,q,m:(a,b)=>{let o=Array(n).fill(0);for(let i=0;i<n;i++)for(let j=0;j<n;j++){let d=i+j;o[d%n]+=((d>=n)?-1:1)*a[i]*b[j]}return o.map(x=>norm(x,q))}};render();}
function p(s){let x=s.split(',').map(Number);if(x.length!==R.n)throw Error('Need exactly '+R.n+' coefficients');return x.map(v=>norm(v,R.q))}
function render(){let cells=Array.from({length:R.n},(_,i)=>`<div class=cell><b>x^${i}</b> ${i?'':'1'}</div>`);$('ring').innerHTML=`<p>Ring: <code>Z_${R.q}[x]/(x^${R.n}+1)</code></p><div class=grid>${cells.join('')}</div>`}
$('reset').onclick=build;$('mul').onclick=()=>{try{$('out').textContent='a · b = ['+R.m(p($('a').value),p($('b').value)).join(', ')+']';}catch(e){$('out').textContent=e.message}};
function sample(){let s=[3,4],e=[5],A=[1,2];$('lwe').textContent=`A = [1, 2], s = [3, 4], e = [5] → t = [${norm(A[0]*s[0]+A[1]*s[1]+e[0],R.q)}] (residual t − A·s = [${e[0]}])`};build();sample();
</script>
