ssel) to compress meteorological and tactical reports into brief 4- to 7-letter codes, reducing transmission durations to under 20 seconds.",details:['Introduced to protect submarines from Allied High-Frequency Direction Finding (HFDF or "Huff-Duff") triangulation.',"The Kurzsignalheft mapped situational tactical sentences into short 4-letter groups.","The Wetterkurzschlüssel compressed barometric pressure, wind direction, wind speed, visibility, and temperature into a 6-to-7-letter group.","These compressed groups were then enciphered using the naval Enigma machine.","Captured on 9 May 1941 from the sinking submarine U-110 (by HMS Bulldog), supplying Bletchley Park with the earliest Dolphin cribs.","Captured on 30 October 1942 from U-559 by Anthony Fasson and Colin Grazier of HMS Petard (both drowned during the salvage), providing the crucial second edition of the Wetterkurzschlüssel.",'Bletchley Park’s Hut 8 matched predicted local weather readings with the WKS tables to generate daily Enigma M4 "Shark" cribs.'],significance:'The use of short, compressed tactical formats was a brilliant German technical success, demonstrating that minimizing "time-on-air" could defeat direction finding. Paradoxically, the rigid predictability of the weather reporting structures handed Bletchley Park the exact cribs needed to shatter the Naval Enigma.'},{id:"hollow-nickel",name:"The Hollow Nickel Microfilm (VIC Cipher)",location:"Brooklyn, New York / FBI HQ & CIA",era:"Cold War · 1953-1957",status:"Defected 1957; Rudolf Abel arrested",description:"In June 1953, a Brooklyn newsboy accidentally dropped a nickel which split open to reveal a tiny sheet of microfilm containing columns of numbers. The FBI spent four years unable to decrypt it—until a Soviet spy defected.",details:["The cipher was the VIC cipher, used by KGB agent Reino Häyhänen (VIKTOR) in New York.","The message began with a congratulations on a safe arrival and confirmation of letter receipts.","Considered the most complex and secure manual pencil-and-paper cipher system ever issued in the field.","Combined a dynamic straddling checkerboard with chain additions, columnar transpositions, and personal/date keys.","The FBI spent four years with the message, completely unable to make any cryptanalytic progress.","Only Häyhänen's defection in May 1957 and his disclosure of the keys enabled the decryption of the microfilm.","The decrypted message led to the arrest of KGB master spy Colonel Rudolf Abel (William Fisher)."],significance:"The Hollow Nickel Case is a legendary chapter in Cold War counterintelligence, proving that a meticulously constructed manual cipher combining fractionation and transpositions can resist state-level cryptanalytic attack indefinitely, falling only when a human link defects."},{id:"rubicon",name:"Operation RUBICON / Crypto AG",location:"Zug, Switzerland / CIA & BND",era:"Cold War · 1950s-2018",status:"Revealed in 2020 after five decades",description:"Crypto AG sold trusted encryption equipment worldwide while a secret CIA-BND ownership arrangement enabled deliberately weakened systems to be read by Western intelligence.",details:["Boris Hagelin and William Friedman maintained a 1950s gentlemen's understanding over sales to selected states","CIA and West Germany's BND jointly purchased Crypto AG on 12 June 1970","The operation was first called THESAURUS and later RUBICON; Crypto AG was codenamed MINERVA","Machines were weakened through algorithms, modifications, or insecure customer-specific operating instructions","Equipment was sold to more than 120 countries, including adversaries and some NATO partners","BND withdrew in the early 1990s; CIA continued sole ownership until the company assets were liquidated","Hans Bühler, an unaware Crypto AG salesman, was detained and interrogated in Iran for nine months in 1992","The case demonstrates that an implementation or supplier can defeat even convincing-looking cryptography"],significance:"Described in the CIA history as the intelligence coup of the century, RUBICON is also a lasting warning: security depends on trustworthy algorithms, implementations, operating procedures, vendors, and key generation—not merely on owning a device marked secure."},{id:"kryptos",name:"Kryptos",location:"CIA Headquarters, Langley, Virginia",era:"Modern · 1990",status:"K1–K3 Solved · K4 UNSOLVED after 35 years",description:"A 12-foot copper sculpture in the CIA courtyard by artist Jim Sanborn, encoded with four cryptographic puzzles totaling 865 characters.",details:["K1 — Vigenère cipher, key PALIMPSEST — solved publicly 1999 (NSA solved secretly 1992)","K2 — Vigenère cipher, key ABSCISSA — solved 1999","K3 — Transposition cipher, quotes from Howard Carter's diary at King Tut's tomb — solved 1999","K4 — Unknown system, only 97 characters — UNSOLVED as of 2026","Sanborn released four hints: BERLIN, CLOCK, NORTHEAST, EAST","Cryptographic consultant: Edward Scheidt, former CIA cryptographer","In November 2025, Sanborn auctioned the K4 solution archive for over $200,000"],significance:"One of the most famous unsolved cryptographic puzzles in the world. K4 has resisted professional cryptologists, academics, and amateurs for over three decades."},{id:"bombe",name:"Turing-Welchman Bombe",location:"Bletchley Park, UK / National Museum of Computing",era:"WWII · 1940",status:"Original destroyed 1945 · Reconstructed 2007",description:`Electromechanical device designed by Alan Turing (August 1940 prototype "Agnus") and perfected by Gordon Welchman's diagonal board, used to break Enigma-enciphered messages.`,details:['First Bombe "Victory" began operations at Bletchley Park on 14 March 1940',"211 Bombe machines were built and operated by war's end","1,676 female WRNS (Wrens) and 263 male RAF personnel operated the machines","Manufactured by the British Tabulating Machine Company (BTM)","Exploited the flaw that no Enigma letter could ever encrypt to itself","Welchman's diagonal board dramatically reduced false-positive stops","Operators worked in shifts around the clock in dark, oppressive rooms","US Navy adapted the design for four-rotor Enigma M4, operated by WAVES"],significance:"Alongside Colossus, widely regarded as having shortened WW2 and saved countless lives. Marked one of the earliest milestones on the road to modern digital computing."},{id:"sigaba",name:"SIGABA / ECM Mark II",location:"National Cryptologic Museum, Fort Meade",era:"WWII · 1940–1950s",status:"Never broken by enemy cryptanalysts",description:"The most important American rotor cipher machine of WW2, with three banks of five rotors each in a completely irregular stepping arrangement.",details:["Three rotor banks: main cipher rotors, control rotors, and index rotors","Used by U.S. forces from the 1940s onward","Never broken during its entire operational life","One SIGABA at the National Cryptologic Museum was used by President Roosevelt to communicate with Winston Churchill","Featured 15 rotors total with pseudorandom stepping controlled by the second bank","Approximately 10,000 units produced","Remained in service until the mid-1950s"],significance:"The gold standard of Allied high-level cryptographic security throughout WW2. Its unbroken status demonstrates the value of Turing/Friedman-style irregular rotor stepping."},{id:"purple",name:"PURPLE (97-shiki O-bun In-ji-ki)",location:"National Cryptologic Museum, Fort Meade (partial reproduction)",era:"WWII · 1939–1945",status:"Broken by U.S. cryptologists BEFORE Pearl Harbor",description:"Japanese diplomatic cipher machine using stepping switches (not rotors) — a design entirely different from the German Enigma.",details:["Broken by William Friedman's Signal Intelligence Service team in September 1940","Reconstruction built without ever seeing an actual PURPLE machine","Intelligence derived from PURPLE was codenamed MAGIC","Contributed to the U.S. Navy victory at the Battle of Midway","Japan continued to use PURPLE throughout the war, believing it unbreakable","Only fragments of PURPLE machines were ever recovered"],significance:"The MAGIC intelligence produced by breaking PURPLE gave the U.S. unprecedented insight into Japanese diplomatic and military intentions throughout WW2."},{id:"colossus",name:"Colossus Mark II",location:"The National Museum of Computing, Bletchley Park",era:"WWII · 1944",status:"10 units built · 8 destroyed 1945 · rebuilt 2007",description:"The world's first programmable digital electronic computer, built by Tommy Flowers to break the Lorenz SZ40/42 (Tunny) cipher used by German High Command.",details:["Mark I operational January 1944; Mark II June 1944 (five times faster)","2,500 vacuum tubes in Mark II","Read paper tape at 5,000 characters per second (max 9,700)","Used shift registers, counters, and Boolean logic","Programmable via switches and plug panels","Remained classified until the late 1970s","Rebuilt by Tony Sale and team at Bletchley Park, operational since 2007"],significance:"Beat America's ENIAC by two years but received no historical credit until declassification. Fundamentally shaped the trajectory of postwar computing."},{id:"fialka",name:"Fialka M-125",location:"Various museums including Crypto Museum, Netherlands",era:"Cold War · 1965–1990s",status:"Top secret until 1990s",description:`Soviet 10-rotor cipher machine, developed as an "improved Enigma" fixing all of Enigma's known cryptographic weaknesses.`,details:["10 rotors, each with 30 pins (vs Enigma's 3–4 rotors with 26)","Rotors stepped in opposite directions","Punched card reader replaced the plugboard",'Special "magic" reflector circuit that allowed a letter to encrypt to itself',"Used by all Warsaw Pact nations","Each country had its own custom rotor wiring set","Never broken during its operational period"],significance:"The Soviet answer to the KL-7. Its top-secret status until the 1990s means much of its operational history remains classified in Russian archives."},{id:"venona",name:"VENONA Project Papers",location:"National Cryptologic Museum & NSA Historical Collection",era:"Cold War · 1943–1980",status:"Declassified 1995",description:"A U.S. Army Signal Intelligence Service (later NSA) counterintelligence program to decrypt Soviet intelligence agency messages sent during WWII.",details:['Exploited Soviet reuse of One-Time Pad key material (a "two-time pad" mistake)',"Began under Gene Grabeel in February 1943","Meredith Gardner made the first substantial break in 1946","Identified Klaus Fuchs, Julius & Ethel Rosenberg, Alger Hiss, and Kim Philby as Soviet agents","Approximately 3,000 messages partially or fully decrypted","Only 1% of intercepted traffic was ever readable","Full declassification came only in 1995"],significance:"Proves that even the theoretically unbreakable One-Time Pad fails if operators reuse key material — a lesson written in the identities of the Cambridge Five and the Manhattan Project spies."},{id:"zimmermann",name:"Zimmermann Telegram",location:"National Archives, UK / U.S. National Archives",era:"WWI · January 1917",status:"Broken by British Room 40",description:"A secret diplomatic communication from the German Foreign Office proposing a military alliance with Mexico against the United States.",details:["Sent by German Foreign Secretary Arthur Zimmermann on 17 January 1917","Encrypted with German diplomatic code 0075 (later switched to 13040)","Intercepted and partially decrypted by Nigel de Grey at Room 40 (British Admiralty)",'Offered Mexico "generous financial support" and the return of Texas, New Mexico, and Arizona',"Publication in U.S. newspapers on 1 March 1917 shifted American public opinion","Direct contributor to the U.S. declaration of war on Germany on 6 April 1917"],significance:"The single most consequential cryptographic decryption in history — it directly changed the course of World War I by bringing the United States into the conflict."},{id:"code-talkers",name:"Navajo Code Talkers",location:"National Cryptologic Museum & Museum of the American Indian",era:"WWII · 1942–1945",status:"Never broken by Axis forces",description:"Marine Corps units of Navajo speakers who used their language, augmented by a specialized 400-word military vocabulary, as an unbreakable battlefield code.",details:["29 original Navajo Code Talkers recruited in May 1942 at Camp Pendleton","Ultimately over 400 Navajo Marines served in the Pacific Theater",'Custom vocabulary invented for military terms (e.g., "iron fish" = submarine)',"Deployed at Iwo Jima, Guadalcanal, Tarawa, Peleliu, and Okinawa","At Iwo Jima, six Navajo Code Talkers sent over 800 messages in 48 hours — all without error","Program remained classified until 1968","Congressional Gold Medal awarded to the original 29 in 2001"],significance:"Demonstrated that the most sophisticated cryptographic system of WW2 was not a machine, but human ingenuity — a code the Japanese never broke and could not even identify as a language."}],Th=[{name:"Caesar Cipher",category:"Substitution",yearInvented:"~50 BC",inventor:"Julius Caesar",description:"Shift each letter by a fixed number of positions. Caesar himself used a shift of 3.",strength:"Trivially broken by frequency analysis or brute-force (only 25 possible shifts)."},{name:"Atbash",category:"Substitution",yearInvented:"~500 BC",inventor:"Ancient Hebrew scribes",description:"Reverse alphabet: A↔Z, B↔Y, etc. Used in Hebrew religious texts.",strength:"No key; trivially broken."},{name:"Vigenère",category:"Polyalphabetic",yearInvented:"1553",inventor:"Giovan Battista Bellaso (misattributed to Blaise de Vigenère)",description:'Repeating keyword shifts each letter differently. Called "le chiffre indéchiffrable" for 300 years.',strength:"Broken by Charles Babbage (1854) and Friedrich Kasiski (1863) using frequency analysis on the keyword length."},{name:"Playfair",category:"Digraph Substitution",yearInvented:"1854",inventor:"Charles Wheatstone (promoted by Lord Playfair)",description:"5x5 grid based on a keywo  key block cipher, first public U.S. federal encryption standard.",strength:"Broken by brute force in 1998 (EFF Deep Crack, 22 hours). Officially withdrawn 2005. Triple DES extended its life to 2023."},{name:"AES (Advanced Encryption Standard)",category:"Modern Block Cipher",yearInvented:"2001",inventor:"Vincent Rijmen & Joan Daemen (Rijndael)",description:"Successor to DES. Selected by NIST from 15 candidates. 128/192/256-bit keys, 10/12/14 rounds.",strength:"No practical attack better than brute force. AES-256 is used to protect U.S. TOP SECRET information."},{name:"RSA",category:"Public Key",yearInvented:"1977",inventor:"Rivest, Shamir, Adleman (MIT)",description:"Asymmetric cipher based on the difficulty of factoring large prime products.",strength:"Secure with sufficient key size (2048+ bits). Threatened by future quantum computers running Shor's algorithm."},{name:"ChaCha20",category:"Modern Stream Cipher",yearInvented:"2008",inventor:"Daniel J. Bernstein",description:"256-bit key stream cipher, chosen by Google to replace RC4 in TLS.",strength:"No known practical attacks. Faster than AES on devices without hardware acceleration."}],w1=[{name:"Alan Turing",years:"1912-1954",organization:"GC&CS, Hut 8",field:"Naval Enigma / computing",contribution:"Led the attack on German Naval Enigma, designed core ideas behind the British Bombe, and later formulated foundational concepts in computing and artificial intelligence.",source:"GCHQ History"},{name:"Gordon Welchman",years:"1906-1985",organization:"GC&CS, Hut 6",field:"Enigma / cryptanalytic engineering",contribution:"Created the Bombe diagonal board, dramatically reducing false stops, and built an industrial organization for exploiting German Army and Air Force Enigma traffic.",source:"GCHQ History"},{name:"Mavis Batey",years:"1921-2013",organization:"GC&CS, Dilly Knox team",field:"Italian Naval and Abwehr Enigma",contribution:"Her Enigma breakthroughs contributed to victory at Cape Matapan and to reading Abwehr tr 08538 20333 27838 52662 13523 27833 39332 81488 25260 82636`,info:"Published in 2010 by Dirk Rijmenants, this cipher uses only pencil, paper, and a secret key phrase. The accompanying poem is a hint to the key but is not itself used in the encryption. There are 600 digits in 120 five-digit groups. This remains one of the most difficult manual cryptograms ever published.",solvedBy:"Oleksii Sylichenko (Ukraine)",solvedDate:"8 February 2023 — the first and only person to solve it since publication in 2010"},Cc=[{id:"art-schmeh",title:"Klaus Schmeh & Cipherbrain: The Working Canon of Unsolved Cryptograms",author:"Research Summary",category:"Modern Cryptologic Scholarship",summary:"How a German computer scientist turned a personal blog into the standard reference for historical unsolved ciphers, catalogued the field, and built a global community of amateur cryptanalysts.",content:`Klaus Schmeh is a German computer scientist, security consultant at the firm cryptovision, and — by output — the most-published author on cryptology in the world: 14 books, over 200 articles, more than 700 blog posts, and 20 research papers.

His public reputation rests less on any single book than on **Cipherbrain**, the blog he ran from 2013 to 2022 at scienceblogs.de/klausis-krypto-kolumne. It became, by consensus, the most important online forum for unsolved historical cryptograms. The NSA has forwarded encrypted-document enquiries to Schmeh for analysis. His blog readers have collectively broken dozens of old cryptograms.

### The Top-50 Unsolved Encrypted Messages
Cipherbrain's defining contribution is Schmeh's **Top-50 Unsolved Encrypted Messages** — a ranked catalogue built up over years of posts, each entry treated to detailed reporting, analysis, and reader challenges. The list has become a de facto working canon for the field.

Position 1 is unsurprisingly the **Voynich Manuscript**. Position 2 is **Kryptos K4**. But the interest of the list lies further down, where Schmeh drew attention to lesser-known cases:

- The **Rohonc Codex** — a Hungarian illustrated manuscript with a 200-character script, given far less scholarly attention than Voynich
- The **Blitz Ciphers** — pages allegedly found in a London basement bombed during the Blitz, with Schmeh openly noting reader suspicions of forgery
- The **Lippert SS radio message** — an unsolved 1944 Nazi transmission from a private collection
- Individual **unsolved M-209 messages** from WWII
- The **Callimahos cryptograms** — three short ciphers embedded by NSA cryptologist Lambros Callimahos in the front matter of his classified textbooks
- **Markovian Parallax Denigrate** — the internet's oldest and weirdest unsolved mystery, a set of 100+ Usenet posts from August 1996

### The Friedman Ring
Named after William and Elizebeth Friedman, this is Schmeh's mechanism for keeping the community continuously engaged. It works like the boxing championship belts: whoever solves the current challenge becomes the new bearer of the Ring, and must in turn create the next challenge. The chain has passed from Schmeh through solvers in Germany, Austria, and the United States. As of the final Cipherbrain post in December 2022, David Vierra of the USA held the Ring after solving Matthew Brown's challenge.

### Signature Positions
Schmeh's writing has a consistent voice: analytical, sceptical, and impatient with sensationalism. Several of his positions have become widely accepted in the field:

- **The Beale Ciphers are a hoax.** Schmeh: "The greatest hoax in crypto history. Generations of treasure hunters have tried to solve them and to find the hidden treasure, the location of which they allegedly describe. Nobody has ever been successful, as the treasure simply does not exist." Statistical analysis by Jim Gillogly supports this position.
- **Restricted-access cryptograms are structurally suspect.** Schmeh treats claims like the Blitz Ciphers (only eight pages ever released, no direct examination permitted) with characteristic wariness. Legitimate mysteries welcome inspection.
- **Personal-use encryption is a distinct research category.** Diaries, notebooks, and single-author systems (Voynich, McCormick's notes, Hampton's notebook, the Rohonc Codex) share properties that make them uniquely hard to break: non-deterministic quirks, no need for a key that a second party could recover, and idiosyncratic tricks nobody but the author remembers. Schmeh has argued for a comprehensive treatise on this class of ciphers that does not yet exist.

### Coverage of Modern Solutions
Schmeh also reported major breakthroughs as they happened:
- The **Zodiac Z340** solve by David Oranchak, Sam Blake, and Jarl Van Eycke in December 2020
- The **M4 Project** distributed-computing attack that solved two of three unsolved Enigma M4 messages in 2006, with Dan Girard solving the third in 2013
- The **Charles V letter** deciphered by Cécile Pierrot in Nancy in November 2022
- The **Somerton Man** finally identified in 2022 as Carl Webb (though the cipher itself remains unsolved)

### The Golden Alice Awards
Every year Schmeh awarded a **Goldene Alice** — named after Alice, the standard party in cryptographic protocols — for outstanding contributions to crypto history. The final Cipherbrain post on scienceblogs.de in December 2022 announced the Goldene Alice 2022 winners.

### Books
- **Codeknacker gegen Codemacher** (2004; 2nd ed. 2007) — a comprehensive German-language history of cryptography, now a standard reference.
- **Nicht zu knacken** (2012) — "Not To Crack": the ten greatest unsolved encryption mysteries, including Voynich, Zodiac, Beale, Kryptos, Somerton, Rohonc, and the Thouless Experiment.
- **Versteckte Botschaften** (2009) — a history of steganography, hiding messages rather than encrypting them.

### Why It Belongs in a Cryptology Collection
Schmeh's work is complementary to the machine-focused scholarship of Dirk Rijmenants (whose Cipher Machines and Cryptology site is heavily referenced elsewhere in this suite). Where Rijmenants explains how the historical machines *worked*, Schmeh catalogues what historical cryptograms *remain* — the artefacts still awaiting decipherment.

His central insight is community-organisational: unsolved cryptograms are broken faster when a critical mass of amateur cryptanalysts have access to the same material, the same reporting, and the same public challenge structure. Cipherbrain built that critical mass. The Top-50 catalogue and the Friedman Ring are its lasting institutional artefacts.

*This article summarises material from scienceblogs.de/klausis-krypto-kolumne, klausschmeh.net, and Schmeh's speaker profile at 44con.com.*`},{id:"art-lorenz-tunny",title:"Lorenz SZ40/42 (Tunny) & Colossus: Breaking Hitler's Strategic Teleprinter Code",author:"Dirk Rijmenants / Bletchley Park Archives",category:"WWII Cryptography & Computing",summary:"How Bill Tutte reverse-engineered a 12-wheel strategic cipher machine without seeing it, and how Tommy Flowers built Colossus—the world's first electronic computer—to automate its defeat.",content:`While Enigma is the most famous German cipher machine of World War II, it was primarily a tactical field cipher used by army divisions, naval vessels, and aircraft. For high-level strategic directives between Adolf Hitler, the OKW (Supreme High Command), and army group headquarters across Europe, Germany relied on a far more sophisticated inline teleprinter cipher attachment: the **Lorenz SZ40/42**, codenamed **"Tunny"** by British codebreakers at Bletchley Park.

### How the Lorenz SZ40/42 Worked
Unlike Enigma, which substituted individual letters via rotating electrical wiring, the Lorenz machine was an inline teleprinter attachment operating on **5-bit International Telegraph Alphabet No. 2 (ITA2 / Baudot)** code.

The machine used **12 cam wheels** divided into three functional banks:
- **5 Chi (χ) wheels** (sizes 41, 31, 29, 26, 23 cams) that stepped continuously after every character.
- **5 Psi (ψ) wheels** (sizes 43, 47, 51, 53, 59 cams) that stepped intermittently.
- **2 Motor (μ) wheels** (M61 with 61 cams, M37 with 37 cams) that controlled when the Psi wheels stepped.

Encryption was performed using **Vernam modulo-2 addition (XOR)**:
\`\`\`
Ciphertext = Plaintext ⊕ χ-stream ⊕ ψ-stream
\`\`\`
Because all 12 wheel sizes were coprime, the total cycle period before repeating was the least common multiple of all wheel sizes: **16,033,955,073,056,318,658** (1.6 × 10¹⁹ characters). Taking cam pin settings into account, the total key space exceeded **10¹⁷⁰**—more than the number of particles in the observable universe.

### The 1941 Catastrophic "Depth" Mistake
On 30 August 1941, a German operator in Athens transmitted a 4,000-character message to Vienna. When the receiving operator requested a retransmission, the sender made a fatal procedural error: he re-sent the message using the exact same starting wheel positions (a **"depth"**), but abbreviated words in the plaintext (for example, typing "HQ" instead of "HEADQUARTERS").

In Vernam XOR encryption, when two messages P1 and P2 are encrypted with identical keystream K:
\`\`\`
C1 ⊕ C2 = (P1 ⊕ K) ⊕ (P2 ⊕ K) = P1 ⊕ P2
\`\`\`
The entire 12-wheel keystream was mathematically eliminated! At Bletchley Park, Brigadier **John Tiltman** and brilliant young mathematician **Bill Tutte** exploited this depth. By sliding candidate words across P1 ⊕ P2, Tutte not only recovered both plaintexts, but over several months of hand calculations, **he deduced the entire 12-wheel mechanical structure and cam pin counts of the Lorenz SZ40 machine without ever seeing a physical specimen**.

### Tommy Flowers & The Colossus Computer
Knowing the structure of Tunny was only half the battle; finding the daily starting wheel positions for intercepted messages required evaluating billions of cam combinations.

In 1943, Post Office Research Station engineer **Tommy Flowers** designed and built **Colossus Mark I**, the world's first operational programmable digital electronic computer. Using 1,500 vacuum tubes (expanded to 2,500 in Colossus Mark II), optical paper tape readers running at 5,000 characters per second, and Boolean logic circuits, Colossus automated the statistical evaluation of Chi-wheel cam patterns.

By D-Day in June 1944, Colossus was providing Allied commanders with real-time decrypts of German high-command orders, including confirmation that Hitler believed the Normandy invasion was a diversion from Pas-de-Calais. Ten Colossus machines operated at Bletchley Park by the end of the war, shortening World War II by an estimated two years and laying the foundation for the modern digital age.`},{id:"art-sigaba-fialka",title:"U.S. SIGABA & Soviet Fialka: How 15-Rotor & 10-Rotor Architecture Defeated Enigma-Style Cryptanalysis",author:"Dirk Rijmenants / National Cryptologic Museum Archives",category:"WWII & Cold War Cryptography",summary:"Why America's 15-rotor SIGABA was never broken during WWII, and how the Soviet Union's 10-rotor Fialka M-125 eliminated every known structural weakness of Enigma.",content:`While the German Enigma machine succumbed to Allied codebreakers at Bletchley Park, two other electromechanical rotor machines of the 20th century achieved what Enigma could not: **unbroken operational security throughout their entire service lifetimes**.

### U.S. SIGABA (ECM Mark II): The 15-Rotor Stepping Maze
In the 1930s, U.S. Army cryptologist **William F. Friedman** and engineer **Frank Rowlett** recognized that the fatal vulnerability of Hebern and Enigma machines lay in their predictable, odometer-style rotor movement (where rotor 1 steps every character, rotor 2 steps once every 26 characters, etc.).

To eliminate this predictability, Rowlett designed an ingenious **"Stepping Maze"** using **15 rotors arranged in three banks of five**:
- **5 Cipher Rotors**: 26-contact rotors that performed the actual letter substitution.
- **5 Control Rotors**: 26-contact rotors that stepped odometrically, outputting electrical control currents.
- **5 Index Rotors**: smaller static rotors set manually at the start of a message that routed the control currents into nine stepping relays.

As a result, on every keystroke, **between 1 and 4 of the Cipher Rotors stepped simultaneously in a complex, aperiodic, pseudorandom sequence**. With a key space exceeding **2¹⁰⁰** and no cyclic repeating pattern, SIGABA protected all high-level U.S. strategic communications during World War II and the Korean War without a single operational compromise.

### Soviet Fialka M-125: The Ultimate "Russian Enigma"
In the 1950s, Soviet cryptologists set out to design the **Fialka (M-125)** as the standard tactical cipher machine for the Warsaw Pact. Fully aware of how Enigma had been broken, Soviet engineers systematically eliminated every structural weakness:
1. **10 Rotors with 30 Contacts**: Using 30 Cyrillic characters plus punctuation/digits provided a vastly larger permutation space than Enigma's 3–4 rotors of 26 letters.
2. **Bidirectional Rotor Stepping**: Adjacent rotors stepped in **opposite directions**—odd-numbered rotors advanced forward (+1 mod 30) while even-numbered rotors stepped backward (-1 mod 30), disrupting mechanical acoustic signatures and timing regularity.
3. **Punched Key Card**: Replaced Enigma's tangled plugboard cables with a triangular 30-contact punched card that rewired all circuits instantly and error-free each day.
4. **The "Magic Reflector"**: Enigma's most famous cryptographic flaw was that its reflector never allowed any letter to encrypt to itself—a negative rule that Turing and Welchman's Bombes exploited. Fialka integrated a special transistor/diode circuit in its reflector that **allowed a character to encrypt to itself**, destroying Enigma-style crib elimination attacks!

Both SIGABA and Fialka represent the absolute zenith of electromechanical rotor cipher engineering before the transition to fully electronic and digital cryptography.`},{id:"art-secom",title:"SECOM: Fractionation, Key Streams & Disrupted Transposition by Hand",author:"Dirk Rijmenants / Cipher Machines & Cryptology",category:"Manual Cipher Systems",summary:"A four-stage field cipher that turns a memorable phrase into digits, compresses language with a checkerboard, then tears those digits apart through two transpositions.",content:`SECOM is a manual cipher designed to encrypt messages containing letters, numbers, and spaces using pencil and paper. Its security comes from stacking several different operations instead of asking one simple substitution to do everything.

### Stage 1: Turn a Phrase into Key Digits
The first twenty letters of the key phrase are divided into two groups of ten. Within each half, letters are ranked alphabetically, with repeated letters receiving ranks from left to right and 0 treated as the last digit. The two ten-digit sequences are added digit by digit modulo 10, without carrying.

The resulting ten digits are extended to fifty by chain addition: add the first two digits, append the last digit of the sum, drop the first digit, and repeat. The last ten digits are ranked again and become the header of a dynamic checkerboard.

### Stage 2: The ESTONIA Checkerboard
The most frequent letters — E S T O N I A — occupy single-digit cells. The remaining letters, digits, space marker, and punctuation occupy two-digit rows. This is not encryption by itself. It is fractionation: common letters become shorter while other characters are split into two pieces.

The important cryptanalytic effect comes later. When the digit stream is transposed, a single plaintext character can be torn across distant positions. The attacker no longer sees intact letter units or a normal frequency distribution.

### Stages 3 and 4: Two Transpositions
The checkerboard digits pass through a normal columnar transposition, then a second disrupted transposition. The source system uses triangular regions: rows do not all begin in the same column, creating irregular column lengths and breaking up repeated patterns.

This combination — frequency-flattening fractionation followed by double transposition — is closely related to the Russian VIC cipher and represents the upper end of practical pencil-and-paper cryptography. It is still not a one-time pad: with enough traffic, reused procedures, human mistakes, or strong cribs, a cryptanalyst may find structure.

### What This Lab Models
This application implements the complete visible pipeline and a reversible educational model of the disrupted stage. The row-rotation disruption preserves the key lesson — the second transposition uses a different geometry from the first — while keeping the browser demonstration auditable and round-trippable. It is a teaching model, not a claim to reproduce every customer-specific SECOM field procedure.

The result is a useful bridge between classical cryptography and modern design: encode efficiently, fractionate symbols, permute positions, and never mistake an encoding layer for secrecy.`},{id:"art-morse",title:"Samuel Morse & Alfred Vail: The Code That Compressed Distance",author:"Historical Research",category:"Telegraphy & Signal Codes",summary:"A portrait painter and a machinist built the first practical electric telegraph, and in doing so invented frequency-optimised coding decades before information theory existed.",content:`Samuel Finley Breese Morse (1791-1872) was a successful portrait painter, not an engineer. In 1832, returning from Europe aboard the ship Sully, he fell into conversation with Charles Thomas Jackson about electromagnetism. Morse reasoned that if the presence of electricity could be made visible at any point along a circuit, intelligence could be transmitted instantly by electricity.

### The Collaboration
Morse was not the first to attempt this. In Britain, William Cooke and Charles Wheatstone built a five-needle telegraph in 1837 that pointed to letters on a panel. By 1838 some sixty-two people had claimed invention of an electrical telegraph. What made Morse's system win was simplicity: a single wire, and timed pulses.

Morse could not have done it alone. He worked with physicist **Leonard Gale**, who improved the electromagnets and relay circuits, and with **Alfred Vail**, a young machinist who saw a demonstration at New York University in 1837 and joined the project. Vail invested his family's money, and the Speedwell Ironworks in Morristown, New Jersey, gave him a workshop to build hardware that actually worked.

### Vail and the Birth of Frequency Coding
Morse's original scheme was a clumsy numeric code requiring a lookup dictionary. Vail replaced it with a direct letter code — and made a decision that anticipated information theory by a century.

Vail walked into the type-cases of a local Morristown newspaper and **counted the movable type**. Whichever letters the printer stocked most heavily were the letters English used most often. He then assigned the shortest symbols to the most frequent letters:

- **E** = a single dot (the most common letter in English)
- **T** = a single dash
- **Q, Y, Z** = long, complex sequences (rare letters)

This is variable-length frequency-optimised encoding. It is the same principle that Huffman coding would formalise mathematically in 1952, and the same insight that drives the straddling checkerboard used by Cold War intelligence services: **give short symbols to common characters and the message gets shorter**.

### What Hath God Wrought
In 1843 Congress appropriated $30,000 for an experimental line running roughly forty miles from Washington D.C. to Baltimore. On **24 May 1844**, Morse sat in the Capitol and keyed the first public message to Vail at the B&O Railroad Depot:

> **WHAT HATH GOD WROUGHT**

The phrase comes from Numbers 23:23 and was chosen by Annie Ellsworth, daughter of the Commissioner of Patents. Vail received it, transcribed it, and sent it back. The original paper tape is preserved in the Library of Congress.

### From Paper Tape to the Ear
The first receivers embossed marks onto a moving paper tape for later transcription. Operators quickly discovered they could simply *hear* the clicks of the armature and decode by ear faster than they could read tape. The register was replaced by the **sounder**, and Morse became an audible language.

### American Morse to International Morse
Original American Morse used dashes of several different lengths and internal spaces inside characters. This worked on landline wires but was error-prone over radio. **Friedrich Clemens Gerke** published a simplified version in 1848; European telegraph conferences refined it, and it became **International Morse Code**, today maintained by the ITU as recommendation ITU-R M.1677-1.

### Why It Belongs in a Cryptology Collection
Morse code is emphatically **not encryption**. It is a public, universally documented encoding — exactly the category of thing Kerckhoffs warned must never be mistaken for secrecy. Anyone with a receiver can read it.

But it matters enormously to cryptologic history:
- Wireless Morse carried the encrypted traffic of both world wars, including Enigma ciphertext transmitted as five-letter groups.
- Numbers stations broadcast one-time-pad groups in Morse for decades, alongside voice.
- Morse cut-numbers tables were found in the possession of arrested agents such as Oleg Penkovsky.
- Its frequency-optimised design is the direct conceptual ancestor of the checkerboard encodings used to compress plaintext before one-time-pad encryption.

The telegraph also created the operational problem that made modern cryptography necessary. Once messages travelled by wire and then by radio, anyone could intercept them. Privacy could no longer be protected by a sealed envelope and a trusted courier. It had to be protected by mathematics.`},{id:"art-geb",title:"Gödel, Escher, Bach: Strange Loops, Self-Reference & the Quine",author:"Douglas R. Hofstadter / Research Summary",category:"Formal Systems & Self-Reference",summary:"Hofstadter's 1979 Pulitzer-winning braid of logic, art and music explains why a program that prints itself is the same shape as a theorem that talks about itself.",content:`In 1979 cognitive scientist **Douglas R. Hofstadter** published *Gödel, Escher, Bach: An Eternal Golden Braid*, a 777-page work that won the Pulitzer Prize for General Nonfiction and the National Book Award for Science. Its subject is not three biographies. It is a single recurring shape that appears in logic, in art, and in music: the **strange loop**.

### The Strange Loop
A strange loop is a hierarchy in which you move steadily through levels — each step feeling like it goes upward or outward — and unexpectedly arrive back where you began. Hofstadter calls such a hierarchy **tangled**: it has no well-defined top or bottom.

The three title figures each supply one demonstration:

**Kurt Gödel (logic).** In 1931 Gödel proved that any consistent formal system powerful enough to express basic arithmetic contains true statements it cannot prove. He achieved this through **Gödel numbering**: assigning a unique number to every symbol, formula and proof, so that statements *about* the system become statements *within* the system. He then constructed, in the language of arithmetic, the equivalent of *"This statement is not provable."* If the system could prove it, the system would be inconsistent. If it cannot, the statement is true and unprovable. The system, given enough expressive power, acquires the ability to talk about itself.

**M.C. Escher (visual).** *Drawing Hands* shows two hands each drawing the other — neither is the origin. *Ascending and Descending* shows a staircase that climbs forever and returns to itself. *Waterfall* routes water uphill through impossible geometry into a closed cycle. These images do not prove theorems, but they train the intuition for what a tangled hierarchy feels like before you can formalise it.

**J.S. Bach (musical).** The *Canon per Tonos* from the *Musical Offering* modulates upward through keys and, after six modulations, arrives back at its starting key an octave higher — an audible Escher staircase. Bach's fugues layer a theme against transformed copies of itself.

### The MU Puzzle and Formal Systems
Early in the book Hofstadter presents the **MU puzzle**, a toy formal system. You start with the string MI and may apply four typographic rules to produce new strings. The challenge: derive MU.

The point is that you cannot solve it by grinding the rules. You solve it by stepping **outside** the system and noticing an invariant — the number of I symbols is never divisible by 3, and never can become so under those rules. Hofstadter calls working inside the rules the **M-mode** and reasoning about the system from outside the **I-mode**. Real intelligence, he argues, jumps between them.

### Isomorphism and Meaning
A central claim: **meaning is not a property of symbols, it is a property of the structure-preserving mapping between systems.** When the manipulation rules for marks on paper mirror the behaviour of numbers, the marks *mean* numbers. Gödel's insight was that this mapping can be turned inward — a system's own syntax can be encoded in its own subject matter.

This is exactly the mechanism underlying every cipher in this suite. A rotor is a permutation. A plugboard is an involution. A checkerboard is a mapping from letters to digits. The machine does not know what it means; the isomorphism supplies the meaning.

### Quines
A **quine** is a program that takes no input and produces its own complete source code as output. Named by Hofstadter after philosopher **Willard Van Orman Quine**, who studied the sentence construction:

> *"Yields falsehood when preceded by its quotation"* **yields falsehood when preceded by its quotation.**

The trick in both cases is the same as Gödel's: separate the thing into a **template** and a **copy of the template used as data**, then have the template reconstruct the whole from the part.

Other literary quines Hofstadter collects:
- *"Is a sentence fragment"* is a sentence fragment.
- This sentence contains exactly thirty-eight characters.

### Why This Application Contains a Quine
This suite compiles to a **single self-contained HTML file**. The "Download Offline Suite" button in the navigation reads the document that is currently executing and writes it back out as a new file. The running program emits its own source. That is a genuine quine, and it is the reason this article sits in a cryptology collection rather than a philosophy one.

Self-reference is not decoration here. It is the operating principle of the field:

- **Gödel numbering** lets a formal system encode statements about itself — the same manoeuvre by which a cipher machine's key settings are themselves transmitted as ciphertext inside the message they configure (the Enigma *Spruchschlüssel*).
- **Recursion** underlies rotor stepping, chain addition in the SECOM cipher, and the Lagged Fibonacci generators used to extend key material.
- **Tangled hierarchies** describe the eternal codemaker/codebreaker cycle: each side models the other modelling them.
- **Incompleteness** is the formal cousin of Shannon's proof that the one-time pad is unbreakable. Both are results about the hard limits of what a system can do, established by reasoning rigorously about the system from outside it.

### Hofstadter's Law
Stated in the book, and true of every cryptanalytic project ever attempted:

> **It always takes longer than you expect, even when you take into account Hofstadter's Law.**`},{id:"art-goldbug",title:"The Gold-Bug: Poe and the Popularisation of Cryptography",author:"Edgar Allan Poe / Dirk Rijmenants",category:"Cryptography in Literature",summary:"Poe's 1843 prize-winning story taught a generation how to break monoalphabetic substitution ciphers with letter frequency analysis.",content:`In 1840, Edgar Allan Poe challenged readers of Alexander's Weekly Messenger to submit substitution ciphers for him to solve. Cryptograms poured in from across the United States, and Poe published many solutions, sparking a national fascination with secret writing.

In his 1841 essay "A Few Words on Secret Writing" he coined the famous line that "human ingenuity cannot concoct a cipher which human ingenuity cannot resolve." Inspired by this success, Poe wrote The Gold-Bug, which won a writing contest and its 100 dollar grand prize, and was published on 21 June 1843.

### Why It Mattered
The Gold-Bug is regarded as the first important work of popular fiction to build its plot around cryptography. It contains a step-by-step description of solving a monoalphabetic substitution cipher using letter frequency analysis. A young reader named William Friedman was so inspired that he went on to become one of the most important cryptologists in American history.

### The Method
There are 26! (about 4.03 x 10^26) possible substitution alphabets, yet the cipher falls quickly to frequency analysis. In English, E is the most common letter (around 12.7 percent), followed by T and A. Codebreakers locate the most frequent symbol, assign it E, hunt for the recurring three-symbol pattern that spells THE, and expand outward word by word until the plaintext emerges.`},{id:"art-enigma-history",title:"The Enigma Machine: Technical Marvel & Decryption Legacy",author:"Dirk Rijmenants",category:"WWII Cryptography",summary:"Detailed examination of how Arthur Scherbius patented Enigma in 1918, its adoption by the Wehrmacht and Kriegsmarine, and how Marian Rejewski and Alan Turing broke the rotor cipher.",content:`The Enigma cipher machine was invented at the end of World War I by German engineer Arthur Scherbius. Initially designed for commercial bank security, it was adopted by the German Armed Forces (Heer, Luftwaffe, and Kriegsmarine) in the late 1920s and 1930s.

### How Enigma Achieved Security
Enigma achieved polyalphabetic substitution using electromechanical rotors. Each key press sent electrical current from the keyboard through a plugboard (Steckerbrett), through 3 or 4 rotating rotors, bounced back off a reflector (Umkehrwalze), and returned back through the rotors to light up a lamp on the lampboard.

Because each rotor advanced with every key stroke, the key substitution changed constantly. The period before a 3-rotor Enigma repeated was 26 x 25 x 26 = 16,900 letters! With ring settings and 10 plug cables, the total number of theoretical key combinations exceeded **158,962,555,217,826,360,000** (158 quintillion).

### Codebreaking Breakthroughs
In 1932, Polish mathematician **Marian Rejewski** made the first critical mathematical breakthrough by reconstructing the Enigma wiring using group theory and cyclometer machines. Just before the invasion of Poland in 1939, Polish intelligence shared their discoveries with Britain and France.

At Bletchley Park (Station X), **Alan Turing** and **Gordon Welchman** designed the electromechanical *Bombe* machine, which exploited structural weaknesses—specifically "cribs" (known plaintexts) and the rule that no letter could ever encrypt to itself.`},{id:"art-kl7-adonis",title:"TSEC/KL-7 ADONIS: Cold War High-Security Rotor Cipher",author:"Dirk Rijmenants",category:"Cold War Crypto",summary:"The U.S. and NATO principal tactical off-line cipher machine used from 1952 through the 1980s.",content:`The TSEC/KL-7 (code name ADONIS) was the mainstay tactical rotor cipher machine for the United States Military, FBI, CIA, and NATO forces throughout the Cold War.

Developed by AFSA (Armed Forces Security Agency) and NSA, the KL-7 featured **8 rotors** selected from a total set of 61 rotors. Unlike Enigma, the KL-7 used sophisticated re-stepping notches and non-linear stepping cycles, rendering traditional rotor analysis virtually impossible without physical access to the key cards.

The machine printed plaintext and ciphertext onto narrow paper tape using an internal ink ribbon wheel. It was decommissioned in the late 1980s following the infamous Walker spy ring compromise.`},{id:"art-m209-hagelin",title:"Hagelin M-209: Tactical Frontline Cryptography",author:"Dirk Rijmenants",category:"Tactical Cipher Equipment",summary:"Boris Hagelin's compact mechanical cipher machine used by over 140,000 U.S. troops in WWII.",content:`The M-209 (C-38) was a small, purely mechanical tactical cipher machine designed by Swedish inventor Boris Hagelin and manufactured under license by Smith-Corona typewriter company in Syracuse, New York.

Weighing under 6 pounds, the M-209 operated without batteries or electricity. It utilized 6 key wheels with coprimely chosen pin counts (26, 25, 23, 21, 19, 17). The product of these numbers yields an astounding period of **101,405,850 letters** before the sequence repeats!

Messages were enciphered by turning a letter selection knob and crank handle, which automatically printed the ciphertext onto paper tape.`},{id:"art-otp-science",title:"One-Time Pad & The Mathematical Secret of Unbreakability",author:"Dirk Rijmenants",category:"Unbreakable Cryptography",summary:"Why One-Time Pad is mathematically proven by Claude Shannon to be immune to cryptanalysis.",content:`Invented by Gilbert Vernam and Joseph Mauborgne in 1917, the One-Time Pad (OTP) is the only encryption system mathematically proven to be **unbreakable** (perfect secrecy), provided four cardinal rules are strictly strictly maintained:

1. **True Randomness**: The key sequence must be truly random (e.g. atmospheric noise or physical dice).
2. **Equal Length**: The key length must be equal to or greater than the plaintext length.
3. **Never Reused**: A key page must NEVER be reused for another message.
4. **Absolute Secrecy**: The key sheet must be kept completely secure and destroyed immediately after single use.

If a key page is reused even once (known as a "two-time pad"), cryptanalysts can overlay the two ciphertexts, eliminate the key, and recover both plaintexts—as executed by Anglo-American codebreakers in **Project Venona** against Soviet espionage channels during WWII and the Cold War.`},{id:"art-hagelin-b21",title:"Hagelin B-21: The Machine That Started an Empire",author:"Dirk Rijmenants",category:"Cipher Machine History",summary:"In 1925, Boris Hagelin bluffed his way into building a machine to rival the Enigma — and succeeded beyond imagination.",content:`In 1925, the Swedish General Staff sought an alternative to the German Enigma. Boris Hagelin claimed he could build something superior within six months — despite having no working design at the time. He delivered.

The B-21 used a design based on Arvid Damm's "simplified rotors": two small scrambling rotors with only 5 input and 10 output contacts each, driven by an entirely new innovation — the **pin-wheel** (key-wheel). Four pin-wheels, with 17, 19, 21, and 23 pins respectively, controlled the stepping of the two ciphering rotors in a highly irregular fashion, producing a maximum period of 1,560,090 combinations.

This pin-wheel design, though modest in the B-21, would become the defining feature of every subsequent Hagelin machine — the C-35, C-36, C-38/M-209, and ultimately the legendary C-52/CX-52. Boris Hagelin's gamble transformed A.B. Cryptograph into Crypto AG, one of the most influential (and, decades later, controversial) cipher machine manufacturers in the world.`},{id:"art-hagelin-c52",title:"Hagelin C-52 & CX-52: Cold War Cryptographic Powerhouse",author:"Dirk Rijmenants",category:"Cold War Crypto",summary:'The machine that "caused ripples throughout the cryptanalytic community" — sold to over 60 countries and used into the 1990s.',content:`After the tactical success of the C-38 and its American cousin the M-209, Boris Hagelin set out to build a machine capable of resisting serious cryptanalysis for high-level military and diplomatic use. In 1952, the C-52 was born.

### Technical Leap Forward
The C-52 used 6 pinwheels selected from a pool of 12 different sizes (25, 26, 29, 31, 34, 37, 38, 41, 42, 43, 46, and 47 pins), while the more advanced CX-52 variant used 6 wheels of 47 pins each with a highly irregular, pseudo-random stepping pattern. The number of internal drum bars grew to 32, of which 5 doubled as "movement bars" to advance the pinwheels themselves.

### Astonishing Key Space
When properly configured, the CX-52 provides approximately **4.13 × 10^99** possible keys — comparable to a 331-bit key strength. For reference, there are estimated to be only 10^80 atoms in the observable universe. To this day, no ciphertext-only attack exists against a properly keyed C-52/CX-52 message; only known-plaintext attacks (first proposed by H. Paul Greenough in 1999) have proven effective.

### Legacy and Controversy
Combined with the B-52 electric keyboard (forming the "BC-52"), this machine was purchased by over 60 nations and remained in active service into the 1990s — decades after its Cold War heyday, illustrating just how far ahead of its time the pin-and-lug design truly was.`},{id:"art-colossus",title:"Colossus: Britain's Secret Digital Computer",author:"Dirk Rijmenants",category:"Codebreaking Technology",summary:"Two years before ENIAC, this top-secret machine became the world's first programmable digital electronic computer.",content:`While the Enigma dominates popular memory of WW2 codebreaking, the German High Command relied on an even more sophisticated cipher for top-level communications: the Lorenz SZ-40/42 teleprinter cipher, codenamed "Tunny" by the British.

Tunny used 12 irregularly moving pinwheels to generate a pseudo-random 5-bit stream, XORed with the plaintext teletype signal. When Bletchley Park codebreakers, including John Tiltman, discovered statistical weaknesses in this stream, they needed a machine fast enough to exploit them at scale.

### From Heath Robinson to Colossus
Max Newman's electromechanical "Heath Robinson" prototype (1943) proved the concept but was too slow and unreliable. Engineer **Tommy Flowers**, working at the Post Office Research Station, proposed an all-electronic solution using vacuum tubes — a radical idea at the time. The result, **Colossus Mark I**, became operational in January 1944, followed by the much faster Mark II in June 1944.

With up to 2,500 vacuum tubes, shift registers, and Boolean logic circuits, Colossus could read paper tape at speeds up to 9,700 characters per second. Ten Colossus machines were built and operated at Bletchley Park by war's end, producing intelligence codenamed **ULTRA**.

### Suppressed From History
Because Colossus's existence remained classified until the late 1970s, the American ENIAC — completed two years later — wrongly received credit as the world's first digital computer for decades. Only the declassification of NSA archives revealed the truth: Britain's codebreakers had built the future of computing in total secrecy.`},{id:"art-enigma-challenge",title:"The Enigma Cipher Challenge: Real Codebreaking Practice",author:"Dirk Rijmenants",category:"Interactive Challenges",summary:"Ten authentic WW2-themed messages, each harder than the last, inviting the public to become codebreakers.",content:`Since its launch, the Enigma Cipher Challenge on Dirk Rijmenants' website has invited amateur cryptanalysts worldwide to try their hand at genuine Enigma decryption, using historically accurate scenarios spanning from May 1941 (a captured German weather ship's codebook) to April 1945 (a desperate final Berlin transmission).

Each of the ten messages increases in difficulty: early stages provide complete key settings, while later stages require the solver to deduce missing rotor orders, ring settings, or plugboard connections using techniques real Bletchley Park codebreakers relied upon — including **cribs** (known or guessed plaintext fragments), **Herivel tips** (operator shortcuts that leaked key information), and analysis of intercepted partial keys from captured documents or resistance networks.

As of 2026, over 367 codebreakers from 46 countries have completed the full challenge, collectively solving more than 2,483 individual Enigma messages — keeping alive, in a small way, the spirit of Bletchley Park's codebreaking legacy.`}],go={A:3,B:25,C:14,D:9,E:1,F:13,G:26,H:20,I:6,J:11,K:15,L:18,M:28,N:12,O:24,P:22,Q:23,R:10,S:5,T:16,U:7,V:30,W:19,X:29,Y:21,Z:17," ":4},V1=Object.fromEntries(Object.entries(go).map(([c,d])=>[d,c]));function q1(c){return c.toUpperCase().split("").filter(d=>go[d]!==void 0).flatMap(d=>{const l=go[d];return[0,...Array.from({length:5},(i,u)=>l>>u&1),1,1]})}function Dh(c,d,l){const m=760/Math.max(c.length,1),x=120/2,f=(l?12:44)*d;let g=`M 0 ${x}`;return c.forEach((y,S)=>{const N=S*m,L=(S+1)*m,H=x+(y?-f:f);if(!l&&S>0&&c[S]!==c[S-1]&&d>.15){const T=f*1.6;g+=` L ${(N-1).toFixed(2)} ${(x-T).toFixed(2)}`,g+=` L ${(N+1).toFixed(2)} ${(x+T).toFixed(2)}`}g+=` L ${N.toFixed(2)} ${H.toFixed(2)} L ${L.toFixed(2)} ${H.toFixed(2)}`}),g}const P1=()=>{const[c,d]=j.useState("relay"),[l,i]=j.useState("TOP SECRET COMSEC"),[u,m]=j.useState(35),[x,v]=j.useState(25),[f,g]=j.useState(!1),[y,S]=j.useState("NATO SECRET: OPERATION RUBICON DEPLOYMENT AT 2300Z"),[N,L]=j.useState(45),[H,T]=j.useState(18),[k,z]=j.useState(0),[R,O]=j.useState("none"),X=j.useRef(null),[J,le]=j.useState("E"),$=j.useMemo(()=>q1(l.slice(0,18)),[l]),Q=Math.min(100,Math.round(u*.6+x*.4+(f?40:0))),oe=Math.max(.03,1-Q/100),re=j.useMemo(()=>Dh($,1,!1),[$]),pe=j.useMemo(()=>Dh($,oe,f),[$,oe,f]),ge=j.useMemo(()=>l.toUpperCase().split("").filter(A=>go[A]!==void 0).map((A,D)=>{const V=100-Q,w=(D*37+A.charCodeAt(0)*11)%85;return V>=w*.8?V1[go[A]]||A:"·"}).join(""),[l,Q]),je=Q<40?"CRITICAL (HIGH RADIATION)":Q<75?"DETECTABLE (MEDIUM RANGE)":"SUPPRESSED (SDIP COMPLIANT)",Oe=Q<40?"text-red-400 border-red-700 bg-red-950/40":Q<75?"text-amber-400 border-amber-700 bg-amber-950/40":"text-emerald-400 border-emerald-700 bg-emerald-950/40";j.useEffect(()=>{if(c!=="vaneck")return;const B=X.current;if(!B)return; WWII","Entropy statistics do not match any known European or Asian language","Modern AI and machine-learning attacks have all failed to produce coherent decipherment","Named the number-one unsolved crypto mystery on Klaus Schmeh's Cipherbrain Top-50"],significance:"The most famous unsolved cipher in history. Klaus Schmeh notes that despite over a century of intense study, we cannot even prove the manuscript encodes meaningful text at all — it may be an elaborate hoax, an invented language, or a genuine cipher with no discovered key."},{id:"zodiac-340",rank:3,name:"The Zodiac Killer 340 Cipher (Z340)",category:"Criminal Case",era:"8 November 1969",origin:"San Francisco Chronicle · sent by the Zodiac serial killer",status:"solved-recently",description:"The second and long-notorious of four ciphers sent by the Zodiac Killer, unsolved for 51 years until an international team cracked it in December 2020.",cipherType:"Homophonic substitution + transposition + diagonal reading scheme with intentional errors.",details:["Solved on 5 December 2020 by David Oranchak (USA), Sam Blake (Australia) and Jarl Van Eycke (Belgium)","The team used bespoke software (AZdecrypt) running through millions of transposition schemes",'Plaintext begins: "I HOPE YOU ARE HAVING LOTS OF FUN IN TRYING TO CATCH ME..."',"The Zodiac's first cipher (Z408, 1969) was solved within a week by schoolteachers Donald and Bettye Harden","Two remaining cryptograms — Z13 and Z32 — are too short to yield definitive solutions","Klaus Schmeh reported that Donald Harden was asked to work on Z340 but refused"],significance:"Featured prominently in Schmeh's reporting throughout the 2010s. The 2020 solution proved that patient distributed cryptanalysis with modern computing power can crack even 50-year-old homophonic ciphers — vindicating the field of amateur crypto-detective work Schmeh champions on Cipherbrain."},{id:"dorabella",rank:4,name:"The Dorabella Cipher",category:"Personal",era:"14 July 1897",origin:"Written by composer Edward Elgar to Dora Penny",status:"unsolved",description:'An 87-character cipher on a folded slip of paper, sent by composer Sir Edward Elgar as an enclosure in a letter to 22-year-old Dora Penny (the "Dorabella" of his Enigma Variations).',cipherType:"Symbol substitution — 24 distinct symbols using 1, 2 or 3 semicircles rotated to 8 orientations.",details:["Only three lines of 87 total symbols","Dora Penny herself was unable to read it and included it in her 1937 memoir",'Klaus Schmeh published extensive analysis in Cryptologia (2018) titled "Examining the Dorabella Cipher"',"The cipher's brevity is a fundamental obstacle — 87 characters is likely too short for definitive solution","Elgar was known to enjoy cryptography and puzzles; he encoded other messages in his notebooks","Several proposed solutions exist but none is accepted by the cryptographic community"],significance:"A romantic mystery from one of Britain's greatest composers. Schmeh has repeatedly analysed and republished this cryptogram, using it as a case study for why message length matters more than cipher complexity: 87 characters may simply carry too little information to solve."},{id:"kryptos-k4",rank:2,name:"Kryptos K4",category:"Object / Inscription",era:"Installed 3 November 1990",origin:"Sculpture by Jim Sanborn · CIA Headquarters courtyard, Langley VA",status:"unsolved",description:"The fourth and final section of Jim Sanborn's copper Kryptos sculpture — a 97-character passage that has resisted cryptanalysis for over 35 years despite worldwide attention.",cipherType:"Unknown system. Sections K1-K3 used Vigenère (keys PALIMPSEST, ABSCISSA) and columnar transposition. K4 uses none of these.",details:["Only 97 characters — one of the shortest famous unsolved ciphers","Sanborn has released four hints over the years: BERLIN (positions 64-69), CLOCK (70-74), NORTHEAST (26-34), EAST (22-25)","K1-K3 were solved publicly in 1999 (NSA solved them privately by 1992)","In November 2025, Sanborn auctioned the K4 solution and archive for over $200,000",'Klaus Schmeh has called K4 "the most famous encrypted piece of art in the world"',"Included on Schmeh's Top-50 unsolved list at position 2"],significance:"A rare case of a physical art object as cryptographic challenge. Schmeh regularly features K4 news on Cipherbrain, tracking every hint release and proposed solution. Its unsolved status after decades of professional and amateur attack shows that a well-designed short cipher can defeat even massive collective effort."},{id:"beale",rank:40,name:"The Beale Ciphers",category:"Object / Inscription",era:"Allegedly 1820s · Published 1885",origin:"Bedford County, Virginia · pamphlet by James B. Ward",status:"suspected-hoax",description:"Three ciphers said to reveal the location of a treasure buried by Thomas J. Beale. Cipher 2 was solved (keyed to the Declaration of Independence) and describes the treasure; ciphers 1 (location) and 3 (heirs) remain unsolved.",cipherType:"Book cipher — numbers refer to word positions in a keytext (the Declaration for #2).",details:["Cipher #2 decoded 1885 using the Declaration of Independence as key","Ciphers #1 and #3 remain unsolved despite 140+ years of attempts","Statistical analysis by Jim Gillogly showed suspicious alphabetical patterns in #1","Klaus Schmeh authored an MTC3 (MysteryTwister C3) challenge on the Beale ciphers",'Schmeh openly states: "The greatest hoax in crypto history. Generations of treasure hunters have tried to solve them... Nobody has ever been successful, as the treasure simply does not exist"',"Nevertheless, Bedford County has been extensively dug up by treasure hunters"],significance:"Klaus Schmeh's position — that Beale is a 19th-century hoax rather than a genuine treasure cipher — is now widely accepted among crypto historians. The case demonstrates how a fictional cipher, presented with enough narrative conviction, can occupy generations of amateur cryptanalysts."},{id:"somerton",rank:6,name:"The Somerton Man / Tamam Shud Case",category:"Criminal Case",era:"Discovered 1 December 1948",origin:"Somerton Park beach, Adelaide, South Australia",status:"partially-solved",description:'An unidentified man was found dead on an Australian beach with a scrap of paper reading "Tamam Shud" (Persian: "ended, finished") sewn into his pocket. A copy of the Rubaiyat of Omar Khayyam was later found nearby containing a five-line cipher.',cipherType:"Believed to be a one-time-pad or book cipher based on the Rubaiyat, but no confirmed decryption exists.",details:['Body finally identified in 2022 as Carl "Charles" Webb, an electrical engineer from Melbourne',"The cipher itself remains unsolved even after the man's identification","Klaus Schmeh ranked this the number-2 mystery in his Top-25 of unsolved German-language ciphers","Adelaide University professor Derek Abbott led decades of forensic and cryptographic research","The lettering may be a first-letter mnemonic rather than a true cipher","Featured extensively on Cipherbrain over multiple posts"],significance:"A cold case that became a global cryptographic puzzle. Schmeh's coverage demonstrated how forensic identification (2022) and cipher solving are separate problems — even knowing the sender may not reveal the message."},{id:"rohonc",rank:5,name:"The Rohonc Codex",category:"Manuscript",era:"Believed 16th-17th century",origin:"Hungary · Széchényi National Library, Budapest",status:"unsolved",description:"A 448-page illustrated manuscript in an unknown script with roughly 200 distinct characters (about 10x the alphabet of typical European languages), depicting scenes with Christian, pagan and Islamic religious symbolism.",cipherType:"Unknown script; runs right-to-left, top-to-bottom.",details:["Book-format codex, 12 x 10 cm, on paper watermarked to 1529-1540",`Featured in Klaus Schmeh's "Nicht zu knacken" (2012) — his book on the ten greatest unsolved encryptions`,"The Hungarian Academy of Sciences initially dismissed it as a 19th-century forgery","Modern research at Delft University suggests it may encode a genuine language, possibly a Hungarian-adjacent tongue","The large character set is unusual and suggests a syllabary or logography rather than an alphabet"],significance:"Second only to Voynich among unsolved historical manuscripts. Klaus Schmeh has repeatedly argued that the Rohonc Codex deserves more attention than it receives — the roughly 200-character script is a distinct cryptological puzzle from Voynich's smaller alphabet."},{id:"blitz",rank:32,name:"The Blitz Ciphers",category:"Manuscript",era:"Allegedly found 1940s London",origin:"Reportedly recovered from bomb-damaged basement during the Blitz",status:"unsolved",description:"A handful of pages from an alleged encrypted book, said to have been found in the ruins of a Victorian building bombed during the London Blitz. Only eight page-scans have ever been published.",cipherType:"Symbol-based script with approximately 50 distinct glyphs.",details:["Only eight page images ever released publicly","The book itself has never been made available for full analysis",'Klaus Schmeh notes that "Some of my readers consider the Blitz Ciphers a fake"',"Suspicion of forgery is compounded by the owner's refusal to permit direct examination","Featured on Cipherbrain's Top-50 list at position 32"],significance:"A cautionary case study. Schmeh treats the Blitz Ciphers with characteristic scepticism — noting that unsolved cryptograms with restricted access are structurally suspect. Legitimate mysteries typically welcome inspection."},{id:"callimahos",name:"The Callimahos Cryptograms",category:"Personal",era:"1952-1977",origin:'Lambros D. Callimahos · NSA cryptologist and author of "Military Cryptanalytics"',status:"unsolved",description:"NSA cryptologist Lambros Callimahos hid three short cryptograms in the front matter of his three most important classified textbooks. All three remain unsolved.",cipherType:"Unknown; each is a short polyalphabetic or homophonic cipher.",details:["Callimahos was one of the founders of modern NSA cryptanalytic training","He was also an accomplished flautist — the intersection of music and cryptology that Schmeh notes recurs in the field",'The earliest cryptogram (1952) is 15 letters long and Schmeh has called it "not quite as difficult"','The three primary cryptograms embedded in "Military Cryptanalytics" volumes remain open puzzles',"Schmeh regularly features these on Cipherbrain and encourages reader attacks"],significance:"Personal challenges from a master cryptologist to future generations. Schmeh treats them as active challenges rather than historical curiosities — several MysteryTwister C3 competitions have been built around them."},{id:"thouless",name:"The Thouless Experiment",category:"Personal",era:"1948 · Cambridge, England",origin:"Cambridge psychologist Robert H. Thouless",status:"unsolved",description:"Psychologist Robert Thouless published an encrypted passage and offered a cash prize to anyone who could decipher it — after his death. The intent was to test claims of survival after death via mediums.",cipherType:"Two Playfair ciphers using unknown key phrases.",details:["Thouless memorised two key phrases and published the ciphertexts in 1948","He died in 1984; no medium ever produced the keys","One of the two cipher passages was solved in 1995 by computer attack, not by any medium","The second passage remains unsolved",`Featured in Klaus Schmeh's "Nicht zu knacken" (2012)`,"A rare intersection of parapsychology and cryptology"],significance:"One of the few cryptograms designed specifically as an experiment. Schmeh uses this case to discuss how the strength of a cipher can be measured by the resources it withstands — computer attack succeeded where 47 years of séances did not."},{id:"ss-lippert",rank:25,name:"The SS Radio Message to Lippert",category:"Wartime",era:"1944",origin:"Nazi SS · encrypted radio transmission to SS-Standartenführer Lippert",status:"unsolved",description:"A World War II encrypted radio message from a member of the SS to an SS-Standartenführer (colonel-equivalent) named Lippert. The cleartext is unknown.",cipherType:"Unknown — possibly Enigma-encrypted but format is unusual.",details:["Original owned by US professor Nick Gessler","Klaus Schmeh photographed and analysed it at a crypto history conference","The receiver, SS-Standartenführer Lippert, has not been definitively identified","Even the type of cipher machine used cannot be established with certainty","One of many less-famous Nazi wartime cryptograms Schmeh has surfaced from private collections"],significance:"Klaus Schmeh has systematically catalogued dozens of previously unknown WWII cryptograms held in private collections, museum archives, and family holdings — a body of primary-source research that has substantially expanded the corpus available to historians."},{id:"markovian",name:"Markovian Parallax Denigrate",category:"Broadcast / Internet",era:"August 1996",origin:"Anonymous poster on Usenet newsgroups",status:"unsolved",description:`A series of over 100 Usenet posts with the subject line "Markovian Parallax Denigrate" containing seemingly random word salads. Called by many the internet's oldest unsolved mystery.`,cipherType:"Unknown — may be steganographic, a Markov chain output, or genuine coded traffic.",details:["Posted from anonymous remailers across many Usenet newsgroups in August 1996","Contains grammatically plausible but semantically empty English text","Word distributions statistically resemble Markov chain output — hence the title","Some researchers believe it may have been an early anonymous covert-channel test","Klaus Schmeh published extensive analysis on Cipherbrain in 2019","Neither the sender nor the purpose has ever been identified"],significance:"Schmeh's reporting brought this obscure 1990s puzzle to mainstream attention. It sits at an unusual intersection: born in the internet era, but with no known solver, no confirmed cipher, and no author."},{id:"karl-v",name:"The Charles V Letter (1547)",category:"Diplomatic",era:"11 February 1547",origin:"Holy Roman Emperor Charles V to his ambassador Jean de Saint-Mauris",status:"solved-recently",description:"A four-page enciphered letter from Emperor Charles V, revealed in November 2022 to contain intelligence about a rumoured assassination plot against him and negotiations regarding the French king.",cipherType:"Complex nomenclator with 120+ symbols, homophones for common letters, and null characters. Included named-entity codes for people and places.",details:["Deciphered by Cécile Pierrot at the Loria research institute in Nancy, France","Held for centuries in the Stanislas library in Nancy without decryption","Klaus Schmeh reported the breakthrough on Cipherbrain in November 2022 with characteristic caveats about press sensationalism","The plaintext discusses fears of assassination by Piero Strozzi","Charles V used similar nomenclators for all sensitive diplomatic correspondence","Represents a broader European trend: 16th-century diplomacy relied heavily on such compound cipher systems"],significance:"One of the highest-profile cryptographic decipherments of the 2020s. Schmeh's coverage emphasised the scholarly rather than sensational aspects — the letter's cipher system is representative of an entire class of Renaissance diplomatic codes still awaiting analysis."}],c2=[{holder:"Klaus Schmeh",country:"Germany",period:"Founder",note:'Established the Friedman Ring as a "solve then challenge" bearer competition on Cipherbrain.'},{holder:"Anna Bernhardt",country:"Germany",period:"Second holder",note:"Solved the initial challenge and posted her own."},{holder:"Armin Krauß",country:"Germany",period:"Third holder",note:"Solved Anna's challenge and issued the next."},{holder:"Christoph Tenzer",country:"Austria",period:"Fourth holder",note:"Continued the chain in 2021."},{holder:"Matthew Brown",country:"USA",period:"Later holder",note:"Posed the challenge that David Vierra solved."},{holder:"David Vierra",country:"USA",period:"Bearer as of December 2022",note:"Most recent known holder announced in the final Cipherbrain article."}],d2=[{title:"Personal-use encryption",summary:"Diary and notebook ciphers designed by a single author for their own use. Often non-key-based, quirky, and full of undocumented shortcuts — which paradoxically makes them harder to break than professionally-designed systems.",examples:["Voynich Manuscript","James Hampton's notebook","Rohonc Codex","McCormick notes"]},{title:"Encrypted newspaper advertisements",summary:"The Victorian and Edwardian personal columns of London newspapers carried thousands of encrypted messages — love notes, secret meetings, illicit affairs. Schmeh has catalogued many that remain unsolved.",examples:["1893 Evening Standard advertisement",'The Times "agony column" ciphers']},{title:"Cryptograms on gravestones and monuments",summary:"Inscriptions on memorials, tombs, and public art that contain deliberately encrypted messages — often personal, religious, or numerological.",examples:["Shugborough inscription","Bundeswehr Ehrenmal code","Kryptos K4"]},{title:"Wartime remainders",summary:"Individual Enigma, Lorenz, SG-41, and hand-cipher messages surviving in private hands, museum archives, and family collections — many never previously analysed.",examples:["Three unsolved Enigma M4 messages (2 solved 2006, 1 solved 2013)","The Lippert SS message","Unsolved M-209 message series"]},{title:"Fictional cipher hoaxes",summary:"Ciphers that were never intended to have a solution but were presented as genuine. Schmeh's scepticism is a running theme — treating Beale, some Blitz Cipher claims, and various treasure ciphers as literary artefacts rather than cryptographic ones.",examples:["Beale Ciphers","La Buse pirate treasure cipher","Some Blitz Cipher claims"]},{title:"Post-quantum cryptography",summary:"Beyond his historical work, Schmeh publishes on modern cr
