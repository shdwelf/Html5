plugins { id 'com.android.library' }
android {
    namespace 'com.termux.emulator'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        minSdk 28
        externalNativeBuild { ndkBuild { cFlags '-std=c11', '-Wall', '-Wextra', '-Werror', '-Os', '-fstack-protector-strong', '-Wl,-z,max-page-size=16384' } }
        ndk { abiFilters providers.gradleProperty('toolboxAbi').getOrElse('x86_64') }
    }
    sourceSets { main { java.srcDirs = ['../../../build/zshaolin/terminal-source/terminal-emulator/src/main/java'] } }
    externalNativeBuild { ndkBuild { path '../../../build/zshaolin/terminal-source/terminal-emulator/src/main/jni/Android.mk' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.annotation:annotation:1.9.1' }
