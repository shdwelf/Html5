plugins { id 'com.android.library' }
android {
    namespace 'com.termux.view'
    compileSdk 35
    defaultConfig { minSdk 28 }
    sourceSets { main {
        java.srcDirs = ['../../../build/zshaolin/terminal-source/terminal-view/src/main/java']
        res.srcDirs = ['../../../build/zshaolin/terminal-source/terminal-view/src/main/res']
    } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { api project(':engine'); implementation 'androidx.annotation:annotation:1.9.1' }
