Searched: web indexes for Catherine Greeran/Greenan/Gregan Queens NY → no maiden name hit.
False positive: Catherine Christina Gregan (b. 1888 Dublin, dau. Hugh Gregan & Elizabeth Russell) = DIFFERENT family.

ACTION PLAN:
1. FamilySearch "NY Passenger Lists 1909-1957" for Greeran/Greenan arriving ~1918-1925
2. NYC Municipal Archives marriage license for Hugh Greeran ~1920-1930
3. NARA naturalisation records (RG21) for Hugh Greeran — names parents + birthplace
4. NY State death certificate for Hugh Greeran — names parents, spouse maiden name
5. SSDI prefix 085-XX = NY issuance

This is the CRITICAL remaining gap. Resolving Catherine's maiden name confirms/refutes the Q3 James Greeran + Q4 Mary Hillen assignments.`,category:"brick_wall",tags:["Catherine Greeran","maiden name","ship manifest","Q3","Q4","Queens NY"]},{id:"seed-conalty-1832",timestamp:Date.now()-15e3,title:"BREAKTHROUGH: Conalty/Conatty confirmed in 1832 Drumgooland register",content:`Three separate discoveries from the 1832 Drumgooland baptism index and Ros Davies pages:

1. Ellen Conatty (Father: Arthur, Mother: Gallagher Bridget) bpt. 09-Dec 1832 — Arthur Conatty is Gen 7 candidate for Mary Conalty Sr
2. James Doyle (Father: Nicholas, Mother: Conatty Mary) bpt. 24-Nov 1832 — Mary Conatty (née?) active 1832
3. Rose Greenan (Father: James, Mother: Burns Ellen) bpt. 15-May 1832 — CONFIRMS James Greenan × Ellen Burns couple!

Ros Davies Murray page: "Patrick Conalty of Ballymacilreiny then Derryneal (1843) 30 Jun 1836" — Conalty held land in EXACT tree townland.

CONCLUSION: "Conalty" is a genuine local 1832 Drumgooland spelling — NOT a mis-transcription of Connolly!

Added to tree: Daniel Dougherty (@I999060@), Cicily Kearney (@I999061@), Family @F42@.`,category:"source_found",tags:["Dougherty","Kearney","Drumlee","Drumgooland","Campbell","Priority1","Priority2"]},{id:"seed-followup-decomet",timestamp:Date.now()-6e4,title:"FOLLOW-UP: Third Decomet Greeran funeral (18 Mar 1835) found",content:`Deeper pass of Ros Davies Gre... index found a SECOND Greeran "of Decomet" funeral 18 Mar 1835 at Drumgooland Lower CC — distinct from the 3 Jun 1833 Bernard Greenan funeral.

Three Decomet Greeran deaths now bracket Bernard Sr birth (~1830):

CONCLUSION: Decomet confirmed as the multi-generational Greeran seat. At least 2 adult Greeran deaths 1833-1835 predate Bernard Sr marriage (1854) = parental/grandparental generation dying off.

Next: NLI burial register images (Pos. 5497) for 18 Mar 1835 name+age; Greeran-Burns/Greeran-Doran marriage ~1810-1830 to fix Gen 8.`,category:"source_found",tags:["followup","Decomet","Gen7","Gen8","Priority1","funerals"]},{id:"seed-priority5-legendre",timestamp:Date.now()-12e4,title:"PRIORITY 5: LeGendre Acadian Root (Le Bon Papa 1785) + Texas census gap",content:`ACADIAN LEGENDRE ROOT FOUND (Acadians in Gray):
• Jean-Baptiste Legendre b. 8 Jan 1760 Meillac, France — son of François Legendre & Marguerite Labauve of Île St.-Jean. Carpenter.
• m. Marie-Rose LeTullier (b. c1765 Cherbourg, dau. René LeTullier of Normandy & Colette Renaud of Île St.-Jean) 9 Sep 1783 St.-Martin de Chantenay, Nantes.
• Sailed to Louisiana aboard LE BON PAPA (1st of Seven Ships, arr. New Orleans 29 Jul 1785), settled Manchac, S. of Baton Rouge.
• Exile path: Île St.-Jean → St.-Malo/Meillac → Poitou (1773-75) → Nantes/Chantenay → Louisiana 1785.

SECOND (Foreign French) branch: François Legendre fils b. 14 May 1779 Chantenay m. Henriette-Adélaïde Richard 27 May 1810 Plattenville, Assumption Parish; settled Bayou Lafourche.

Sally LeGendre (b.1880 TX/LA, Q16) descends from one of these S. Louisiana branches migrated to Texas.

TEXAS CENSUS GAP (negative): No clear 1900/1910 TX household for William C. Carey Jr + Sally LeGendre + Daisy Beatrice Carey. Cause: variant spellings (Cary/Carey, LeGendre mis-transcribed, Durando→Durand). PIVOT to Texas death index + Louisiana parish records + CA death index for Daisy (d.1989 Monrovia).

Added to tree: Washington Durando (@I999050@), Jean-Baptiste Legendre 1760 (@I999052@), Marie-Rose LeTullier (@I999053@).`,category:"breakthrough",tags:["Priority5","LeGendre","Acadian","LeBonPapa","Durando","Texas","Q16","Gen9"]},{id:"seed-priority4-hewitt",timestamp:Date.now()-2e5,title:"PRIORITY 4: Hewitt California Pioneer + Ulster Plantation",content:`Hewitt is Anglo-Norman Huet (little Hugh) via Montgomery-Hamilton Plantation (1606). No pre-1901 Irish census — use Griffith's Valuation householder index (FHL 919003 Down, 919001 Antrim) and Tithe Applotment as substitutes.

Next: 1881 UK Census Dudley, California Great Register for immigration year, Stockton 1920 neighbors.`,category:"hypothesis",tags:["Priority4","Hewitt","California","Dudley","Stockton","Q9","Q10","Gen6"]},{id:"seed-priority3-beauce",timestamp:Date.now()-4e5,title:"PRIORITY 3: Beauce Morin Cluster — Sainte-Marie-De-Beauce back to 1727",content:`Morin Beauce cluster found:

ampbell-Dougherty marriage","Examine Griffith's Valuation for Daniel Dougherty's holding in Drumlee ~1863"]},{id:"gen8-gen9-historical-tenancy-depth",date:"2026-session",title:"Gen 8 & 9 Ancestry: 1659 Poll Tax & 1610 See Land Tenant Rights in Iveagh",category:"primary_source",confidence:"high",summary:"Historical research into the 128 (Gen 8, ~1730–1760) and 256 (Gen 9, ~1700–1730) wedge generations reveals remarkable continuity: 1659 Poll Tax returns for Upper Iveagh (Drumgooland and Clonduff) show that native Catholic peasantry (Ó Grianáin and Ó Conghaile clans) suffered no clearance during Cromwellian or Williamite settlements. Occupants of the Four See Lands of Clonduff won perpetual tenant rights from King James I in 1610, establishing 300+ years of uninterrupted land tenancy.",details:["GEN 8/9 ANCESTRY CONTEXT (128 & 256 Wedge Generations)","1610 See Land Leases: King James I granted perpetual tenant rights for £2/townland to occupants of Leitrim, Ballymaghery, Ballyaughian, and Ballynanny — securing native tenant rights","1659 Poll Tax Returns: Confirms native peasantry retained occupation under Cromwellian grants without mass clearances","1744 Oration at Old Clonduff Church: Dr. James Pulleine (Séamas Mac Poilín) delivered famous Gaelic funeral oration for Eoghan O'Neill at Ballymaghery","1766 Religious Census: Drumgooland & Clonduff remained 85%+ Roman Catholic — Ó Grianáin and Ó Conghaile septs maintained Catholic identity","1779 Church of Ireland Registers: Drumgooland COI baptisms start 1779 (PRONI MIC.1/40) — captures Gen 8 (#128-#255) births during the pre-Famine era"],relatedPersons:["Bernard Greenan of Decomet (d. 1833)","Catherine Greenan (d. 1846)","Hugh Greenan (Ballymagenaghy 1803)","Edward Grinan (Moneyslane 1803)"],relatedPlaces:["Drumgooland","Clonduff","Moneyslane","Ballymackilreiny","Dechomet","Iveagh Upper"],sourceName:"Clonduff Parish History (Dean Davies) + 1659 Poll Tax Returns + 1766 Religious Census",sourceUrl:"http://www.clonduffpar reeran SSN prefix 085-XX indicates NY issuance — no death date in tree (only "New York, USA")',"Alternative: New York City marriage license records 1908-1929 (NYC Municipal Archives) for Hugh Greeran × Catherine [maiden]"],relatedPersons:["Catherine Greeran (@I142780135752@)","Hugh Greeran (@I142778829932@)","James Greeran (@I999018@)","Mary Hillen (@I999019@)"],relatedPlaces:["Queens, New York","Ireland","Ellis Island"],sourceName:"Ancestry.com passenger list index (paywall) + FamilySearch ship manifests + NYC Municipal Archives",quarterImpact:"Resolving Catherine's maiden name confirms/refutes Q3 James Greeran + Q4 Mary Hillen assignments.",nextActions:['Search FamilySearch.org "New York Passenger and Crew Lists 1909-1957" for Greeran/Greenan/Greeren 1918-1925',"Search NYC Municipal Archives marriage license index for Hugh Greeran 1920-1930","Search NARA naturalisation records (Record Group 21) for Hugh Greeran — names parents + birthplace","Order Hugh Greeran death certificate from NY State (names parents, spouse maiden name)"]},{id:"decomet-greeran-funeral-cluster",date:"2026-session",title:"FOLLOW-UP: Three Decomet Greeran funerals bracket Bernard Sr birth",category:"primary_source",confidence:"high",summary:`A deeper pass of the Ros Davies Gre... index reveals a SECOND Greeran "of Decomet" funeral on 18 Mar 1835 at Drumgooland Lower Catholic Church, distinct from the 3 Jun 1833 Bernard Greenan funeral. Combined with Catherine Greenan of Decomet (funeral 10 Dec 1846, aged 60), there are now three documented Greeran deaths in the same Decomet townland bracketing Bernard Greeran Sr's ~1830 birth — cementing Decomet as the ancestral Greeran seat and giving multiple Gen 7/8 death-record anchors.`,details:["FOLLOW-UP RESEARCH (post-queue deepening of Priority 1)","Funeral 1: Bernard Greenan of Decomet — 3 Jun 1833, Drumgooland Lower CC (logged prior)","Funeral 2: (Greeran) of Decomet — 18 Mar 1835, Drumgooland Lower CC (NEW — second death in same window)","Funeral 3: Catherine Greenan of Decomet — 10 Dec 1846, aged 60 (b.~1786), Drumgooland Lower CC","Funeral 4: Cicily Greenan of Decomet — 10 May 1849, aged 28 (b.~1821)","Collateral James Greenan of Decomet — husband of Ellen(or) Burns; children Rose (bpt. 15 May 1832), Ellenor (bpt. 8 Feb 1835) — the 1835 funeral may relate to an infant/family member of this household","Decomet neighbour deaths (context): Doran of Decomet (30 Mar 1833), Downey of Decomet (4 Jan 1840, aged 83), Burns of Decomet (7 Jun 1839, aged 24), Morgan of Decomet (25 Jul 1835)","CONCLUSION: Decomet is the confirmed multi-generational Greeran seat; at least 2 adult Greeran deaths 1833-1835 predate Bernard Sr's marriage (1854), consistent with a parental/grandparental generation dying off"],relatedPersons:["Bernard Greeran Sr (@I999001@)","Bernard Greenan of Decomet d.1833 (@I999041@)","Catherine Greenan of Decomet d.1846 (@I999042@)","James Greenan of Decomet (@I999043@)"],relatedPlaces:["Decomet","Drumgooland Lower","Down, Ireland"],sourceName:"Ros Davies Co. Down Surnames Index — Gre... (Drumgooland Lower PR funerals)",sourceUrl:"https://www.rosdavies.com/SURNAMES/G/Gre.htm",quarterImpact:"Reinforces Gen 7 (#64-65) Decomet Greeran couple; provides a 3rd death anchor (18 Mar 1835) for the parental generation.",nextActions:["Order NLI Drumgooland Lower burial register images (Pos. 5497) for the 18 Mar 1835 entry to capture the deceased's given name + age","Reconstruct the full Decomet Greeran household from 1832-1835 baptisms (James×Ellen Burns children)","Search for a Greeran-Burns or Greeran-Doran marriage ~1810-1830 to fix the Gen 8 couple"]},{id:"legendre-acadian-le-bon-papa",date:"2026-session",title:"PRIORITY 5: LeGendre Acadian Root — Le Bon Papa (1785) Seven Ships",category:"primary_source",confidence:"high",summary:"The Acadian LeGendre line traces to Jean-Baptiste Legendre (b. 8 Jan 1760 Meillac, France), son of François Legendre & Marguerite Labauve of Île St.-Jean. A carpenter, he married Marie-Rose LeTullier (b. c1765 Cherbourg, dau. of René LeTullier of Normandy & Colette Renaud of Île St.-Jean) on 9 Sep 1783 at St.-Martin de Chantenay, Nantes. They sailed to Spanish Louisiana aboard Le Bon Papa (first of the Seven Ships, arr. New Orleans 29 Jul 1785) and settled at Manchac, south of Baton Rouge. This anchors the Q16 maternal-maternal deep line to the Acadian Grand Dérangement.",details:["PRIORITY 5 RESEARCH RESULT (Carey/LeGendre/Durando branch)","Le Bon Papa passenger list (Family 34/35): Jean-Baptiste Legendre, carpenter, age 25; Marie-Rose LeTullier, wife, age 20; Rose Legendre, infant daughter (breast-feeding)","Ship departed France 10 May 1785 (Capt. Pelletier), 280 tons, 80-day voyage, arrived Louisiana 29 Jul 1785","Also aboard: Marguerite Labauve (widow of François Legendre, age 55) with sons Louis-Joseph (22) & Yves-François (17), and married daughter Henriette Legendre (32, wife of Daniel Benoit)","Colette Renaud (Marie-Rose's mother, widow of René LeTullier, age 45) followed on L'Amitié (5th of Seven Ships, arr. Nov 1785), also settling at Manchac","SECOND (Foreign French) Legendre branch: François Legendre fils (b. 14 May 1779 Chantenay, son of François Legendre & Françoise Menoux) m. Henriette-Adélaïde Richard 27 May 1810 Plattenville, Assumption Parish; d. 21 Nov 1847 Thibodaux; settled upper Bayou Lafourche/Terrebonne","Sally LeGendre (b. 1880 Texas/Louisiana, tree Q16) descends from one of these South Louisiana branches that migrated west into Texas","Acadian exile path: Île St.-Jean → St.-Malo/Meillac → Poitou (1773-75) → Nantes/Chantenay → Louisiana (1785)"],relatedPersons:["Sally LeGendre (@I999035@)","Jean-Baptiste Legendre (1760)","Marie-Rose LeTullier","François Legendre fils (1779)","Henriette-Adélaïde Richard","Marguerite Labauve"],relatedPlaces:["Île St.-Jean (PEI)","Meillac, France","Chantenay, Nantes","Manchac, Baton Rouge","Plattenville, Assumption Parish","Bayou Lafourche","Texas"],sourceName:"Acadians in Gray (Steven A. Cormier) — Legendre Appendix + Le Bon Papa passenger list",sourceUrl:"http://www.acadiansingray.com/Appendices-ATLAL-LEGENDRE.htm",quarterImpact:"Anchors Q16 (#31) deep maternal line to Acadian Grand Dérangement; extends to Gen 9-10 (François Legendre & Marguerite Labauve of Île St.-Jean, c1730).",nextActions:["Determine which Louisiana Legendre branch migrated to Texas (Austin/Bellville area) by 1880","Search Louisiana Assumption/Lafourche parish records for the Legendre→Texas migration generation","Order Texas death certificate for Daisy Beatrice Carey (d. 1989 Monrovia CA) to confirm Sally LeGendre as mother"]},{id:"texas-carey-negative",date:"2026-session",title:"PRIORITY 5: Texas Carey/Durando Census Gap (primary records needed)",category:"negative",confidence:"medium",summary:`Systematic search of Texas 1900/1910 census aggregators (RootsWeb, Ancestry indices) returned NO clear household matching William C. Carey Jr + Sally LeGendre + Daisy Beatrice Carey. This negative result indicates the tree's Texas Carey line requires Texas state vital records and Louisiana parish registers rather than census indexes — likely due to enumeration under variant spellings (Cary, Carey, Legendre transcribed as "Southern/Dauchem", Durando as Durand).`,details:["PRIORITY 5 NEGATIVE EVIDENCE",'Note (Austin Co TX GenWeb): a "Sallie" appears in 1880 census aged 25 b. Texas, surname mis-transcribed as "Dauchem" (actual image says "Southern") — cautionary tale for LeGendre transcription errors','Washington Durando: no Texas census hit; "Durando" likely enumerated as "Durand" (French Creole spelling)',"STRATEGY: pivot from census aggregators to (1) Texas Department of State Health Services death index, (2) Louisiana Catholic parish sacramental records, (3) California death index for Daisy Beatrice Carey (d. 20 Jan 1989 Monrovia)","The 1904 Texas birth of Daisy Beatrice Carey predates mandatory Texas birth registration (1903 statewide but poorly enforced until 1908) — church baptism more
