ained and interrogated in Iran for nine months in 1992","The case demonstrates that an implementation or supplier can defeat even convincing-looking cryptography"],significance:"Described in the CIA history as the intelligence coup of the century, RUBICON is also a lasting warning: security depends on trustworthy algorithms, implementations, operating procedures, vendors, and key generation—not merely on owning a device marked secure."},{id:"kryptos",name:"Kryptos",location:"CIA Headquarters, Langley, Virginia",era:"Modern · 1990",status:"K1–K3 Solved · K4 UNSOLVED after 35 years",description:"A 12-foot copper sculpture in the CIA courtyard by artist Jim Sanborn, encoded with four cryptographic puzzles totaling 865 characters.",details:["K1 — Vigenère cipher, key PALIMPSEST — solved publicly 1999 (NSA solved secretly 1992)","K2 — Vigenère cipher, key ABSCISSA — solved 1999","K3 — Transposition cipher, quotes from Howard Carter's diary at King Tut's tomb — solved 1999","K4 — Unknown system, only 97 characters — UNSOLVED as of 2026","Sanborn released four hints: BERLIN, CLOCK, NORTHEAST, EAST","Cryptographic consultant: Edward Scheidt, former CIA cryptographer","In November 2025, Sanborn auctioned the K4 solution archive for over $200,000"],significance:"One of the most famous unsolved cryptographic puzzles in the world. K4 has resisted professional cryptologists, academics, and amateurs for over three decades."},{id:"bombe",name:"Turing-Welchman Bombe",location:"Bletchley Park, UK / National Museum of Computing",era:"WWII · 1940",status:"Original destroyed 1945 · Reconstructed 2007",description:`Electromechanical device designed by Alan Turing (August 1940 prototype "Agnus") and perfected by Gordon Welchman's diagonal board, used to break Enigma-enciphered messages.`,details:['First Bombe "Victory" began operations at Bletchley Park on 14 March 1940',"211 Bombe machines were built and operated by war's end","1,676 female WRNS (Wrens) and 263 male RAF personnel operated the machines","Manufactured by the British Tabulating Machine Company (BTM)","Exploited the flaw that no Enigma letter could ever encrypt to itself","Welchman's diagonal board dramatically reduced false-positive stops","Operators worked in shifts around the clock in dark, oppressive rooms","US Navy adapted the design for four-rotor Enigma M4, operated by WAVES"],significance:"Alongside Colossus, widely regarded as having shortened WW2 and saved countless lives. Marked one of the earliest milestones on the road to modern digital computing."},{id:"sigaba",name:"SIGABA / ECM Mark II",location:"National Cryptologic Museum, Fort Meade",era:"WWII · 1940–1950s",status:"Never broken by enemy cryptanalysts",description:"The most important American rotor cipher machine of WW2, with three banks of five rotors each in a completely irregular stepping arrangement.",details:["Three rotor banks: main cipher rotors, control rotors, and index rotors","Used by U.S. forces from the 1940s onward","Never broken during its entire operational life","One SIGABA at the National Cryptologic Museum was used by President Roosevelt to communicate with Winston Churchill","Featured 15 rotors total with pseudorandom stepping controlled by the second bank","Approximately 10,000 units produced","Remained in service until the mid-1950s"],significance:"The gold standard of Allied high-level cryptographic security throughout WW2. Its unbroken status demonstrates the value of Turing/Friedman-style irregular rotor stepping."},{id:"purple",name:"PURPLE (97-shiki O-bun In-ji-ki)",location:"National Cryptologic Museum, Fort Meade (partial reproduction)",era:"WWII · 1939–1945",status:"Broken by U.S. cryptologists BEFORE Pearl Harbor",description:"Japanese diplomatic cipher machine using stepping switches (not rotors) — a design entirely different from the German Enigma.",details:["Broken by William Friedman's Signal Intelligence Service team in September 1940","Reconstruction built without ever seeing an actual PURPLE machine","Intelligence derived from PURPLE was codenamed MAGIC","Contributed to the U.S. Navy victory at the Battle of Midway","Japan continued to use PURPLE throughout the war, believing it unbreakable","Only fragments of PURPLE machines were ever recovered"],significance:"The MAGIC intelligence produced by breaking PURPLE gave the U.S. unprecedented insight into Japanese diplomatic and military intentions throughout WW2."},{id:"colossus",name:"Colossus Mark II",location:"The National Museum of Computing, Bletchley Park",era:"WWII · 1944",status:"10 units built · 8 destroyed 1945 · rebuilt 2007",description:"The world's first programmable digital electronic computer, built by Tommy Flowers to break the Lorenz SZ40/42 (Tunny) cipher used by German High Command.",details:["Mark I operational January 1944; Mark II June 1944 (five times faster)","2,500 vacuum tubes in Mark II","Read paper tape at 5,000 characters per second (max 9,700)","Used shift registers, counters, and Boolean logic","Programmable via switches and plug panels","Remained classified until the late 1970s","Rebuilt by Tony Sale and team at Bletchley Park, operational since 2007"],significance:"Beat America's ENIAC by two years but received no historical credit until declassification. Fundamentally shaped the trajectory of postwar computing."},{id:"fialka",name:"Fialka M-125",location:"Various museums including Crypto Museum, Netherlands",era:"Cold War · 1965–1990s",status:"Top secret until 1990s",description:`Soviet 10-rotor cipher machine, developed as an "improved Enigma" fixing all of Enigma's known cryptographic weaknesses.`,details:["10 rotors, each with 30 pins (vs Enigma's 3–4 rotors with 26)","Rotors stepped in opposite directions","Punched card reader replaced the plugboard",'Special "magic" reflector circuit that allowed a letter to encrypt to itself',"Used by all Warsaw Pact nations","Each country had its own custom rotor wiring set","Never broken during its operational period"],significance:"The Soviet answer to the KL-7. Its top-secret status until the 1990s means much of its operational history remains classified in Russian archives."},{id:"venona",name:"VENONA Project Papers",location:"National Cryptologic Museum & NSA Historical Collection",era:"Cold War · 1943–1980",status:"Declassified 1995",description:"A U.S. Army Signal Intelligence Service (later NSA) counterintelligence program to decrypt Soviet intelligence agency messages sent during WWII.",details:['Exploited Soviet reuse of One-Time Pad key material (a "two-time pad" mistake)',"Began under Gene Grabeel in February 1943","Meredith Gardner made the first substantial break in 1946","Identified Klaus Fuchs, Julius & Ethel Rosenberg, Alger Hiss, and Kim Philby as Soviet agents","Approximately 3,000 messages partially or fully decrypted","Only 1% of intercepted traffic was ever readable","Full declassification came only in 1995"],significance:"Proves that even the theoretically unbreakable One-Time Pad fails if operators reuse key material — a lesson written in the identities of the Cambridge Five and the Manhattan Project spies."},{id:"zimmermann",name:"Zimmermann Telegram",location:"National Archives, UK / U.S. National Archives",era:"WWI · January 1917",status:"Broken by British Room 40",description:"A secret diplomatic communication from the German Foreign Office proposing a military alliance with Mexico against the United States.",details:["Sent by German Foreign Secretary Arthur Zimmermann on 17 January 1917","Encrypted with German diplomatic code 0075 (later switched to 13040)","Intercepted and partially decrypted by Nigel de Grey at Room 40 (British Admiralty)",'Offered Mexico "generous financial support" and the return of Texas, New Mexico, and Arizona',"Publication in U.S. newspapers on 1 March 1917 shifted American public opinion","Direct contributor to the U.S. declaration of war on Germany on 6 April 1917"],significance:"The single most consequential cryptographic decryption in history — it directly changed the course of World War I by bringing the United States into the conflict."},{id:"code-talkers",name:"Navajo Code Talkers",location:"National Cryptologic Museum & Museum of the American Indian",era:"WWII · 1942–1945",status:"Never broken by Axis forces",description:"Marine Corps units of Navajo speakers who used their language, augmented by a specialized 400-word military vocabulary, as an unbreakable battlefield code.",details:["29 original Navajo Code Talkers recruited in May 1942 at Camp Pendleton","Ultimately over 400 Navajo Marines served in the Pacific Theater",'Custom vocabulary invented for military terms (e.g., "iron fish" = submarine)',"Deployed at Iwo Jima, Guadalcanal, Tarawa, Peleliu, and Okinawa","At Iwo Jima, six Navajo Code Talkers sent over 800 messages in 48 hours — all without error","Program remained classified until 1968","Congressional Gold Medal awarded to the original 29 in 2001"],significance:"Demonstrated that the most sophisticated cryptographic system of WW2 was not a machine, but human ingenuity — a code the Japanese never broke and could not even identify as a language."}],Rm=[{name:"Caesar Cipher",category:"Substitution",yearInvented:"~50 BC",inventor:"Julius Caesar",description:"Shift each letter by a fixed number of positions. Caesar himself used a shift of 3.",strength:"Trivially broken by frequency analysis or brute-force (only 25 possible shifts)."},{name:"Atbash",category:"Substitution",yearInvented:"~500 BC",inventor:"Ancient Hebrew scribes",description:"Reverse alphabet: A↔Z, B↔Y, etc. Used in Hebrew religious texts.",strength:"No key; trivially broken."},{name:"Vigenère",category:"Polyalphabetic",yearInvented:"1553",inventor:"Giovan Battista Bellaso (misattributed to Blaise de Vigenère)",description:'Repeating keyword shifts each letter differently. Called "le chiffre indéchiffrable" for 300 years.',strength:"Broken by Charles Babbage (1854) and Friedrich Kasiski (1863) using frequency my Flowers' Colossus."},{name:"DES (Data Encryption Standard)",category:"Modern Block Cipher",yearInvented:"1975 (published 1977)",inventor:"IBM (based on Horst Feistel's Lucifer)",description:"56-bit key block cipher, first public U.S. federal encryption standard.",strength:"Broken by brute force in 1998 (EFF Deep Crack, 22 hours). Officially withdrawn 2005. Triple DES extended its life to 2023."},{name:"AES (Advanced Encryption Standard)",category:"Modern Block Cipher",yearInvented:"2001",inventor:"Vincent Rijmen & Joan Daemen (Rijndael)",description:"Successor to DES. Selected by NIST from 15 candidates. 128/192/256-bit keys, 10/12/14 rounds.",strength:"No practical attack better than brute force. AES-256 is used to protect U.S. TOP SECRET information."},{name:"RSA",category:"Public Key",yearInvented:"1977",inventor:"Rivest, Shamir, Adleman (MIT)",description:"Asymmetric cipher based on the difficulty of factoring large prime products.",strength:"Secure with sufficient key size (2048+ bits). Threatened by future quantum computers running Shor's algorithm."},{name:"ChaCha20",category:"Modern Stream Cipher",yearInvented:"2008",inventor:"Daniel J. Bernstein",description:"256-bit key stream cipher, chosen by Google to replace RC4 in TLS.",strength:"No known practical attacks. Faster than AES on devices without hardware acceleration."}],_g=[{name:"Alan Turing",years:"1912-1954",organization:"GC&CS, Hut 8",field:"Naval Enigma / computing",contribution:"Led the attack on German Naval Enigma, designed core ideas behind the British Bombe, and later formulated foundational concepts in computing and artificial intelligence.",source:"GCHQ History"},{name:"Gordon Welchman",years:"1906-1985",organization:"GC&CS, Hut 6",field:"Enigma / cryptanalytic engineering",contribution:"Created the Bombe diagonal board, dramatically reducing false stops, and built an industrial organization for exploiting German Army and Air Force Enigma traffic.",source:"GCHQ History"},{name:"Mavis Batey sage transmitted on June 22, 1941.",briefing:`Bletchley Park Station X intercepted an Enigma message sent by Panzer Group 2 on the Eastern Front.

legal agent",origin:"London, UK",years:"1988 arrest",type:"Espionage Case",description:"Arrested by British Special Branch while actively receiving a numbers message on shortwave radio; one-time pads were found hidden on microfilm inside bars of soap.",details:["Caught red-handed mid-transmission, a rare case of direct evidence","One-time pads enabled detectives to decrypt intercepted messages for trial","Sentenced to 10 years imprisonment"]},{id:"ivy-bells",name:"Operation Ivy Bells",callsign:"USS Halibut Submarine Wiretap",origin:"Sea of Okhotsk, USSR territorial waters",years:"1971",type:"Espionage Case",description:"U.S. nuclear submarine USS Halibut placed a 6-ton wiretap on a Soviet undersea communications cable connecting a naval base to fleet headquarters — deep within heavily-patrolled Soviet waters.",details:["Cable connected Kamchatsky submarine base to Vladivostok Fleet HQ","One of the most daring SIGINT operations of the entire Cold War","Similar Soviet submarine SIGINT missions remain hidden in Russian archives"]}],t1=[{name:"Lincolnshire Poacher (E3)",operator:"British SIS/MI6",location:"RAF Akrotiri, Cyprus",years:"1970s–2008",signature:"English folk tune interval signal"},{name:"Swedish Rhapsody",operator:"Polish SB/UOP",location:"Poland",years:"1950s–1998",signature:"Music box melody + child voice"},{name:"Atención",operator:"Cuban DGI",location:"Havana, Cuba",years:"1960s–Present",signature:'"Atención" call, female voice'},{name:"UVB-76 (The Buzzer)",operator:"Russian military (unconfirmed)",location:"Russia (relocated 2010)",years:"1982–Present",signature:"Continuous monotone buzz"},{name:"Yankee Bravo",operator:"Believed KGB",location:"Unknown",years:"Cold War era",signature:'German female voice, "Yankee Bravo" callsign'},{name:"Cherry Ripe",operator:"British SIS (Asian sister of Lincolnshire Poacher)",location:"Asia-Pacific region",years:"Still active",signature:"English folk tune variant"},{name:"Stasi Gong Station",operator:"East German Stasi 08538 20333 27838 52662 13523 27833 39332 81488 25260 82636`,info:"Published in 2010 by Dirk Rijmenants, this cipher uses only pencil, paper, and a secret key phrase. The accompanying poem is a hint to the key but is not itself used in the encryption. There are 600 digits in 120 five-digit groups. This remains one of the most difficult manual cryptograms ever published.",solvedBy:"Oleksii Sylichenko (Ukraine)",solvedDate:"8 February 2023 — the first and only person to solve it since publication in 2010"},$i=[{id:"art-goldbug",title:"The Gold-Bug: Poe and the Popularisation of Cryptography",author:"Edgar Allan Poe / Dirk Rijmenants",category:"Cryptography in Literature",summary:"Poe's 1843 prize-winning story taught a generation how to break monoalphabetic substitution ciphers with letter frequency analysis.",content:`In 1840, Edgar Allan Poe challenged readers of Alexander's Weekly Messenger to submit substitution ciphers for him to solve. Cryptograms poured in from across the United States, and Poe published many solutions, sparking a national fascination with secret writing.

In his 1841 essay "A Few Words on Secret Writing" he coined the famous line that "human ingenuity cannot concoct a cipher which human ingenuity cannot resolve." Inspired by this success, Poe wrote The Gold-Bug, which won a writing contest and its 100 dollar grand prize, and was published on 21 June 1843.

### Why It Mattered
The Gold-Bug is regarded as the first important work of popular fiction to build its plot around cryptography. It contains a step-by-step description of solving a monoalphabetic substitution cipher using letter frequency analysis. A young reader named William Friedman was so inspired that he went on to become one of the most important cryptologists in American history.

### The Method
There are 26! (about 4.03 x 10^26) possible substitution alphabets, yet the cipher falls quickly to frequency analysis. In English, E is the most common letter (around 12.7 percent), followed by T and A. Codebreakers locate the most frequent symbol, assign it E, hunt for the recurring three-symbol pattern that spells THE, and expand outward word by word until the plaintext emerges.`},{id:"art-enigma-history",title:"The Enigma Machine: Technical Marvel & Decryption Legacy",author:"Dirk Rijmenants",category:"WWII Cryptography",summary:"Detailed examination of how Arthur Scherbius patented Enigma in 1918, its adoption by the Wehrmacht and Kriegsmarine, and how Marian Rejewski and Alan Turing broke the rotor cipher.",content:`The Enigma cipher machine was invented at the end of World War I by German engineer Arthur Scherbius. Initially designed for commercial bank security, it was adopted by the German Armed Forces (Heer, Luftwaffe, and Kriegsmarine) in the late 1920s and 1930s.

### How Enigma Achieved Security
Enigma achieved polyalphabetic substitution using electromechanical rotors. Each key press sent electrical current from the keyboard through a plugboard (Steckerbrett), through 3 or 4 rotating rotors, bounced back off a reflector (Umkehrwalze), and returned back through the rotors to light up a lamp on the lampboard.

Because each rotor advanced with every key stroke, the key substitution changed constantly. The period before a 3-rotor Enigma repeated was 26 x 25 x 26 = 16,900 letters! With ring settings and 10 plug cables, the total number of theoretical key combinations exceeded **158,962,555,217,826,360,000** (158 quintillion).

### Codebreaking Breakthroughs
In 1932, Polish mathematician **Marian Rejewski** made the first critical mathematical breakthrough by reconstructing the Enigma wiring using group theory and cyclometer machines. Just before the invasion of Poland in 1939, Polish intelligence shared their discoveries with Britain and France.

At Bletchley Park (Station X), **Alan Turing** and **Gordon Welchman** designed the electromechanical *Bombe* machine, which exploited structural weaknesses—specifically "cribs" (known plaintexts) and the rule that no letter could ever encrypt to itself.`},{id:"art-kl7-adonis",title:"TSEC/KL-7 ADONIS: Cold War High-Security Rotor Cipher",author:"Dirk Rijmenants",category:"Cold War Crypto",summary:"The U.S. and NATO principal tactical off-line cipher machine used from 1952 through the 1980s.",content:`The TSEC/KL-7 (code name ADONIS) was the mainstay tactical rotor cipher machine for the United States Military, FBI, CIA, and NATO forces throughout the Cold War.

Developed by AFSA (Armed Forces Security Agency) and NSA, the KL-7 featured **8 rotors** selected from a total set of 61 rotors. Unlike Enigma, the KL-7 used sophisticated re-stepping notches and non-linear stepping cycles, rendering traditional rotor analysis virtually impossible without physical access to the key cards.

The machine printed plaintext and ciphertext onto narrow paper tape using an internal ink ribbon wheel. It was decommissioned in the late 1980s following the infamous Walker spy ring compromise.`},{id:"art-m209-hagelin",title:"Hagelin M-209: Tactical Frontline Cryptography",author:"Dirk Rijmenants",category:"Tactical Cipher Equipment",summary:"Boris Hagelin's compact mechanical cipher machine used by over 140,000 U.S. troops in WWII.",content:`The M-209 (C-38) was a small, purely mechanical tactical cipher machine designed by Swedish inventor Boris Hagelin and manufactured under license by Smith-Corona typewriter company in Syracuse, New York.

Weighing under 6 pounds, the M-209 operated without batteries or electricity. It utilized 6 key wheels with coprimely chosen pin counts (26, 25, 23, 21, 19, 17). The product of these numbers yields an astounding period of **101,405,850 letters** before the sequence repeats!

Messages were enciphered by turning a letter selection knob and crank handle, which automatically printed the ciphertext onto paper tape.`},{id:"art-otp-science",title:"One-Time Pad & The Mathematical Secret of Unbreakability",author:"Dirk Rijmenants",category:"Unbreakable Cryptography",summary:"Why One-Time Pad is mathematically proven by Claude Shannon to be immune to cryptanalysis.",content:`Invented by Gilbert Vernam and Joseph Mauborgne in 1917, the One-Time Pad (OTP) is the only encryption system mathematically proven to be **unbreakable** (perfect secrecy), provided four cardinal rules are strictly strictly maintained:

1. **True Randomness**: The key sequence must be truly random (e.g. atmospheric noise or physical dice).
2. **Equal Length**: The key length must be equal to or greater than the plaintext length.
3. **Never Reused**: A key page must NEVER be reused for another message.
4. **Absolute Secrecy**: The key sheet must be kept completely secure and destroyed immediately after single use.

If a key page is reused even once (known as a "two-time pad"), cryptanalysts can overlay the two ciphertexts, eliminate the key, and recover both plaintexts—as executed by Anglo-American codebreakers in **Project Venona** against Soviet espionage channels during WWII and the Cold War.`},{id:"art-hagelin-b21",title:"Hagelin B-21: The Machine That Started an Empire",author:"Dirk Rijmenants",category:"Cipher Machine History",summary:"In 1925, Boris Hagelin bluffed his way into building a machine to rival the Enigma — and succeeded beyond imagination.",content:`In 1925, the Swedish General Staff sought an alternative to the German Enigma. Boris Hagelin claimed he could build something superior within six months — despite having no working design at the time. He delivered.

The B-21 used a design based on Arvid Damm's "simplified rotors": two small scrambling rotors with only 5 input and 10 output contacts each, driven by an entirely new innovation — the **pin-wheel** (key-wheel). Four pin-wheels, with 17, 19, 21, and 23 pins respectively, controlled the stepping of the two ciphering rotors in a highly irregular fashion, producing a maximum period of 1,560,090 combinations.

This pin-wheel design, though modest in the B-21, would become the defining feature of every subsequent Hagelin machine — the C-35, C-36, C-38/M-209, and ultimately the legendary C-52/CX-52. Boris Hagelin's gamble transformed A.B. Cryptograph into Crypto AG, one of the most influential (and, decades later, controversial) cipher machine manufacturers in the world.`},{id:"art-hagelin-c52",title:"Hagelin C-52 & CX-52: Cold War Cryptographic Powerhouse",author:"Dirk Rijmenants",category:"Cold War Crypto",summary:'The machine that "caused ripples throughout the cryptanalytic community" — sold to over 60 countries and used into the 1990s.',content:`After the tactical success of the C-38 and its American cousin the M-209, Boris Hagelin set out to build a machine capable of resisting serious cryptanalysis for high-level military and diplomatic use. In 1952, the C-52 was born.

### Technical Leap Forward
The C-52 used 6 pinwheels selected from a pool of 12 different sizes (25, 26, 29, 31, 34, 37, 38, 41, 42, 43, 46, and 47 pins), while the more advanced CX-52 variant used 6 wheels of 47 pins each with a highly irregular, pseudo-random stepping pattern. The number of internal drum bars grew to 32, of which 5 doubled as "movement bars" to advance the pinwheels themselves.

### Astonishing Key Space
When properly configured, the CX-52 provides approximately **4.13 × 10^99** possible keys — comparable to a 331-bit key strength. For reference, there are estimated to be only 10^80 atoms in the observable universe. To this day, no ciphertext-only attack exists against a properly keyed C-52/CX-52 message; only known-plaintext attacks (first proposed by H. Paul Greenough in 1999) have proven effective.

### Legacy and Controversy
Combined with the B-52 electric keyboard (forming the "BC-52"), this machine was purchased by over 60 nations and remained in active service into the 1990s — decades after its Cold War heyday, illustrating just how far ahead of its time the pin-and-lug design truly was.`},{id:"art-colossus",title:"Colossus: Britain's Secret Digital Computer",author:"Dirk Rijmenants",category:"Codebreaking Technology",summary:"Two years before ENIAC, this top-secret machine became the world's first programmable digital electronic computer.",content:`While the Enigma dominates popular memory of WW2 codebreaking, the German High Command relied on an even more sophisticated cipher for top-level communications: the Lorenz SZ-40/42 teleprinter cipher, codenamed "Tunny" by the British.

Tunny used 12 irregularly moving pinwheels to generate a pseudo-random 5-bit stream, XORed with the plaintext teletype signal. When Bletchley Park codebreakers, including John Tiltman, discovered statistical weaknesses in this stream, they needed a machine fast enough to exploit them at scale.

### From Heath Robinson to Colossus
Max Newman's electromechanical "Heath Robinson" prototype (1943) proved the concept but was too slow and unreliable. Engineer **Tommy Flowers**, working at the Post Office Research Station, proposed an all-electronic solution using vacuum tubes — a radical idea at the time. The result, **Colossus Mark I**, became operational in January 1944, followed by the much faster Mark II in June 1944.

With up to 2,500 vacuum tubes, shift registers, and Boolean logic circuits, Colossus could read paper tape at speeds up to 9,700 characters per second. Ten Colossus machines were built and operated at Bletchley Park by war's end, producing intelligence codenamed **ULTRA**.

### Suppressed From History
Because Colossus's existence remained classified until the late 1970s, the American ENIAC — completed two years later — wrongly received credit as the world's first digital computer for decades. Only the declassification of NSA archives revealed the truth: Britain's codebreakers had built the future of computing in total secrecy.`},{id:"art-enigma-challenge",title:"The Enigma Cipher Challenge: Real Codebreaking Practice",author:"Dirk Rijmenants",category:"Interactive Challenges",summary:"Ten authentic WW2-themed messages, each harder than the last, inviting the public to become codebreakers.",content:`Since its launch, the Enigma Cipher Challenge on Dirk Rijmenants' website has invited amateur cryptanalysts worldwide to try their hand at genuine Enigma decryption, using historically accurate scenarios spanning from May 1941 (a captured German weather ship's codebook) to April 1945 (a desperate final Berlin transmission).
