<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced BIP-39 Haiku Miner</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        input[type="password"] {
            padding: 10px;
            width: 80%;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #4a5568;
            background: #1a202c;
            color: white;
            font-size: 16px;
        }
        button {
            background-color: #f7931a; 
            color: #fff;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #e08316; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .secondary-btn { background-color: #3b82f6; }
        .secondary-btn:hover { background-color: #2563eb; }
        .danger-btn { background-color: #ef4444; }
        .danger-btn:hover { background-color: #dc2626; }
        .success-btn { background-color: #10b981; }

        #status { margin-top: 10px; font-size: 14px; color: #aaa; }

        #appState { display: none; } /* Hidden until password is set */

        #haiku {
            font-family: "Georgia", serif;
            font-size: 1.5em;
            font-style: italic;
            margin: 20px 0;
            line-height: 1.6;
            white-space: pre-wrap;
            color: #fff;
        }
        #seedBox {
            background: #000;
            padding: 15px;
            border-radius: 6px;
            display: none;
            margin-bottom: 20px;
        }
        #seed { font-family: monospace; color: #4ade80; word-wrap: break-word; }

        .saved-section {
            margin-top: 30px;
            border-top: 1px solid #333;
            padding-top: 20px;
            text-align: left;
        }
        .saved-item {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .saved-content pre { font-family: "Georgia", serif; font-style: italic; margin: 0 0 10px 0; font-size: 1.1em; }
        .saved-content code { color: #4ade80; font-size: 0.9em; }
        .warning { color: #fca5a5; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Secure Haiku Miner & Encrypted Storage</h2>

    <div id="authSection">
        <p>Enter a master password. This will be used to encrypt/decrypt your cookie storage and text exports via AES-256-GCM.</p>
        <input type="password" id="masterPass" placeholder="Master Password" />
        <br>
        <button onclick="initializeStorage()">Unlock / Initialize Storage</button>
    </div>

    <div id="appState">
        <button id="generateBtn" onclick="mineHaikuWallet()">Mine Grammatical Haiku</button>
        <button class="secondary-btn" id="skipBtn" onclick="mineHaikuWallet()" style="display:none;">Skip / Next</button>
        <div id="status">Ready.</div>

        <div id="haiku"></div>

        <div id="seedBox">
            <div style="font-size: 12px; color: #888; margin-bottom: 8px;">FULL SEED PHRASE:</div>
            <div id="seed"></div>
            <button id="saveBtn" class="success-btn" style="margin-top: 15px;" onclick="saveCurrentWallet()">Save to Encrypted Cookie</button>
        </div>

        <div class="saved-section" id="savedSection" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="margin: 0;">Encrypted Cookie List</h3>
                <button class="secondary-btn" onclick="exportEncryptedTXT()">Export List as AES-256 TXT</button>
            </div>
            <div id="savedList"></div>
            <div class="warning">Note: Cookies have a ~4KB limit. You can only save a few wallets here.</div>
        </div>
    </div>
</div>

<script>
    const BIP39_URL = "https://raw.githubusercontent.com/bitcoin/bips/master/bip-0039/english.txt";
    const COOKIE_NAME = "haiku_vault";

    // Words that make a haiku line end awkwardly (Basic Grammar Heuristic)
    const BAD_ENDINGS = new Set(["the", "a", "an", "and", "or", "but", "if", "of", "with", "at", "by", "for", "to", "from", "in", "on", "as", "is", "are"]);

    let wordlist = [];
    let savedWallets = [];
    let masterPassword = "";

    let currentHaikuLines = [];
    let currentSeedPhrase = "";

    // --- Core Cryptography (AES-256-GCM) ---

    async function deriveKey(password, salt) {
        const enc = new TextEncoder();
        const keyMaterial = await window.crypto.subtle.importKey(
            "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveBits", "deriveKey"]
        );
        return window.crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
            keyMaterial,
            { name: "AES-GCM", length: 256 },
            false,
            ["encrypt", "decrypt"]
        );
    }

    async function encryptData(plaintext) {
        const enc = new TextEncoder();
        const salt = window.crypto.getRandomValues(new Uint8Array(16));
        const iv = window.crypto.getRandomValues(new Uint8Array(12));
        const key = await deriveKey(masterPassword, salt);

        const ciphertext = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, enc.encode(plaintext));

        return JSON.stringify({
            s: btoa(String.fromCharCode(...salt)),
            i: btoa(String.fromCharCode(...iv)),
            c: btoa(String.fromCharCode(...new Uint8Array(ciphertext)))
        });
    }

    async function decryptData(encryptedJsonStr) {
        try {
            const data = JSON.parse(encryptedJsonStr);
            const salt = new Uint8Array(atob(data.s).split('').map(c => c.charCodeAt(0)));
            const iv = new Uint8Array(atob(data.i).split('').map(c => c.charCodeAt(0)));
            const ciphertext = new Uint8Array(atob(data.c).split('').map(c => c.charCodeAt(0)));

            const key = await deriveKey(masterPassword, salt);
            const decrypted = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ciphertext);
            return new TextDecoder().decode(decrypted);
        } catch (e) {
            throw new Error("Invalid password or corrupted data.");
        }
    }

    // --- Cookie Management ---

    function setCookie(value) {
        // Expiry set to 365 days
        const d = new Date();
        d.setTime(d.getTime() + (365*24*60*60*1000));
        let cookieString = `${COOKIE_NAME}=${encodeURIComponent(value)};expires=${d.toUTCString()};path=/;SameSite=Strict`;

        if(cookieString.length > 4000) {
            alert("Cookie size limit reached! Delete some wallets to save more.");
            return false;
        }
        document.cookie = cookieString;
        return true;
    }

    function getCookie() {
        const name = COOKIE_NAME + "=";
        const decodedCookie = decodeURIComponent(document.cookie);
        const ca = decodedCookie.split(';');
        for(let i = 0; i < ca.length; i++) {
            let c = ca[i].trim();
            if (c.indexOf(name) === 0) return c.substring(name.length, c.length);
        }
        return "";
    }

    // --- App Initialization ---

    async function initializeStorage() {
        const pass = document.getElementById('masterPass').value;
        if (!pass) return alert("Password required.");
        masterPassword = pass;

        document.getElementById('authSection').style.display = 'none';
        document.getElementById('appState').style.display = 'block';

        const storedCookie = getCookie();
        if (storedCookie) {
            try {
                const decryptedStr = await decryptData(storedCookie);
                savedWallets = JSON.parse(decryptedStr);
                renderSavedList();
            } catch (e) {
                alert("Decryption failed. Incorrect password or no previous data.");
                savedWallets = [];
            }
        }
    }

    // --- Haiku & Grammatical Mining ---

    function countSyllables(word) {
        word = word.toLowerCase();
        if (word.length <= 3) return 1;
        word = word.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/i, '');
        word = word.replace(/^y/i, '');
        const matches = word.match(/[aeiouy]{1,2}/gi);
        return matches ? Math.max(1, matches.length) : 1;
    }

    function passesGrammarHeuristic(lines) {
        // Reject the haiku if any line ends with a bad word
        for (let line of lines) {
            const words = line.split(" ");
            const lastWord = words[words.length - 1];
            if (BAD_ENDINGS.has(lastWord)) return false;
        }
        return true;
    }

    function checkHaikuStructure(words) {
        const syllables = words.map(countSyllables);
        if (syllables.reduce((a, b) => a + b, 0) !== 17) return false;

        for (let i = 1; i < words.length - 1; i++) {
            if (syllables.slice(0, i).reduce((a, b) => a + b, 0) === 5) {
                for (let j = i + 1; j < words.length; j++) {
                    if (syllables.slice(i, j).reduce((a, b) => a + b, 0) === 7 && 
                        syllables.slice(j).reduce((a, b) => a + b, 0) === 5) {

                        const lines = [
                            words.slice(0, i).join(' '),
                            words.slice(i, j).join(' '),
                            words.slice(j).join(' ')
                        ];

                        // Apply grammar check
                        if(passesGrammarHeuristic(lines)) return lines;
                        return false;
                    }
                }
            }
        }
        return false;
    }

    function bufferToBinString(buffer) {
        return Array.from(buffer).map(b => b.toString(2).padStart(8, '0')).join('');
    }

    async function mineHaikuWallet() {
        const btn = document.getElementById('generateBtn');
        const skipBtn = document.getElementById('skipBtn');
        const statusEl = document.getElementById('status');
        const haikuEl = document.getElementById('haiku');
        const seedBox = document.getElementById('seedBox');

        btn.disabled = true;
        skipBtn.disabled = true;
        haikuEl.innerText = "";
        seedBox.style.display = "none";

        if (wordlist.length === 0) {
            statusEl.innerText = "Fetching wordlist...";
            const response = await fetch(BIP39_URL);
            wordlist = (await response.text()).split('\n').filter(w => w.trim().length > 0);
        }

        statusEl.innerText = "Mining structurally sound haiku... (May take a few seconds due to grammar filter)";

        let attempts = 0;
        let haiku = false;
        let finalWords = [];

        while (!haiku) {
            attempts++;
            if (attempts % 200 === 0) {
                statusEl.innerText = `Mining... (Attempt ${attempts})`;
                await new Promise(r => setTimeout(r, 0));
            }

            const entropy = new Uint8Array(16);
            window.crypto.getRandomValues(entropy);
            const entropyBits = bufferToBinString(entropy);

            const hashBuffer = await window.crypto.subtle.digest('SHA-256', entropy);
            const hashArray = new Uint8Array(hashBuffer);
            const checksumBits = hashArray[0].toString(2).padStart(8, '0').substring(0, 4);

            const words = [];
            const fullBits = entropyBits + checksumBits;
            for (let i = 0; i < 132; i += 11) {
                words.push(wordlist[parseInt(fullBits.substring(i, i + 11), 2)]);
            }

            haiku = checkHaikuStructure(words);
            if (haiku) finalWords = words;
        }

        currentHaikuLines = haiku;
        currentSeedPhrase = finalWords.join(' ');

        statusEl.innerText = `Success in ${attempts} attempts!`;
        haikuEl.innerText = haiku.join('\n');
        document.getElementById('seed').innerText = currentSeedPhrase;

        seedBox.style.display = "block";
        document.getElementById('saveBtn').style.display = "inline-block";
        btn.disabled = false;

        skipBtn.style.display = "inline-block";
        skipBtn.disabled = false;
    }

    // --- List & Export Logic ---

    async function saveCurrentWallet() {
        if (!currentSeedPhrase) return;

        savedWallets.push({ 
            haiku: currentHaikuLines.join('\n'), 
            seed: currentSeedPhrase, 
            date: new Date().toISOString() 
        });

        // Encrypt array and save to cookie
        const encryptedPayload = await encryptData(JSON.stringify(savedWallets));
        const success = setCookie(encryptedPayload);

        if (success) {
            document.getElementById('saveBtn').style.display = "none";
            renderSavedList();
        } else {
            // Revert push if cookie failed
            savedWallets.pop();
        }
    }

    async function deleteWallet(index) {
        if (confirm("Are you sure you want to delete this wallet?")) {
            savedWallets.splice(index, 1);

            // Re-encrypt and update cookie
            if (savedWallets.length === 0) {
                document.cookie = `${COOKIE_NAME}=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/;`;
            } else {
                const encryptedPayload = await encryptData(JSON.stringify(savedWallets));
                setCookie(encryptedPayload);
            }
            renderSavedList();
        }
    }

    function renderSavedList() {
        const section = document.getElementById('savedSection');
        const listDiv = document.getElementById('savedList');

        if (savedWallets.length === 0) {
            section.style.display = 'none';
            return;
        }

        section.style.display = 'block';
        listDiv.innerHTML = ''; 

        savedWallets.forEach((wallet, index) => {
            const item = document.createElement('div');
            item.className = 'saved-item';
            item.innerHTML = `
                <div class="saved-content">
                    <pre>${wallet.haiku}</pre>
                    <code>${wallet.seed}</code>
                </div>
                <button class="danger-btn" onclick="deleteWallet(${index})">Delete</button>
            `;
            listDiv.appendChild(item);
        });
    }

    async function exportEncryptedTXT() {
        if (savedWallets.length === 0) return;

        let rawContent = "=== ENCRYPTED BIP-39 HAIKU WALLETS ===\n\n";
        savedWallets.forEach((w, i) => {
            rawContent += `--- Wallet #${i + 1} ---\n${w.haiku}\n\nSeed: ${w.seed}\nGenerated: ${w.date}\n\n`;
        });

        try {
            // Re-encrypt explicitly for the text file
            const encryptedPayload = await encryptData(rawContent);
            const blob = new Blob([encryptedPayload], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");

            link.href = url;
            link.download = "haiku_wallets_cookie_backup.enc";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            alert("Export successful. Ensure you remember your Master Password to decrypt this file.");
        } catch (e) {
            alert("Encryption failed during export.");
        }
    }
</script>

</body>
</html>
