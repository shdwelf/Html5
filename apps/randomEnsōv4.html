<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIP-39 Haiku Wallet & Ensō Forge</title>
    <style>
        :root {
            --cyan: #00bcd4;
            --dark: #121212;
            --panel: #1e1e1e;
            --text: #e0e0e0;
            --accent: #ff4081;
        }
        body {
            background-color: var(--dark);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: var(--cyan); text-align: center; font-size: 1.5rem; }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
        }
        .panel {
            background: var(--panel);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
            flex: 1;
            min-width: 300px;
        }
        canvas {
            background: #e0f7fa; /* Paper Hue: Cyan base */
            border-radius: 4px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1/1;
            display: block;
            margin: 0 auto;
            transition: filter 0.3s;
        }
        .forging canvas {
            animation: pulseForge 1.5s infinite alternate;
        }
        @keyframes pulseForge {
            0% { filter: drop-shadow(0 0 10px var(--accent)) sepia(0.5); }
            100% { filter: drop-shadow(0 0 30px var(--cyan)) sepia(0); }
        }
        .haiku-display {
            background: #000;
            padding: 20px;
            border-left: 4px solid var(--cyan);
            margin: 15px 0;
            font-size: 1.2rem;
            line-height: 1.8;
            text-align: center;
            letter-spacing: 1px;
            min-height: 120px;
        }
        .controls, .storage-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            background: var(--cyan);
            color: #000;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
            font-family: inherit;
        }
        button:hover { background: #0097a7; }
        button.danger { background: var(--accent); color: white; }
        button.danger:hover { background: #c2185b; }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            font-size: 0.85rem;
            color: #aaa;
        }
        input[type="password"] {
            padding: 8px;
            background: #000;
            color: var(--cyan);
            border: 1px solid #333;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        #walletList {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            background: #000;
            padding: 10px;
        }
        .saved-item {
            border-bottom: 1px solid #333;
            padding: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <h1>BIP-39 Haiku Wallet & Ensō Forge</h1>
    
    <div class="container">
        <!-- Visual & Generation Panel -->
        <div class="panel" id="artPanel">
            <canvas id="ensoCanvas" width="400" height="400"></canvas>
            <div class="haiku-display" id="haikuOut">
                Awaiting Forge...<br>Click to Mine
            </div>
            
            <div class="info-grid">
                <div><strong>Ensōgen ID:</strong> <span id="outId">-</span></div>
                <div><strong>Checksum:</strong> <span id="outCheck">-</span></div>
                <div><strong>Path:</strong> m/44'/0'/0'/0/0 (BIP44)</div>
                <div><strong>Format:</strong> 12-Word (128-bit)</div>
            </div>

            <div class="controls">
                <button onclick="mineWallet()">Mine Haiku Wallet (5-7-5)</button>
                <button onclick="downloadPNG()">Download Ensō PNG</button>
            </div>
            <p style="font-size: 0.75rem; color: #777;">Mining ensures exact 5-7-5 syllables with a valid BIP39 SHA-256 Checksum.</p>
        </div>

        <!-- Storage & Encryption Panel -->
        <div class="panel">
            <h3>Encrypted Local Storage (AES-256)</h3>
            <label>Master Password (Required for Save/Load/Export):</label>
            <input type="password" id="encPassword" placeholder="Enter strong password...">
            
            <div class="storage-controls">
                <button onclick="saveCurrentWallet()">Save to Local List</button>
                <button onclick="loadWallets()">Load / Decrypt List</button>
                <button onclick="exportTXT()">Export as Encrypted TXT</button>
                <button class="danger" onclick="clearAllWallets()">Delete All</button>
            </div>

            <div id="walletList">
                <div style="color: #666; font-size: 0.9rem;">Load list to view saved wallets...</div>
            </div>
        </div>
    </div>

<script>
/* ==========================================================================

   ========================================================================== */
// Standard BIP39 2048 English Wordlist compressed as a space-separated string
const BIP39_WORDS_STR = "abandon ability able about above absent absorb abstract absurd abuse access accident account accuse
