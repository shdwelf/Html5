<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIP-39 Wallet Haiku Generator</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        button {
            background-color: #f7931a; /* Bitcoin Orange */
            color: #fff;
            border: none;
            padding: 12px 24px;
            margin: 5px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #e08316;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        .secondary-btn {
            background-color: #3b82f6;
        }
        .secondary-btn:hover {
            background-color: #2563eb;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
        }
        #haiku {
            font-family: "Georgia", serif;
            font-size: 1.5em;
            font-style: italic;
            margin: 30px 0;
            line-height: 1.6;
            white-space: pre-wrap;
            color: #fff;
        }
        #seedBox {
            background: #000;
            padding: 15px;
            border-radius: 6px;
            display: none;
            margin-bottom: 20px;
        }
        #seed {
            font-family: monospace;
            color: #4ade80;
            word-wrap: break-word;
        }
        .saved-section {
            margin-top: 40px;
            border-top: 1px solid #333;
            padding-top: 20px;
            text-align: left;
            display: none;
        }
        .saved-item {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .saved-item pre {
            font-family: "Georgia", serif;
            font-style: italic;
            margin: 0 0 10px 0;
            font-size: 1.1em;
        }
        .saved-item code {
            color: #4ade80;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Secure BIP-39 Haiku Miner</h2>
    <p>Mines valid, checksummed 12-word Bitcoin wallets until it finds a 5-7-5 haiku.</p>

    <button id="generateBtn" onclick="mineHaikuWallet()">Mine Wallet Haiku</button>
    <div id="status">Ready.</div>

    <div id="haiku"></div>

    <div id="seedBox">
        <div style="font-size: 12px; color: #888; margin-bottom: 8px;">FULL SEED PHRASE:</div>
        <div id="seed"></div>
        <button id="saveBtn" class="secondary-btn" style="margin-top: 15px;" onclick="saveCurrentWallet()">Save to List</button>
    </div>

    <div id="savedSection" class="saved-section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="margin: 0;">Saved Wallets</h3>
            <button class="secondary-btn" onclick="exportToTXT()" style="background-color: #10b981; padding: 8px 16px; font-size: 14px;">Export as TXT</button>
        </div>
        <div id="savedList"></div>
    </div>
</div>

<script>
    const BIP39_URL = "https://raw.githubusercontent.com/bitcoin/bips/master/bip-0039/english.txt";
    let wordlist = [];

    // State variables for saving/exporting
    let currentHaikuLines = [];
    let currentSeedPhrase = "";
    let savedWallets = [];

    // Syllable counter
    function countSyllables(word) {
        word = word.toLowerCase();
        if (word.length <= 3) return 1;
        word = word.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/i, '');
        word = word.replace(/^y/i, '');
        const matches = word.match(/[aeiouy]{1,2}/gi);
        return matches ? Math.max(1, matches.length) : 1;
    }

    // Haiku structure checker
    function checkHaikuStructure(words) {
        const syllables = words.map(countSyllables);
        const total = syllables.reduce((a, b) => a + b, 0);
        if (total !== 17) return false;

        for (let i = 1; i < words.length - 1; i++) {
            let sum1 = syllables.slice(0, i).reduce((a, b) => a + b, 0);
            if (sum1 === 5) {
                for (let j = i + 1; j < words.length; j++) {
                    let sum2 = syllables.slice(i, j).reduce((a, b) => a + b, 0);
                    let sum3 = syllables.slice(j).reduce((a, b) => a + b, 0);
                    if (sum2 === 7 && sum3 === 5) {
                        return [
                            words.slice(0, i).join(' '),
                            words.slice(i, j).join(' '),
                            words.slice(j).join(' ')
                        ];
                    }
                }
            }
        }
        return false;
    }

    function bufferToBinString(buffer) {
        return Array.from(buffer).map(b => b.toString(2).padStart(8, '0')).join('');
    }

    async function mineHaikuWallet() {
        const btn = document.getElementById('generateBtn');
        const statusEl = document.getElementById('status');
        const haikuEl = document.getElementById('haiku');
        const seedBox = document.getElementById('seedBox');

        btn.disabled = true;
        haikuEl.innerText = "";
        seedBox.style.display = "none";
        document.getElementById('saveBtn').style.display = "none";

        if (wordlist.length === 0) {
            statusEl.innerText = "Fetching official BIP-39 wordlist...";
            try {
                const response = await fetch(BIP39_URL);
                const text = await response.text();
                wordlist = text.split('\n').filter(w => w.trim().length > 0);
            } catch (e) {
                statusEl.innerText = "Error fetching wordlist. Please check your internet connection.";
                btn.disabled = false;
                return;
            }
        }

        statusEl.innerText = "Mining... (This usually takes a fraction of a second)";

        let attempts = 0;
        let haiku = false;
        let finalWords = [];

        while (!haiku) {
            attempts++;
            if (attempts % 100 === 0) {
                statusEl.innerText = `Mining... (Attempt ${attempts})`;
                await new Promise(r => setTimeout(r, 0));
            }

            const entropy = new Uint8Array(16);
            window.crypto.getRandomValues(entropy);
            const entropyBits = bufferToBinString(entropy);

            const hashBuffer = await window.crypto.subtle.digest('SHA-256', entropy);
            const hashArray = new Uint8Array(hashBuffer);
            const checksumBits = hashArray[0].toString(2).padStart(8, '0').substring(0, 4);

            const fullBits = entropyBits + checksumBits;

            const words = [];
            for (let i = 0; i < 132; i += 11) {
                const chunk = fullBits.substring(i, i + 11);
                words.push(wordlist[parseInt(chunk, 2)]);
            }

            haiku = checkHaikuStructure(words);
            if (haiku) {
                finalWords = words;
                break;
            }
        }

        // Store currently generated data in state
        currentHaikuLines = haiku;
        currentSeedPhrase = finalWords.join(' ');

        // Update UI
        statusEl.innerText = `Success! Mined a valid haiku wallet in ${attempts} attempts.`;
        haikuEl.innerText = haiku.join('\n');
        document.getElementById('seed').innerText = currentSeedPhrase;
        seedBox.style.display = "block";
        document.getElementById('saveBtn').style.display = "inline-block";
        btn.disabled = false;
    }

    // --- NEW: Save and Export Logic ---

    function saveCurrentWallet() {
        if (!currentSeedPhrase) return;

        // Add to saved list array
        savedWallets.push({
            haiku: currentHaikuLines.join('\n'),
            seed: currentSeedPhrase
        });

        // Hide save button for this specific wallet so it isn't saved twice
        document.getElementById('saveBtn').style.display = "none";

        renderSavedList();
    }

    function renderSavedList() {
        const section = document.getElementById('savedSection');
        const listDiv = document.getElementById('savedList');

        if (savedWallets.length === 0) {
            section.style.display = 'none';
            return;
        }

        section.style.display = 'block';
        listDiv.innerHTML = ''; // Clear current UI list

        savedWallets.forEach((wallet, index) => {
            const item = document.createElement('div');
            item.className = 'saved-item';
            item.innerHTML = `
                <div style="color: #888; font-size: 12px; margin-bottom: 5px;">WALLET #${index + 1}</div>
                <pre>${wallet.haiku}</pre>
                <code>${wallet.seed}</code>
            `;
            listDiv.appendChild(item);
        });
    }

    function exportToTXT() {
        if (savedWallets.length === 0) return;

        // Construct the text file content
        let fileContent = "=== BIP-39 HAIKU WALLETS ===\n";
        fileContent += "WARNING: Never share this file. Anyone with these seeds controls the funds.\n\n";

        savedWallets.forEach((wallet, index) => {
            fileContent += `--- Wallet #${index + 1} ---\n`;
            fileContent += `${wallet.haiku}\n\n`;
            fileContent += `Seed: ${wallet.seed}\n`;
            fileContent += `\n`;
        });

        // Create a Blob containing the text data
        const blob = new Blob([fileContent], { type: "text/plain;charset=utf-8" });

        // Create a temporary link element to trigger the download
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "haiku_wallets.txt";

        // Append link, click it, and remove it
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        // Free up memory
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
