<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AES-256 BIP-39 Haiku Generator</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        button {
            background-color: #f7931a; 
            color: #fff;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #e08316; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .secondary-btn { background-color: #3b82f6; }
        .secondary-btn:hover { background-color: #2563eb; }
        .danger-btn { background-color: #ef4444; }
        .danger-btn:hover { background-color: #dc2626; }
        .success-btn { background-color: #10b981; }
        .success-btn:hover { background-color: #059669; }

        #status { margin-top: 15px; font-size: 14px; color: #aaa; }
        #haiku {
            font-family: "Georgia", serif;
            font-size: 1.5em;
            font-style: italic;
            margin: 30px 0;
            line-height: 1.6;
            white-space: pre-wrap;
            color: #fff;
        }
        #seedBox {
            background: #000;
            padding: 15px;
            border-radius: 6px;
            display: none;
            margin-bottom: 20px;
        }
        #seed {
            font-family: monospace;
            color: #4ade80;
            word-wrap: break-word;
        }
        .saved-section {
            margin-top: 40px;
            border-top: 1px solid #333;
            padding-top: 20px;
            text-align: left;
            display: none;
        }
        .saved-item {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .saved-content pre {
            font-family: "Georgia", serif;
            font-style: italic;
            margin: 0 0 10px 0;
            font-size: 1.1em;
        }
        .saved-content code { color: #4ade80; font-size: 0.9em; }
        .password-prompt {
            background: #2d3748;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            display: none;
        }
        .password-prompt input {
            padding: 8px;
            width: 80%;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #4a5568;
            background: #1a202c;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>AES-256 Haiku Miner</h2>
    <p>Mines valid, checksummed 12-word Bitcoin wallets until it finds a 5-7-5 haiku. Saves locally, exports securely.</p>

    <button id="generateBtn" onclick="mineHaikuWallet()">Mine Wallet Haiku</button>
    <div id="status">Ready.</div>

    <div id="haiku"></div>

    <div id="seedBox">
        <div style="font-size: 12px; color: #888; margin-bottom: 8px;">FULL SEED PHRASE:</div>
        <div id="seed"></div>
        <button id="saveBtn" class="secondary-btn" style="margin-top: 15px;" onclick="saveCurrentWallet()">Save to Local List</button>
    </div>

    <div id="savedSection" class="saved-section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="margin: 0;">Local Saved Wallets</h3>
            <button class="success-btn" onclick="showPasswordPrompt()">Export AES-256 Encrypted</button>
        </div>

        <div id="passwordPrompt" class="password-prompt text-center">
            <input type="password" id="exportPassword" placeholder="Enter a strong password to encrypt the file" />
            <br>
            <button class="success-btn" onclick="executeExport()">Encrypt & Download</button>
            <button class="secondary-btn" onclick="document.getElementById('passwordPrompt').style.display='none'">Cancel</button>
        </div>

        <div id="savedList"></div>
    </div>
</div>

<script>
    const BIP39_URL = "https://raw.githubusercontent.com/bitcoin/bips/master/bip-0039/english.txt";
    const STORAGE_KEY = "haiku_wallets_persistent";

    let wordlist = [];
    let currentHaikuLines = [];
    let currentSeedPhrase = "";
    let savedWallets = [];

    // Load persisted data on startup
    window.onload = () => {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            try {
                savedWallets = JSON.parse(stored);
                renderSavedList();
            } catch (e) {
                console.error("Failed to load local storage data", e);
            }
        }
    };

    // --- Haiku Mining Logic ---
    function countSyllables(word) {
        word = word.toLowerCase();
        if (word.length <= 3) return 1;
        word = word.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/i, '');
        word = word.replace(/^y/i, '');
        const matches = word.match(/[aeiouy]{1,2}/gi);
        return matches ? Math.max(1, matches.length) : 1;
    }

    function checkHaikuStructure(words) {
        const syllables = words.map(countSyllables);
        if (syllables.reduce((a, b) => a + b, 0) !== 17) return false;

        for (let i = 1; i < words.length - 1; i++) {
            if (syllables.slice(0, i).reduce((a, b) => a + b, 0) === 5) {
                for (let j = i + 1; j < words.length; j++) {
                    if (syllables.slice(i, j).reduce((a, b) => a + b, 0) === 7 && 
                        syllables.slice(j).reduce((a, b) => a + b, 0) === 5) {
                        return [
                            words.slice(0, i).join(' '),
                            words.slice(i, j).join(' '),
                            words.slice(j).join(' ')
                        ];
                    }
                }
            }
        }
        return false;
    }

    function bufferToBinString(buffer) {
        return Array.from(buffer).map(b => b.toString(2).padStart(8, '0')).join('');
    }

    async function mineHaikuWallet() {
        const btn = document.getElementById('generateBtn');
        const statusEl = document.getElementById('status');
        const haikuEl = document.getElementById('haiku');
        const seedBox = document.getElementById('seedBox');

        btn.disabled = true;
        haikuEl.innerText = "";
        seedBox.style.display = "none";
        document.getElementById('saveBtn').style.display = "none";

        if (wordlist.length === 0) {
            statusEl.innerText = "Fetching wordlist...";
            try {
                const response = await fetch(BIP39_URL);
                wordlist = (await response.text()).split('\n').filter(w => w.trim().length > 0);
            } catch (e) {
                statusEl.innerText = "Error fetching wordlist.";
                btn.disabled = false;
                return;
            }
        }

        statusEl.innerText = "Mining... (Usually takes <1 second)";

        let attempts = 0;
        let haiku = false;
        let finalWords = [];

        while (!haiku) {
            attempts++;
            if (attempts % 100 === 0) {
                statusEl.innerText = `Mining... (Attempt ${attempts})`;
                await new Promise(r => setTimeout(r, 0));
            }

            const entropy = new Uint8Array(16);
            window.crypto.getRandomValues(entropy);
            const entropyBits = bufferToBinString(entropy);

            const hashBuffer = await window.crypto.subtle.digest('SHA-256', entropy);
            const hashArray = new Uint8Array(hashBuffer);
            const checksumBits = hashArray[0].toString(2).padStart(8, '0').substring(0, 4);

            const fullBits = entropyBits + checksumBits;
            const words = [];
            for (let i = 0; i < 132; i += 11) {
                words.push(wordlist[parseInt(fullBits.substring(i, i + 11), 2)]);
            }

            haiku = checkHaikuStructure(words);
            if (haiku) finalWords = words;
        }

        currentHaikuLines = haiku;
        currentSeedPhrase = finalWords.join(' ');

        statusEl.innerText = `Success in ${attempts} attempts.`;
        haikuEl.innerText = haiku.join('\n');
        document.getElementById('seed').innerText = currentSeedPhrase;
        seedBox.style.display = "block";
        document.getElementById('saveBtn').style.display = "inline-block";
        btn.disabled = false;
    }

    // --- List Management & Persistence ---
    function saveCurrentWallet() {
        if (!currentSeedPhrase) return;
        savedWallets.push({ haiku: currentHaikuLines.join('\n'), seed: currentSeedPhrase, date: new Date().toISOString() });
        persistData();
        document.getElementById('saveBtn').style.display = "none";
        renderSavedList();
    }

    function deleteWallet(index) {
        if (confirm("Are you sure you want to delete this wallet?")) {
            savedWallets.splice(index, 1);
            persistData();
            renderSavedList();
        }
    }

    function persistData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(savedWallets));
    }

    function renderSavedList() {
        const section = document.getElementById('savedSection');
        const listDiv = document.getElementById('savedList');

        if (savedWallets.length === 0) {
            section.style.display = 'none';
            return;
        }

        section.style.display = 'block';
        listDiv.innerHTML = ''; 

        savedWallets.forEach((wallet, index) => {
            const item = document.createElement('div');
            item.className = 'saved-item';
            item.innerHTML = `
                <div class="saved-content">
                    <div style="color: #888; font-size: 12px; margin-bottom: 5px;">WALLET #${index + 1}</div>
                    <pre>${wallet.haiku}</pre>
                    <code>${wallet.seed}</code>
                </div>
                <button class="danger-btn" onclick="deleteWallet(${index})">X</button>
            `;
            listDiv.appendChild(item);
        });
    }

    // --- AES-256 GCM Encryption ---
    function showPasswordPrompt() {
        document.getElementById('passwordPrompt').style.display = 'block';
        document.getElementById('exportPassword').value = '';
        document.getElementById('exportPassword').focus();
    }

    async function getPasswordKey(password) {
        const enc = new TextEncoder();
        const keyMaterial = await window.crypto.subtle.importKey(
            "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveBits", "deriveKey"]
        );
        return keyMaterial;
    }

    async function deriveAesKey(passwordKey, salt) {
        return window.crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
            passwordKey,
            { name: "AES-GCM", length: 256 },
            false,
            ["encrypt", "decrypt"]
        );
    }

    async function encryptData(plaintext, password) {
        const enc = new TextEncoder();
        const encoded = enc.encode(plaintext);

        const salt = window.crypto.getRandomValues(new Uint8Array(16));
        const iv = window.crypto.getRandomValues(new Uint8Array(12));

        const passwordKey = await getPasswordKey(password);
        const aesKey = await deriveAesKey(passwordKey, salt);

        const encryptedContent = await window.crypto.subtle.encrypt(
            { name: "AES-GCM", iv: iv }, aesKey, encoded
        );

        // Package salt, iv, and ciphertext to allow for future decryption
        const encryptedArray = new Uint8Array(encryptedContent);

        // Convert to Base64 for easy text file storage
        function toBase64(arr) { return btoa(String.fromCharCode.apply(null, arr)); }

        return JSON.stringify({
            cipher: "AES-256-GCM",
            kdf: "PBKDF2-SHA256-100k",
            salt: toBase64(salt),
            iv: toBase64(iv),
            ciphertext: toBase64(encryptedArray)
        }, null, 2);
    }

    async function executeExport() {
        if (savedWallets.length === 0) return;
        const password = document.getElementById('exportPassword').value;
        if (!password) { alert("Password cannot be empty."); return; }

        let rawContent = "=== UNENCRYPTED HAUKU WALLETS ===\n\n";
        savedWallets.forEach((w, i) => {
            rawContent += `--- Wallet #${i + 1} ---\n${w.haiku}\n\nSeed: ${w.seed}\nGenerated: ${w.date}\n\n`;
        });

        try {
            const encryptedPayload = await encryptData(rawContent, password);

            const blob = new Blob([encryptedPayload], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");

            link.href = url;
            link.download = "secure_haiku_wallets.enc.json";

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            document.getElementById('passwordPrompt').style.display = 'none';
            alert("Export successful. Ensure you remember your password, or this file is lost forever.");
        } catch (e) {
            console.error(e);
            alert("Encryption failed.");
        }
    }
</script>

</body>
</html>
