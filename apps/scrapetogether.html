<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Standalone Web Scraper</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        .card {
            background-color: #313244;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { margin-top: 0; color: #89b4fa; }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="url"] {
            flex: 1;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #45475a;
            background: #181825;
            color: #cdd6f4;
            font-size: 16px;
        }
        button {
            padding: 12px 24px;
            background-color: #a6e3a1;
            color: #11111b;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.8; }
        button:disabled { background-color: #585b70; cursor: not-allowed; }
        .checkbox-group {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        textarea {
            width: 100%;
            height: 300px;
            background: #181825;
            color: #a6e3a1;
            border: 1px solid #45475a;
            border-radius: 4px;
            padding: 15px;
            font-family: monospace;
            box-sizing: border-box;
            resize: vertical;
            display: none;
        }
        .actions {
            margin-top: 15px;
            display: none;
            gap: 10px;
        }
        #status {
            margin-top: 10px;
            font-size: 14px;
            color: #f38ba8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🌐 Client-Side Page Scraper</h2>

        <div class="input-group">
            <input type="url" id="targetUrl" placeholder="https://example.com" required>
            <button id="scrapeBtn" onclick="scrapeWebsite()">Scrape Target</button>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="extractJsCheck">
            <label for="extractJsCheck">Isolate and Extract JavaScript Only</label>
        </div>

        <div id="status"></div>

        <textarea id="outputArea" readonly placeholder="Scraped code will appear here..."></textarea>

        <div class="actions" id="actionButtons">
            <button onclick="downloadCode('html')" style="background-color: #89b4fa;">Download HTML File</button>
            <button onclick="downloadCode('js')" style="background-color: #f9e2af; color: #11111b;" id="downloadJsBtn">Download JS File</button>
        </div>
    </div>

    <script>
        let scrapedHTML = "";
        let extractedJS = "";

        async function scrapeWebsite() {
            const urlInput = document.getElementById('targetUrl').value.trim();
            const statusBox = document.getElementById('status');
            const scrapeBtn = document.getElementById('scrapeBtn');
            const outputArea = document.getElementById('outputArea');
            const actionButtons = document.getElementById('actionButtons');
            const isExtractJs = document.getElementById('extractJsCheck').checked;

            if (!urlInput) {
                statusBox.innerText = "Please enter a valid URL.";
                return;
            }

            try {
                // UI Loading State
                scrapeBtn.disabled = true;
                scrapeBtn.innerText = "Scraping...";
                statusBox.innerText = "Fetching via CORS proxy (this may take a moment)...";
                statusBox.style.color = "#89b4fa";
                outputArea.style.display = "none";
                actionButtons.style.display = "none";

                // Using AllOrigins proxy to bypass browser CORS restrictions
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(urlInput)}`;
                const response = await fetch(proxyUrl);

                if (!response.ok) throw new Error("Network response was not ok.");

                const data = await response.json();

                if (data.contents === null) {
                    throw new Error("Proxy failed to retrieve the page. The site might be blocking bots.");
                }

                // Parse the string into a real HTML Document
                const parser = new DOMParser();
                const doc = parser.parseFromString(data.contents, "text/html");

                // Fix relative URLs so the standalone file doesn't break
                const base = new URL(urlInput);
                doc.querySelectorAll('img, script').forEach(el => {
                    if (el.src && el.src.startsWith('/')) el.src = base.origin + el.getAttribute('src');
                });
                doc.querySelectorAll('link, a').forEach(el => {
                    if (el.href && el.href.startsWith('/')) el.href = base.origin + el.getAttribute('href');
                });

                // Extract JavaScript
                const scripts = doc.querySelectorAll('script');
                extractedJS = `// Extracted Javascript from ${urlInput}\n\n`;
                scripts.forEach((script, index) => {
                    if (script.src) {
                        extractedJS += `// External Script [${index + 1}]: ${script.src}\n`;
                    } else if (script.innerText) {
                        extractedJS += `// Inline Script [${index + 1}]\n${script.innerText}\n\n`;
                    }
                });

                scrapedHTML = doc.documentElement.outerHTML;

                // Update UI based on checkbox
                outputArea.style.display = "block";
                actionButtons.style.display = "flex";

                if (isExtractJs) {
                    outputArea.value = extractedJS;
                    document.getElementById('downloadJsBtn').style.display = "block";
                } else {
                    outputArea.value = scrapedHTML;
                    document.getElementById('downloadJsBtn').style.display = "none";
                }

                statusBox.innerText = "Scraping successful!";
                statusBox.style.color = "#a6e3a1";

            } catch (error) {
                statusBox.innerText = `Error: ${error.message}`;
                statusBox.style.color = "#f38ba8";
            } finally {
                scrapeBtn.disabled = false;
                scrapeBtn.innerText = "Scrape Target";
            }
        }

        function downloadCode(type) {
            const isJs = type === 'js';
            const content = isJs ? extractedJS : scrapedHTML;
            const extension = isJs ? 'js' : 'html';
            const filename = `scraped_target.${extension}`;

            const blob = new Blob([content], { type: isJs ? 'text/javascript' : 'text/html' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
