plugins { id 'com.android.application' }

android {
    namespace 'org.html5.putty'
    compileSdk 35
    defaultConfig {
        applicationId 'org.html5.putty'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0-putty0.85'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        debug {
            // Installable review artifact, not a production signing identity.
            // The package is signed with the runner's disposable debug key,
            // but Android debugging is disabled even in this review variant.
            debuggable false
        }
        release { minifyEnabled false }
    }
    packaging {
        jniLibs {
            // libplink.so is a PIE executable, not a JNI shared library.
            // It must be extracted into the package-managed executable dir.
            useLegacyPackaging true
            keepDebugSymbols += ['**/libplink.so']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true; checkReleaseBuilds true }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
