<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AES-256 Offline Decryptor</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #aaa; }
        input[type="file"] {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
            color: #fff;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #4a5568;
            background: #1a202c;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: #10b981; 
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover { background-color: #059669; }
        #output {
            margin-top: 20px;
            background: #000;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            color: #4ade80;
            white-space: pre-wrap;
            word-wrap: break-word;
            display: none;
            max-height: 500px;
            overflow-y: auto;
        }
        .error {
            color: #ef4444;
            background: #450a0a;
            padding: 10px;
            border-radius: 6px;
            margin-top: 15px;
            display: none;
            border: 1px solid #991b1b;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Secure Vault Decryptor</h2>

    <div class="form-group">
        <label for="fileInput">Select Encrypted JSON File:</label>
        <input type="file" id="fileInput" accept=".json,.enc,.txt" />
    </div>

    <div class="form-group">
        <label for="password">Decryption Password:</label>
        <input type="password" id="password" placeholder="Enter the exact password used for encryption" />
    </div>

    <button onclick="processFile()">Decrypt File</button>

    <div id="errorMsg" class="error"></div>
    <pre id="output"></pre>
</div>

<script>
    // Helper to convert Base64 string back into a Uint8Array
    function base64ToUint8Array(base64) {
        const binaryString = atob(base64);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }
        return bytes;
    }

    // Step 1: Import the raw password into a key format
    async function getPasswordKey(password) {
        const enc = new TextEncoder();
        return await window.crypto.subtle.importKey(
            "raw", 
            enc.encode(password), 
            { name: "PBKDF2" }, 
            false, 
            ["deriveKey"]
        );
    }

    // Step 2: Derive the exact AES key using the extracted Salt
    async function deriveAesKey(passwordKey, salt) {
        return await window.crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
            passwordKey,
            { name: "AES-GCM", length: 256 },
            false,
            ["decrypt"]
        );
    }

    // Main Decryption Logic
    async function processFile() {
        const fileInput = document.getElementById('fileInput');
        const password = document.getElementById('password').value;
        const output = document.getElementById('output');
        const errorMsg = document.getElementById('errorMsg');

        // Reset UI
        output.style.display = 'none';
        errorMsg.style.display = 'none';
        output.textContent = '';
        errorMsg.textContent = '';

        if (!fileInput.files.length) {
            showError("Please select a file first.");
            return;
        }
        if (!password) {
            showError("Please enter your password.");
            return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = async function(e) {
            try {
                // Parse the JSON file
                const fileContent = e.target.result;
                const encryptedObj = JSON.parse(fileContent);

                // Accommodate both standard JSON export and minified cookie export
                const b64Salt = encryptedObj.salt || encryptedObj.s;
                const b64Iv = encryptedObj.iv || encryptedObj.i;
                const b64Ciphertext = encryptedObj.ciphertext || encryptedObj.c;

                if (!b64Salt || !b64Iv || !b64Ciphertext) {
                    throw new Error("File is missing required encryption parameters (salt, iv, or ciphertext).");
                }

                const salt = base64ToUint8Array(b64Salt);
                const iv = base64ToUint8Array(b64Iv);
                const ciphertext = base64ToUint8Array(b64Ciphertext);

                // Cryptographic operations
                const passwordKey = await getPasswordKey(password);
                const aesKey = await deriveAesKey(passwordKey, salt);

                try {
                    const decryptedBuffer = await window.crypto.subtle.decrypt(
                        { name: "AES-GCM", iv: iv }, 
                        aesKey, 
                        ciphertext
                    );

                    // Decode bytes to text
                    const decryptedText = new TextDecoder().decode(decryptedBuffer);

                    // Display success
                    output.textContent = decryptedText;
                    output.style.display = 'block';

                } catch (decryptErr) {
                    showError("Decryption failed. Incorrect password or corrupted file.");
                }

            } catch (parseErr) {
                showError("Failed to parse file. Ensure it is the exact JSON file that was exported.");
                console.error(parseErr);
            }
        };

        reader.readAsText(file);
    }

    function showError(msg) {
        const errorMsg = document.getElementById('errorMsg');
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
    }
</script>

</body>
</html>
