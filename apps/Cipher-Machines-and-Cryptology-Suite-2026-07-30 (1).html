mall stick figures in dancing poses that have been appearing around his Norfolk manor. Holmes recognises them as a substitution cipher where each distinct pose represents a letter. Figures holding a small flag mark the end of a word.",cryptanalysis:"Holmes applies standard frequency analysis. He identifies the most common figure as E, then looks for short common words (THE, AND). Knowing the name ELSIE appears in the messages gives him five letters immediately. From there the remaining alphabet falls quickly. The entire attack is pure letter-frequency work on a monoalphabetic substitution — the same technique that breaks Caesar, Atbash, and any single-alphabet cipher.",significance:"Published in The Strand Magazine in December 1903 and collected in The Return of Sherlock Holmes (1905). It is the most famous fictional depiction of frequency analysis in English literature and has introduced generations of readers to the concept that pattern and repetition defeat substitution ciphers."},{id:"gold-bug",title:"The Gold-Bug",author:"Edgar Allan Poe",year:"1843",cipherType:"Monoalphabetic symbol substitution (printed symbols)",description:"William Legrand discovers a cryptogram written in invisible ink on parchment, using symbols like semicolons, daggers, and numbers to replace letters. Following the decoded instructions leads to Captain Kidd's buried treasure on Sullivan's Island near Charleston, South Carolina.",cryptanalysis:"Legrand counts symbol frequencies and matches them against English letter frequencies. The most common symbol maps to E. He then identifies common short words and digraphs. Poe provides a detailed step-by-step walkthrough of the analysis within the story itself, making it both a mystery and a cryptography tutorial.",significance:`Published in 1843, this is the first major work of popular fiction to build its plot around cryptographic technique. William Friedman credited it as the story that first sparked his interest in cryptology. Poe's famous dic n and Colin Grazier of HMS Petard (both drowned during the salvage), providing the crucial second edition of the Wetterkurzschlüssel.",'Bletchley Park’s Hut 8 matched predicted local weather readings with the WKS tables to generate daily Enigma M4 "Shark" cribs.'],significance:'The use of short, compressed tactical formats was a brilliant German technical success, demonstrating that minimizing "time-on-air" could defeat direction finding. Paradoxically, the rigid predictability of the weather reporting structures handed Bletchley Park the exact cribs needed to shatter the Naval Enigma.'},{id:"hollow-nickel",name:"The Hollow Nickel Microfilm (VIC Cipher)",location:"Brooklyn, New York / FBI HQ & CIA",era:"Cold War · 1953-1957",status:"Defected 1957; Rudolf Abel arrested",description:"In June 1953, a Brooklyn newsboy accidentally dropped a nickel which split open to reveal a tiny sheet of microfilm containing columns of numbers. The FBI spent four years unable to decrypt it—until a Soviet spy defected.",details:["The cipher was the VIC cipher, used by KGB agent Reino Häyhänen (VIKTOR) in New York.","The message began with a congratulations on a safe arrival and confirmation of letter receipts.","Considered the most complex and secure manual pencil-and-paper cipher system ever issued in the field.","Combined a dynamic straddling checkerboard with chain additions, columnar transpositions, and personal/date keys.","The FBI spent four years with the message, completely unable to make any cryptanalytic progress.","Only Häyhänen's defection in May 1957 and his disclosure of the keys enabled the decryption of the microfilm.","The decrypted message led to the arrest of KGB master spy Colonel Rudolf Abel (William Fisher)."],significance:"The Hollow Nickel Case is a legendary chapter in Cold War counterintelligence, proving that a meticulously constructed manual cipher combining fractionation and transpositions can resist state-level cryptanalytic attack indefinitely, falling only when a human link defects."},{id:"rubicon",name:"Operation RUBICON / Crypto AG",location:"Zug, Switzerland / CIA & BND",era:"Cold War · 1950s-2018",status:"Revealed in 2020 after five decades",description:"Crypto AG sold trusted encryption equipment worldwide while a secret CIA-BND ownership arrangement enabled deliberately weakened systems to be read by Western intelligence.",details:["Boris Hagelin and William Friedman maintained a 1950s gentlemen's understanding over sales to selected states","CIA and West Germany's BND jointly purchased Crypto AG on 12 June 1970","The operation was first called THESAURUS and later RUBICON; Crypto AG was codenamed MINERVA","Machines were weakened through algorithms, modifications, or insecure customer-specific operating instructions","Equipment was sold to more than 120 countries, including adversaries and some NATO partners","BND withdrew in the early 1990s; CIA continued sole ownership until the company assets were liquidated","Hans Bühler, an unaware Crypto AG salesman, was detained and interrogated in Iran for nine months in 1992","The case demonstrates that an implementation or supplier can defeat even convincing-looking cryptography"],significance:"Described in the CIA history as the intelligence coup of the century, RUBICON is also a lasting warning: security depends on trustworthy algorithms, implementations, operating procedures, vendors, and key generation—not merely on owning a device marked secure."},{id:"kryptos",name:"Kryptos",location:"CIA Headquarters, Langley, Virginia",era:"Modern · 1990",status:"K1–K3 Solved · K4 UNSOLVED after 35 years",description:"A 12-foot copper sculpture in the CIA courtyard by artist Jim Sanborn, encoded with four cryptographic puzzles totaling 865 characters.",details:["K1 — Vigenère cipher, key PALIMPSEST — solved publicly 1999 (NSA solved secretly 1992)","K2 — Vigenère cipher, key ABSCISSA — solved 1999","K3 — Transposition cipher, quotes from Howard Carter's diary at King Tut's tomb — solved 1999","K4 — Unknown system, only 97 characters — UNSOLVED as of 2026","Sanborn released four hints: BERLIN, CLOCK, NORTHEAST, EAST","Cryptographic consultant: Edward Scheidt, former CIA cryptographer","In November 2025, Sanborn auctioned the K4 solution archive for over $200,000"],significance:"One of the most famous unsolved cryptographic puzzles in the world. K4 has resisted professional cryptologists, academics, and amateurs for over three decades."},{id:"bombe",name:"Turing-Welchman Bombe",location:"Bletchley Park, UK / National Museum of Computing",era:"WWII · 1940",status:"Original destroyed 1945 · Reconstructed 2007",description:`Electromechanical device designed by Alan Turing (August 1940 prototype "Agnus") and perfected by Gordon Welchman's diagonal board, used to break Enigma-enciphered messages.`,details:['First Bombe "Victory" began operations at Bletchley Park on 14 March 1940',"211 Bombe machines were built and operated by war's end","1,676 female WRNS (Wrens) and 263 male RAF personnel operated the machines","Manufactured by the British Tabulating Machine Company (BTM)","Exploited the flaw that no Enigma letter could ever encrypt to itself","Welchman's diagonal board dramatically reduced false-positive stops","Operators worked in shifts around the clock in dark, oppressive rooms","US Navy adapted the design for four-rotor Enigma M4, operated by WAVES"],significance:"Alongside Colossus, widely regarded as having shortened WW2 and saved countless lives. Marked one of the earliest milestones on the road to modern digital computing."},{id:"sigaba",name:"SIGABA / ECM Mark II",location:"National Cryptologic Museum, Fort Meade",era:"WWII · 1940–1950s",status:"Never broken by enemy cryptanalysts",description:"The most important American rotor cipher machine of WW2, with three banks of five rotors each in a completely irregular stepping arrangement.",details:["Three rotor banks: main cipher rotors, control rotors, and index rotors","Used by U.S. forces from the 1940s onward","Never broken during its entire operational life","One SIGABA at the National Cryptologic Museum was used by President Roosevelt to communicate with Winston Churchill","Featured 15 rotors total with pseudorandom stepping controlled by the second bank","Approximately 10,000 units produced","Remained in service until the mid-1950s"],significance:"The gold standard of Allied high-level cryptographic security throughout WW2. Its unbroken status demonstrates the value of Turing/Friedman-style irregular rotor stepping."},{id:"purple",name:"PURPLE (97-shiki O-bun In-ji-ki)",location:"National Cryptologic Museum, Fort Meade (partial reproduction)",era:"WWII · 1939–1945",status:"Broken by U.S. cryptologists BEFORE Pearl Harbor",description:"Japanese diplomatic cipher machine using stepping switches (not rotors) — a design entirely different from the German Enigma.",details:["Broken by William Friedman's Signal Intelligence Service team in September 1940","Reconstruction built without ever seeing an actual PURPLE machine","Intelligence derived from PURPLE was codenamed MAGIC","Contributed to the U.S. Navy victory at the Battle of Midway","Japan continued to use PURPLE throughout the war, believing it unbreakable","Only fragments of PURPLE machines were ever recovered"],significance:"The MAGIC intelligence produced by breaking PURPLE gave the U.S. unprecedented insight into Japanese diplomatic and military intentions throughout WW2."},{id:"colossus",name:"Colossus Mark II",location:"The National Museum of Computing, Bletchley Park",era:"WWII · 1944",status:"10 units built · 8 destroyed 1945 · rebuilt 2007",description:"The world's first programmable digital electronic computer, built by Tommy Flowers to break the Lorenz SZ40/42 (Tunny) cipher used by German High Command.",details:["Mark I operational January 1944; Mark II June 1944 (five times faster)","2,500 vacuum tubes in Mark II","Read paper tape at 5,000 characters per second (max 9,700)","Used shift registers, counters, and Boolean logic","Programmable via switches and plug panels","Remained classified until the late 1970s","Rebuilt by Tony Sale and team at Bletchley Park, operational since 2007"],significance:"Beat America's ENIAC by two years but received no historical credit until declassification. Fundamentally shaped the trajectory of postwar computing."},{id:"fialka",name:"Fialka M-125",location:"Various museums including Crypto Museum, Netherlands",era:"Cold War · 1965–1990s",status:"Top secret until 1990s",description:`Soviet 10-rotor cipher machine, developed as an "improved Enigma" fixing all of Enigma's known cryptographic weaknesses.`,details:["10 rotors, each with 30 electrical contacts and mechanical stepping-control pins (vs Enigma's 3–4 rotors with 26)","Adjacent rotors stepped in opposite directions; blocking pins produced irregular movement","A 30×30 punched-card commutator replaced the plugboard and defined a full permutation rather than pair swaps",'The reflector reserved one plaintext-enable contact and routed three contacts through a directional transistor/diode "magic" circuit',"The magic circuit permitted self-encryption but made normal coding non-reciprocal, so the mode switch reversed two lines for decoding","Later PROTON adjustable rotors allowed the wiring insert to be rotated, flipped, or exchanged","Output could be printed and punched onto five-level paper tape, then read automatically by another machine","Used by all Warsaw Pact nations","Each country had its own custom rotor wiring set","Never broken during its operational period"],significance:"The Soviet answer to the KL-7. Fialka demonstrates deliberate engineering against known Enigma weaknesses: eliminate fixed-point bias, make stepping irregular, reduce operator setup errors, and treat coding and decoding as explicitly different electrical modes."},{id:"venona",name:"VENONA Project Papers",location:"National Cryptologic Museum & NSA Historical Collection",era:"Cold War · 1943–1980",status:"Declassified 1995",description:"A U.S. Army Signal Intelligence Service (later NSA) counterintelligence program to decrypt Soviet intelligence agency messages sent during WWII.",details:['Exploited Soviet reuse of One-Time Pad key material (a "two-time pad" mistake)',"Began under Gene Grabeel in February 1943","Meredith Gardner made the first substantial break in 1946","Identified Klaus Fuchs, Julius & Ethel Rosenberg, Alger Hiss, and Kim Philby as Soviet agents","Approximately 3,000 messages partially or fully decrypted","Only 1% of intercepted traffic was ever readable","Full declassification came only in 1995"],significance:"Proves that even the theoretically unbreakable One-Time Pad fails if operators reuse key material — a lesson written in the identities of the Cambridge Five and the Manhattan Project spies."},{id:"zimmermann",name:"Zimmermann Telegram",location:"National Archives, UK / U.S. National Archives",era:"WWI · January 1917",status:"Broken by British Room 40",description:"A secret diplomatic communication from the German Foreign Office proposing a military alliance with Mexico against the United States.",details:["Sent by German Foreign Secretary Arthur Zimmermann on 17 January 1917","Encrypted with German diplomatic code 0075 (later switched to 13040)","Intercepted and partially decrypted by Nigel de Grey at Room 40 (British Admiralty)",'Offered Mexico "generous financial support" and the return of Texas, New Mexico, and Arizona',"Publication in U.S. newspapers on 1 March 1917 shifted American public opinion","Direct contributor to the U.S. declaration of war on Germany on 6 April 1917"],significance:"The single most consequential cryptographic decryption in history — it directly changed the course of World War I by bringing the United States into the conflict."},{id:"code-talkers",name:"Navajo Code Talkers",location:"National Cryptologic Museum & Museum of the American Indian",era:"WWII · 1942–1945",status:"Never broken by Axis forces",description:"Marine Corps units of Navajo speakers who used their language, augmented by a specialized 400-word military vocabulary, as an unbreakable battlefield code.",details:["29 original Navajo Code Talkers recruited in May 1942 at Camp Pendleton","Ultimately over 400 Navajo Marines served in the Pacific Theater",'Custom vocabulary invented for military terms (e.g., "iron fish" = submarine)',"Deployed at Iwo Jima, Guadalcanal, Tarawa, Peleliu, and Okinawa","At Iwo Jima, six Navajo Code Talkers sent over 800 messages in 48 hours — all without error","Program remained classified until 1968","Congressional Gold Medal awarded to the original 29 in 2001"],significance:"Demonstrated that the most sophisticated cryptographic system of WW2 was not a machine, but human ingenuity — a code the Japanese never broke and could not even identify as a language."}],th=[{name:"Caesar Cipher",category:"Substitution",yearInvented:"~50 BC",inventor:"Julius Caesar",description:"Shift each letter by a fixed number of positions. Caesar himself used a shift of 3.",strength:"Trivially broken by frequency analysis or brute-force (only 25 possible shifts)."},{name:"Atbash",category:"Substitution",yearInvented:"~500 BC",inventor:"Ancient Hebrew scribes",description:"Reverse alphabet: A↔Z, B↔Y, etc. Used in Hebrew religious texts.",strength:"No key; trivially broken."},{name:"Vigenère",category:"Polyalphabetic",yearInvented:"1553",inventor:"Giovan Battista Bellaso (misattributed to Blaise de Vigenère)",description:'Repeating keyword shifts each letter differently. Called "le chiffre indéchiffrable" for 300 years.',strength:"Broken by Charles Babbage (1854) and Friedrich Kasiski (1863) using frequency analysis on the keyword length."},{name:"Playfair",category:"Digraph Substitution",yearInvented:"1854",inventor:"Charles Wheatstone (promoted by Lord Playfair)",description:"5x5 grid based on a keyword; encrypts letter pairs (digraphs) rather than single letters.",strength:"Used by British Army in WWI and WWII. Vulnerable to known-plaintext attacks; broken by hand within hours."},{name:"ADFGVX",category:"Fractionation + Transposition",yearInvented:"March 1918",inventor:"Colonel Fritz Nebel (German Army)",description:"Substitution using 6-letter alphabet ADFGVX followed by keyword-based columnar transposition.",strength:"Considered strong at the time. Broken by French cryptanalyst Georges Painvin in April 1918 through heroic manual analysis."},{name:"One-Time Pad",category:"Perfect Cipher",yearInvented:"1917 (Vernam) / formalized 1949 (Shannon)",inventor:"Gilbert Vernam & Joseph Mauborgne",description:"Truly random key, at least as long as the message, used only once and destroyed. Provably unbreakable.",strength:"Mathematically proven perfect secrecy by Claude Shannon. But requires perfect key distribution and destruction — fails catastrophically if reused (see VENONA)."},{name:"Enigma",category:"Electromechanical Rotor",yearInvented:"1918 (patent) / 1932 (military Enigma I)",inventor:"Arthur Scherbius",description:"3–4 rotors + plugboard + reflector produce 158,962,555,217,826,360,000 possible key combinations.",strength:"Broken by Marian Rejewski (1932) and industrialized by Turing/Welchman at Bletchley Park. Weak plugboard placement, no-letter-encrypts-to-self, and procedural mistakes were the key exploits."},{name:"Lorenz SZ40/42 (Tunny)",category:"Stream Cipher (teletype)",yearInvented:"1940",inventor:"C. Lorenz AG (Germany)",description:"12 pinwheels XORed with 5-bit teletype signal. Used for Hitler's highest-level communications.",strength:"Broken by John Tiltman, Bill Tutte (who reverse-engineered the machine without seeing it), and finally automated by Tommy Flowers' Colossus."},{name:"DES (Data Encryption Standard)",category:"Modern Block Cipher",yearInvented:"1975 (published 1977)",inventor:"IBM (based on Horst Feistel's Lucifer)",description:"56-bit key block cipher, first public U.S. federal encryption standard.",strength:"Broken by brute force in 1998 (EFF Deep Crack, 22 hours). Officially withdrawn 2005. Triple DES extended its life to 2023."},{name:"AES (Advanced Encryption Standard)",category:"Modern Block Cipher",yearInvented:"2001",inventor:"Vincent Rijmen & Joan Daemen (Rijndael)",description:"Successor to DES. Selected by NIST from 15 candidates. 128/192/256-bit keys, 10/12/14 rounds.",strength:"No practical attack better than brute force. AES-256 is used to protect U.S. TOP SECRET information."},{name:"RSA",category:"Public Key",yearInvented:"1977",inventor:"Rivest, Shamir, Adleman (MIT)",description:"Asymmetric cipher based on the difficulty of factoring large prime products.",strength:"Secure with sufficient key size (2048+ bits). Threatened by future quantum computers running Shor's algorithm."},{name:"ChaCha20",category:"Modern Stream Cipher",yearInvented:"2008",inventor:"Daniel J. Bernstein",description:"256-bit key stream cipher, chosen by Google to replace RC4 in TLS.",strength:"No known practical attacks. Faster than AES on devices without hardware acceleration."}],Yv=[{name:"Alan Turing",years:"1912-1954",organization:"GC&CS, Hut 8",field:"Naval Enigma / computing",contribution:"Led the attack on German Naval Enigma, designed core ideas behind the British Bombe, and later formulated foundational concepts in computing and artificial intelligence.",source:"GCHQ History"},{name:"Gordon Welchman",years:"1906-1985",organization:"GC&CS, Hut 6",field:"Enigma / cryptanalytic engineering",contribution:"Created the Bombe diagonal board, dramatically reducing false stops, and built an industrial organization for exploiting German Army and Air Force Enigma traffic.",source:"GCHQ History"},{name:"Mavis Batey",years:"1921-2013",organization:"GC&CS, Dilly Knox team",field:"Italian Naval and Abwehr Enigma",contribution:"Her Enigma breakthroughs contributed to victory at Cape Matapan and to reading Abwehr traffic, which helped validate the Double Cross deception system before D-Day.",sourc     The daily key sheet specifies:
    Rotors: I - II - III

    Decrypt the ciphertext to discover the strategic directive!`,ciphertext:"QWBHX OTZXK RJMNS UYTGB",expectedPlaintext:"ANGRIFF AUF DIE STRASSE",hints:["Set rotors to I - II - III and reflector to UKW-B in the Enigma Simulator.","Ensure plugboard pairs A-B, C-D, E-F, G-H are connected.","Set starting rotor position to A-A-A."],keyDetails:"Rotors: I II III | Ring: AAA | Start: AAA | Plugs: AB CD EF GH",recommendedTool:"enigma"},{id:"m2-uboat-m4",title:"U-Boat Wolfpack U-552 Weather Report (Enigma M4)",category:"WWII SIGINT",difficulty:"Codebreaker",description:"Decrypt a Kriegsmarine Wetterkurzschlüssel transmitted from Atlantic Submarine U-552.",briefing:`Kriegsmarine Captain Erich Topp onboard U-552 transmitted a encoded weather report using the 4-rotor Enigma M4 Naval machine.

    Start Positions: B - J - K - L
    
    Decode the 4-letter naval ciphertext blocks!`,ciphertext:"KFXP JZQO WLNM PRTV",expectedPlaintext:"WETTER STRUM RAUHE SEE",hints:["Switch Enigma Model selector to M4 Naval.","Use UKW-B Thin reflector and Beta 4th thin rotor.","Configure rotor positions to B-J-K-L."],keyDetails:"M4 | Thin B | Beta-V-VI-VIII | Pos: B-J-K-L | 10 Plugs",recommendedTool:"enigma"},{id:"m4-hagelin-diplomatic",title:"Embassy Cable Intercept: Hagelin BC-52 Diplomatic Traffic",category:"Cold War Spy",difficulty:"Codebreaker",description:"A foreign embassy cable, encrypted on a Hagelin CX-52, intercepted by a Western SIGINT listening post.",briefing:`A CX-52 diplomatic cipher machine was used to encrypt a short embassy cable. Field agents recovered the pinwheel pattern from a partially burned key sheet found in an embassy waste bin.

    Model: CX-52 (Irregular Stepping, 6 wheels of 47 pins each)
    All pins set to default alternating pattern (odd positions active)
    Print Offset: 0
    Starting wheel positions: all at A (0)

    Use the Hagelin BC-52 Simulator in CX-52 mode with default settings to decrypt the intercepted cable.`,ciphertext:"PENDING - Use simulator default settings to generate and compare",expectedPlaintext:"AMBASSADOR ARRIVES FRIDAY NOON",hints:["Switch the BC-52 Simulator to CX-52 mode.","Leave all pin patterns at their default alternating state.","Set all 6 wheel positions to A (0) and print offset to 0.","Type the expected plaintext into the input box and observe how the cipher output changes as you adjust wheel positions to match the intercepted pattern."],keyDetails:"CX-52 | 6×47-pin wheels | Default alternating pins | Offset: 0 | Start: AAAAAA",recommendedTool:"bc52"},{id:"m5-lorenz-tunny",title:"Operation CITADEL: Lorenz SZ40/42 (Tunny) Strategic Intercept",category:"WWII SIGINT",difficulty:"Master Cryptanalyst",description:"High-level strategic German teleprinter traffic intercepted between OKW (Supreme High Command) and Army Group South.",briefing:`On the eve of the Battle of Kursk (Operation CITADEL), Bletchley Park Station X intercepted a top-secret strategic teleprinter message enciphered on the 12-wheel Lorenz SZ40/42 (Tunny) machine.

    Using the 1941 Tutte Depth Attack and Colossus cam evaluations, Hut F (The Testery) recovered the 12-wheel starting cam positions:
    Chi (χ1-χ5) positions: 0 - 0 - 0 - 0 - 0
    Motor (μ1-μ2) positions: 0 - 0
    Psi (ψ1-ψ5) positions: 0 - 0 - 0 - 0 - 0

    Use the Lorenz SZ40/42 (Tunny) Lab in "Teleprinter XOR Studio" mode with default wheel positions to decrypt the strategic directive!`,ciphertext:"PENDING - Use Lorenz SZ40/42 Teleprinter XOR Studio with default positions",expectedPlaintext:"OPERATION CITADEL HQ COMMAND BERLIN",hints:["Navigate to the Lorenz SZ40/42 (Tunny) Lab.","Ensure all 12 wheels are reset to position 0.",'Type "OPERATION CITADEL HQ COMMAND BERLIN" into the Input text or use the character transmitter to observe the 5-bit Vernam XOR output.'],keyDetails:"12-Wheel Lorenz SZ40 | Chi/Motor/Psi Pos: all 0 | 5-Bit ITA2 Vernam XOR",recommendedTool:"lorenz"},{id:"m6-sigaba-presidential",title:"Presidential Cable: U.S. SIGABA (ECM Mark II) Unbreakable Traffic",category:"WWII SIGINT",difficulty:"Codebreaker",description:"A top-secret Allied communication encrypted on the American SIGABA 15-rotor machine between President Franklin D. Roosevelt and Prime Minister Winston Churchill.",briefing:`During the Quebec Conference in 1943, President Roosevelt sent an encrypted cable to Prime Minister Churchill using the American SIGABA (ECM Mark II) machine.
    
    SIGABA's 15 rotors (5 Cipher, 5 Control, 5 Index) stepped in a complex, aperiodic stepping maze that was never broken by Axis codebreakers during World War II!
    
    With default 0-0-0-0-0 rotor positions and standard Index routing, use the SIGABA (15-Rotor) & Fialka (10-Rotor) Lab to verify the presidential plaintext!`,ciphertext:"PENDING - Use SIGABA / Fialka Lab with default 0-0-0-0-0 positions",expectedPlaintext:"PRESIDENT ROOSEVELT TO PRIME MINISTER CHURCHILL",hints:["Navigate to the SIGABA / Fialka Lab.","Select U.S. SIGABA (15 Rotors) and ensure all Cipher and Control rotors are reset to position A (0).",`Enter "PRESIDENT ROOSEVELT TO PRIME MINISTER CHURCHILL" into the Batch SIGABA Encryption box to verify how SIGABA's stepping maze encrypts high-level Allied traffic.`],keyDetails:"15-Rotor SIGABA | Cipher/Control Pos: 0-0-0-0-0 | Index: 3-7-12-19-23",recommendedTool:"sigabafialka"},{id:"m3-tinkerbell",title:"Operation Tinker Bell: Cold War Agent Communication",category:"Cold War Spy",difficulty:"Master Cryptanalyst",description:"Intercepted shortwave numbers station transmission sent to KGB illegal agent in Washington D.C.",briefing:`Intelligence officers intercepted a 5-digit numbers stream broadcast over shortwave radio frequency 6840 kHz.

    Subtract key non-carrying modulo 10 and decode with the Straddling Checkerboard!`,ciphertext:"52189 03174 88219",expectedPlaintext:"MEET AGENT AT PARK",hints:["Use the Manual Ciphers tab -> One-Time Pad & Straddling Checkerboard.","Perform non-carrying digit subtraction first.","Match the resultant digits against the ESTONIAR grid."],keyDetails:"Straddling Checkerboard ESTONIAR + OTP Pad #4409",recommendedTool:"manual"}],rh=[{id:"s1-lincolnshire",name:"E03 - The Lincolnshire Poacher",location:"RAF Akrotiri, Cyprus",frequency:"5437 kHz / 14487 kHz",activeYears:"1970s - 2008 (Operated by MI6)",soundType:"chimes",description:'Famous British Secret Intelligence Service station playing a synthesized tune of English folk song "The Lincolnshire Poacher" followed by a synthesized female voice reciting 5-digit groups.',sampleCode:["02581","94017","33829","10594","88301"]},{id:"s2-swedish-rhapsody",name:"G02 - Swedish Rhapsody (Das Musicbox)",location:"Poland (WSR / Stasi/SB Network)",frequency:"6840 kHz",activeYears:"1950s - 1998",soundType:"gong",description:"Cold War station using a music box melody playing Hugo Alfvén's Swedish Rhapsody, followed by a mechanical child voice counting German numbers for illegal agents in West Germany.",sampleCode:["38104","77291","04918","55102","62938"]},{id:"s3-atencion",name:"V02a - Atención (Cuban Intelligence)",location:"Havana, Cuba (DI Services)",frequency:"9130 kHz AM",activeYears:"1960s - Present",soundType:"voice",description:"Cuban Intelligence Directorate station notorious for broadcasting 5-digit messages to Cuban spies in North America (including the Wasp Network ring).",sampleCode:["41092","88310","00274","19482","53819"]},{id:"s4-uvb76",name:'S28 - UVB-76 "The Buzzer"',location:"Povarovo / St. Petersburg, Russia",frequency:"4625 kHz USB",activeYears:"1970s - Present",soundType:"beeps",description:'Continuous repetitive buzzer channel that sporadically interrupts with live Russian voice military tactical cryptograms: "ANVF 81 294 MDZhB".',sampleCode:["MDZhB","38102","ANVF81","75920","91004"]}],Yr=[{id:"woodpecker",name:"The Russian Woodpecker",callsign:"Duga-1 OTH Radar",origin:"Liubech-1 & Chernobyl-2, Ukraine (USSR)",years:"1976–1986",type:"Mystery Signal",description:"A repetitive tapping noise (est. 10 Megawatt signal) that disrupted shortwave broadcasts worldwide for a decade before being identified.",details:["Part of the Soviet Anti-Ballistic Missile early warning system (over-the-horizon radar)",'Transmitter at Liubech-1, receiver antennas at Chernobyl-2 (codenamed "Steel Yard" by NATO)',"Damaged during the 1986 Chernobyl disaster and never became operational again","Site now lies within the 18-mile Chernobyl exclusion zone","A second system, Duga-2, operated in the Soviet far east"]},{id:"uvb76",name:'UVB-76 "The Buzzer"',callsign:"UVB-76 / MDZhB",origin:"Near Povarovo, Russia (relocated 2010)",years:"1982–Present",type:"Mystery Signal",description:"A continuous monotone buzz (25 tones/minute) broadcasting on 4625 kHz for over 40 years with only a handful of rare voice transmissions ever recorded.",details:["Started in 1982 with a two-second beep, later switched to continuous buzzing","Its callsign UVB-76 was only revealed during one of its rare voice conversations",'Some speculate it relates to the Soviet "Dead Hand" automated nuclear response system (unconfirmed)',"Others believe it simply reserves a frequency for wartime use","Continuously monitored by radio amateurs since the 1980s"]},{id:"penkovsky",name:"Oleg Penkovsky Arrest",callsign:"GRU Colonel, Western double agent",origin:"Moscow, USSR",years:"1962",type:"Espionage Case",description:"Soviet GRU Colonel arrested by the KGB; a search of his apartment uncovered one-time pads, a letter-to-digit checkerboard, Morse cut-number tables, and a shortwave radio hidden in a secret desk compartment.",details:["One of the most valuable Western assets during the Cuban Missile Crisis","Equipment found: OTP booklets, Minox camera, checkerboard tables, shortwave radio",'Demonstrates the standard "spy kit" issued for numbers station communication']},{id:"trigon",name:"TRIGON / Aleksandr Ogorodnik",callsign:"CIA codename TRIGON / TRIANON",origin:"Moscow, USSR",years:"1970s",type:"Espionage Case",description:"Soviet diplomat recruited by the CIA in 1970, received messages via one-time pad broadcast from West Germany by his case officer Martha Peterson.",details:["One-time pad recovered from KGB archives after the case unraveled","CIA case officer Martha Peterson was later arrested by the KGB in Moscow","Demonstrates real-world CIA numbers station operational tradecraft"]},{id:"barsky",name:"Jack Barsky (Albrecht Dittrich)",callsign:"KGB illegal, false US identity",origin:"East Germany → United States",years:"1978–1988",type:"Espionage Case",description:'Stasi-scouted, KGB-recruited illegal agent who spent a decade in the US under a false identity, receiving weekly encrypted "radiograms" via shortwave from Cuba.',details:["Every Thursday at 21:15 hrs, tuned to a predetermined frequency for KGB instructions","A single radiogram could take an hour to receive and 3 hours to decrypt by hand","Radiograms transmitted from Cuba to agents operating in the United States"]},{id:"wasp-network",name:"Cuban Five / Wasp Network",callsign:"DGI Atención Station Agents",origin:"Havana, Cuba → Florida, USA",years:"1998 arrest",type:"Espionage Case",description:'Cuban intelligence agents received daily encrypted instructions via the "Atención" numbers station, later used as evidence in federal prosecution.',details:["Atención station remains active today, still broadcasting to Cuban agents","Related case: Ana Belén Montes, senior DIA analyst, arrested 2001","Related case: Walter Kendall Myers & wife, arrested 2009 after 30 years of espionage","Related case: Carlos & Elsa Alvarez, Florida International University, charged 2006"]},{id:"jelinek",name:"Vaclav Jelinek (Erwin van Haarlem)",callsign:"Czechoslovak StB illegal agent",origin:"London, UK",years:"1988 arrest",type:"Espionage Case",description:"Arrested by British Special Branch while actively receiving a numbers message on shortwave radio; one-time pads were found hidden on microfilm inside bars of soap.",details:["Caught red-handed mid-transmission, a rare case of direct evidence","One-time pads enabled detectives to decrypt intercepted messages for trial","Sentenced to 10 years imprisonment"]},{id:"ivy-bells",name:"Operation Ivy Bells",callsign:"USS Halibut Submarine Wiretap",origin:"Sea of Okhotsk, USSR territorial waters",years:"1971",type:"Espionage Case",description:"U.S. nuclear submarine USS Halibut placed a 6-ton wiretap on a Soviet undersea communications cable connecting a naval base to fleet headquarters — deep within heavily-patrolled Soviet waters.",details:["Cable connected Kamchatsky submarine base to Vladivostok Fleet HQ","One of the most daring SIGINT operations of the entire Cold War","Similar Soviet submarine SIGINT missions remain hidden in Russian archives"]}],p2=[{name:"Lincolnshire Poacher (E3)",operator:"British SIS/MI6",location:"RAF Akrotiri, Cyprus",years:"1970s–2008",signature:"English folk tune interval signal"},{name:"Swedish Rhapsody",operator:"Polish SB/UOP",location:"Poland",years:"1950s–1998",signature:"Music box melody + child voice"},{name:"Atención",operator:"Cuban DGI",location:"Havana, Cuba",years:"1960s–Present",signature:'"Atención" call, female voice'},{name:"UVB-76 (The Buzzer)",operator:"Russian military (unconfirmed)",location:"Russia (relocated 2010)",years:"1982–Present",signature:"Continuous monotone buzz"},{name:"Yankee Bravo",operator:"Believed KGB",location:"Unknown",years:"Cold War era",signature:'German female voice, "Yankee Bravo" callsign'},{name:"Cherry Ripe",operator:"British SIS (Asian sister of Lincolnshire Poacher)",location:"Asia-Pacific region",years:"Still active",signature:"English folk tune variant"},{name:"Stasi Gong Station",operator:"East German Stasi",location:"East Germany",years:"~1980–May 1990",signature:"Distinctive gong tones"}],h2=[{year:"1917",name:"M-94",description:"U.S. Major Joseph Mauborgne's cylindrical wheel cipher device with 25 scrambled alphabet discs, used by the U.S. Army until 1943."},{year:"1918",name:"Hebern Rotor",description:"Edward Hebern's single-rotor electromechanical cipher machine, the first rotor design, laying foundations for future machines."},{year:"1920",name:"Kryha",description:"German mechanical cipher with two concentric alphabet discs, used by the German Diplomatic Corps until the 1950s."},{year:"1924",name:"Enigma A/B/C/D",description:"Arthur Scherbius' commercial Enigma evolves from Handelsmaschine printer to lampboard models with interchangeable rotors."},{year:"1925",name:"Hagelin B-21",description:"Boris Hagelin's first cipher machine, using pin-wheels to control two scrambling rotors in a 5x5 grid, max period 1,560,090."},{year:"1932",name:"Enigma I / Plugboard",description:"The Wehrmacht adds the Steckerbrett (plugboard) to the commercial Enigma D, creating the famous wartime Enigma I."},{year:"1935",name:"Hagelin C-35",description:"First real pin-and-lug cipher machine for the French Cipher Bureau, using 5 pinwheels driving a reciprocal alphabet drum."},{year:"1936",name:"Siemens T-52 Sturgeon",description:"German teleprinter cipher with 10 pinwheels XOR-mixed with 5-bit telex signals for high-level communications."},{year:"1937",name:"British TYPEX",description:"Enhanced Enigma-derivative used by UK, Canada, and New Zealand — its traffic was never broken during WW2."},{year:"1939",name:"Enigma M3 / PURPLE",description:"Kriegsmarine extends the rotor set to 8 for their Enigma M3; Japan's PURPLE diplomatic cipher is broken before Pearl Harbor."},{year:"1940",name:"SIGABA & M-209",description:"The unbreakable American SIGABA (ECM Mark II) enters service; Hagelin's M-209 becomes the U.S. Army's tactical cipher (140,000 units)."},{year:"1942",name:"Enigma M4",descripti
