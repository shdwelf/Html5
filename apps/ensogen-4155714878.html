<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ensō Generator — ENSOGEN 4155714878</title>
  <style>
    :root {
      --cyan-paper: #bdf8ff;
      --ink: #080705;
      --panel: rgba(255,255,255,.72);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,.85), transparent 34rem),
        linear-gradient(135deg, #77ddec, #e8feff 42%, #7ddbe6);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #102426;
    }

    main {
      width: min(1180px, 96vw);
      display: grid;
      grid-template-columns: minmax(320px, 900px) minmax(250px, 320px);
      gap: 1rem;
      align-items: start;
      padding: 1rem;
    }

    .art-wrap, .panel {
      border: 1px solid rgba(0,0,0,.15);
      box-shadow: 0 22px 70px rgba(0, 31, 36, .22);
      border-radius: 22px;
      overflow: hidden;
      background: var(--panel);
      backdrop-filter: blur(8px);
    }

    .art-wrap {
      position: relative;
      aspect-ratio: 1 / 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--cyan-paper);
    }

    .badge {
      position: absolute;
      left: 1rem;
      top: 1rem;
      padding: .45rem .7rem;
      border-radius: 999px;
      background: rgba(255,255,255,.65);
      color: #123438;
      font-size: .82rem;
      letter-spacing: .08em;
      font-weight: 800;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    .panel {
      padding: 1rem;
    }

    h1 {
      margin: .1rem 0 .35rem;
      font-size: 1.35rem;
      line-height: 1.12;
    }

    .id {
      margin: .4rem 0 1rem;
      padding: .75rem;
      background: rgba(0, 53, 59, .08);
      border: 1px dashed rgba(0, 48, 52, .22);
      border-radius: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      word-break: break-word;
    }

    dl {
      margin: 0;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: .45rem .75rem;
      font-size: .93rem;
    }

    dt { color: rgba(9, 34, 37, .7); }
    dd { margin: 0; font-weight: 750; text-align: right; }

    button {
      width: 100%;
      margin-top: 1rem;
      border: 0;
      border-radius: 14px;
      padding: .82rem .9rem;
      font-weight: 800;
      color: white;
      background: #083337;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(8,51,55,.22);
    }
    button:hover { background: #11515a; }

    p {
      font-size: .88rem;
      line-height: 1.45;
      color: rgba(9, 34, 37, .72);
    }

    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <section class="art-wrap" aria-label="Generated enso artwork">
      <canvas id="enso" width="1200" height="1200"></canvas>
      <div class="badge">ENSOGEN 4155714878</div>
    </section>

    <aside class="panel">
      <h1>Seeded Ensō Generator</h1>
      <div class="id">ENSOGEN number: <strong id="seedLabel">4155714878</strong></div>
      <dl id="vars"></dl>
      <button id="redraw">Redraw same ENSOGEN</button>
      <button id="download">Download PNG</button>
      <p>
        This file uses the ENSOGEN number as a deterministic terrain-style seed.
        The same number and variables recreate the same randomized ensō, similar
        to a Worms Armageddon terrain ID.
      </p>
    </aside>
  </main>

  <script>
    "use strict";

    /*
      ENSOGEN number
      ---------------
      Canonical source string:
      Ink Load=4|Direction=Clockwise|Paper Hue=Cyan|Brush Size=6|Ink Density=3|X/Y Stretch=Unequal|Paper Texture=4|Bristle Density=5|Signature Style=Dark|Brushstroke Size=Medium|Brushstroke Start=Rotated 216 degrees

      ENSOGEN = CRC32(canonical source string) = 4155714878
    */
    const ENSOGEN_NUMBER = 4155714878;

    const ENSO_VARIABLES = Object.freeze({
      inkLoad: 4,
      direction: "Clockwise",
      paperHue: "Cyan",
      brushSize: 6,
      inkDensity: 3,
      xyStretch: "Unequal",
      paperTexture: 4,
      bristleDensity: 5,
      signatureStyle: "Dark",
      brushstrokeSize: "Medium",
      brushstrokeStartDegrees: 216
    });

    const canvas = document.getElementById("enso");
    const ctx = canvas.getContext("2d", { alpha: false });

    function mulberry32(seed) {
      return function random() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function smootherStep(t) {
      return t * t * t * (t * (t * 6 - 15) + 10);
    }

    function smoothArray(values, rounds = 2) {
      let out = values.slice();
      const n = out.length;
      for (let r = 0; r < rounds; r++) {
        const next = out.slice();
        for (let i = 0; i < n; i++) {
          next[i] = (out[(i - 1 + n) % n] + out[i] * 2 + out[(i + 1) % n]) / 4;
        }
        out = next;
      }
      return out;
    }

    function sampleLooped(values, t) {
      const n = values.length;
      const x = ((t % 1) + 1) % 1 * n;
      const i = Math.floor(x) % n;
      const f = smootherStep(x - Math.floor(x));
      return lerp(values[i], values[(i + 1) % n], f);
    }

    function rgba(r, g, b, a) {
      return `rgba(${r}, ${g}, ${b}, ${a})`;
    }

    function drawPaper(random, cfg) {
      const w = canvas.width;
      const h = canvas.height;
      const base = { r: 189, g: 248, b: 255 }; // cyan paper

      ctx.fillStyle = `rgb(${base.r}, ${base.g}, ${base.b})`;
      ctx.fillRect(0, 0, w, h);

      // Pixel-level paper grain.
      const textureStrength = cfg.paperTexture / 5;
      const image = ctx.getImageData(0, 0, w, h);
      const data = image.data;
      for (let i = 0; i < data.length; i += 4) {
        const noise = (random() - 0.5) * 30 * textureStrength;
        const cloud = Math.sin((i / 4 % w) * 0.013) * 4 + Math.cos(Math.floor(i / 4 / w) * 0.016) * 4;
        data[i] = clamp(base.r + noise + cloud, 0, 255);
        data[i + 1] = clamp(base.g + noise * 0.7 + cloud, 0, 255);
        data[i + 2] = clamp(base.b + noise * 0.55 + cloud, 0, 255);
        data[i + 3] = 255;
      }
      ctx.putImageData(image, 0, 0);

      // Long fibers.
      ctx.save();
      ctx.globalAlpha = 0.08 + textureStrength * 0.08;
      for (let i = 0; i < 700 * textureStrength; i++) {
        const x = random() * w;
        const y = random() * h;
        const len = 20 + random() * 95;
        const angle = -0.25 + random() * 0.5;
        ctx.strokeStyle = random() > 0.5 ? "rgba(255,255,255,.55)" : "rgba(56,121,126,.22)";
        ctx.lineWidth = 0.45 + random() * 1.2;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(angle) * len, y + Math.sin(angle) * len);
        ctx.stroke();
      }
      ctx.restore();
    }

    function buildTerrain(random) {
      const points = 96;
      const rough = Array.from({ length: points }, () => random() * 2 - 1);
      const mid = smoothArray(rough, 4);
      const fine = smoothArray(Array.from({ length: points }, () => random() * 2 - 1), 1);
      return { mid, fine };
    }

    function terrainAt(terrain, t) {
      return sampleLooped(terrain.mid, t) * 24 + sampleLooped(terrain.fine, t * 3.0) * 7;
    }

    function ensoPoint(t, terrain, bristleOffset, cfg) {
      const clockwise = cfg.direction.toLowerCase() === "clockwise";
      const start = cfg.brushstrokeStartDegrees * Math.PI / 180;
      const sweepDegrees = 318; // medium stroke with visible opening/gap
      const sweep = sweepDegrees * Math.PI / 180 * (clockwise ? 1 : -1);
      const angle = start + sweep * t;

      const baseRadius = 345;
      const stretchX = cfg.xyStretch === "Unequal" ? 1.115 : 1;
      const stretchY = cfg.xyStretch === "Unequal" ? 0.91 : 1;
      const wobble = terrainAt(terrain, t);
      const radius = baseRadius + wobble + bristleOffset;

      return {
        x: canvas.width / 2 + Math.cos(angle) * radius * stretchX,
        y: canvas.height / 2 + Math.sin(angle) * radius * stretchY,
        angle
      };
    }

    function strokePath(ctx, terrain, bristleOffset, cfg, begin = 0, end = 1) {
      const steps = 260;
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const t = lerp(begin, end, i / steps);
        const p = ensoPoint(t, terrain, bristleOffset, cfg);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
    }

    function drawEnso(random, cfg) {
      const terrain = buildTerrain(random);
      const mediumMultiplier = cfg.brushstrokeSize === "Medium" ? 1 : 0.82;
      const mainWidth = (46 + cfg.brushSize * 6.5) * mediumMultiplier;
      const densityAlpha = 0.13 + cfg.inkDensity * 0.045;
      const inkLoadAlpha = 0.08 + cfg.inkLoad * 0.035;

      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.shadowColor = "rgba(0,0,0,.10)";
      ctx.shadowBlur = 3;

      // Main body wash.
      ctx.strokeStyle = rgba(9, 8, 6, clamp(densityAlpha + inkLoadAlpha, 0.12, 0.48));
      ctx.lineWidth = mainWidth;
      strokePath(ctx, terrain, 0, cfg, 0.018, 0.982);
      ctx.stroke();

      // Dry-brush bristles: many seeded paths make the ring organic/terrain-like.
      const bristleCount = Math.round(cfg.bristleDensity * 22);
      for (let b = 0; b < bristleCount; b++) {
        const bristleOffset = (random() - 0.5) * mainWidth * 1.18;
        const begin = random() * 0.035;
        const end = 1 - random() * 0.045;
        const width = 0.75 + random() * (1.4 + cfg.brushSize * 0.42);
        const alpha = clamp(0.035 + random() * 0.115 + cfg.inkDensity * 0.012, 0.03, 0.23);
        ctx.strokeStyle = rgba(7, 6, 5, alpha);
        ctx.lineWidth = width;
        strokePath(ctx, terrain, bristleOffset, cfg, begin, end);
        ctx.stroke();
      }

      // Darker loaded edges, separated like natural bristles.
      for (let e = -1; e <= 1; e += 2) {
        for (let i = 0; i < 10; i++) {
          ctx.strokeStyle = rgba(0, 0, 0, 0.045 + random() * 0.055);
          ctx.lineWidth = 2 + random() * 4;
          strokePath(ctx, terrain, e * (mainWidth * 0.44 + random() * 11), cfg, 0.03, 0.96);
          ctx.stroke();
        }
      }

      // Opening/end marks where the brush lifts.
      for (let i = 0; i < 26; i++) {
        const t = i < 13 ? random() * 0.075 : 0.91 + random() * 0.075;
        const offset = (random() - 0.5) * mainWidth * 1.15;
        const p = ensoPoint(t, terrain, offset, cfg);
        ctx.fillStyle = rgba(7, 6, 5, 0.035 + random() * 0.10);
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, 3 + random() * 18, 1 + random() * 5, p.angle + Math.PI / 2, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawSignature(random, cfg) {
      if (cfg.signatureStyle !== "Dark") return;
      ctx.save();
      ctx.translate(canvas.width * 0.765, canvas.height * 0.77);
      ctx.rotate(-0.07);
      ctx.strokeStyle = "rgba(19, 12, 9, .82)";
      ctx.fillStyle = "rgba(19, 12, 9, .82)";
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      // Minimal dark calligraphic signature/seal generated from same seed.
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(16, -33, 46, -33, 38, 2);
      ctx.bezierCurveTo(30, 39, -8, 31, 9, -6);
      ctx.stroke();

      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(56, -28);
      ctx.bezierCurveTo(41, -10, 42, 17, 62, 28);
      ctx.bezierCurveTo(82, 37, 94, 12, 80, -8);
      ctx.stroke();

      ctx.font = "700 22px ui-monospace, SFMono-Regular, Menlo, monospace";
      ctx.fillText(String(ENSOGEN_NUMBER).slice(-4), -4, 72);
      ctx.restore();
    }

    function render() {
      const random = mulberry32(ENSOGEN_NUMBER >>> 0);
      drawPaper(random, ENSO_VARIABLES);
      drawEnso(random, ENSO_VARIABLES);
      drawSignature(random, ENSO_VARIABLES);
    }

    function populateVariableList() {
      const rows = [
        ["Ink Load", ENSO_VARIABLES.inkLoad],
        ["Direction", ENSO_VARIABLES.direction],
        ["Paper Hue", ENSO_VARIABLES.paperHue],
        ["Brush Size", ENSO_VARIABLES.brushSize],
        ["Ink Density", ENSO_VARIABLES.inkDensity],
        ["X/Y Stretch", ENSO_VARIABLES.xyStretch],
        ["Paper Texture", ENSO_VARIABLES.paperTexture],
        ["Bristle Density", ENSO_VARIABLES.bristleDensity],
        ["Signature Style", ENSO_VARIABLES.signatureStyle],
        ["Brushstroke Size", ENSO_VARIABLES.brushstrokeSize],
        ["Brushstroke Start", `Rotated ${ENSO_VARIABLES.brushstrokeStartDegrees}°`]
      ];
      document.getElementById("vars").innerHTML = rows
        .map(([key, value]) => `<dt>${key}</dt><dd>${value}</dd>`)
        .join("");
    }

    document.getElementById("redraw").addEventListener("click", render);
    document.getElementById("download").addEventListener("click", () => {
      const link = document.createElement("a");
      link.download = `enso-ensogen-${ENSOGEN_NUMBER}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    });

    populateVariableList();
    render();
  </script>
