plugins {
    id 'com.android.application'
}

def repoRoot = rootProject.projectDir.parentFile.parentFile
def publicAppsDir = new File(repoRoot, 'public/apps')
def assetProfiles = ['public', 'private']
def generatedAssetsByProfile = assetProfiles.collectEntries { profile ->
    [(profile): layout.buildDirectory.dir("generated/html5-assets/${profile}")]
}

android {
    namespace 'org.arena.html5launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'org.arena.html5launcher'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    flavorDimensions 'catalog'
    productFlavors {
        create('public') {
            dimension 'catalog'
        }
        create('private') {
            dimension 'catalog'
            applicationIdSuffix '.private'
            versionNameSuffix '-private'
        }
    }

    buildTypes {
        debug {
            // Debug builds are signed for sideloading and review.
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Each flavor gets only its own generated app tree; never put both profiles
// under the shared main assets root.
assetProfiles.each { profile ->
    android.sourceSets.getByName(profile).assets.srcDir(generatedAssetsByProfile[profile])
}

def registerHtmlAppsAssetsTask = { profile ->
    def outputDir = generatedAssetsByProfile[profile]
    tasks.register("prepare${profile.capitalize()}HtmlAppsAssets", Exec) {
        workingDir repoRoot
        commandLine 'node',
                'scripts/build-html5-offline-launcher-assets.mjs',
                '--profile', profile,
                '--out-dir', outputDir.get().asFile.absolutePath
        inputs.dir(publicAppsDir)
        inputs.property('profile', profile)
        outputs.dir(outputDir)
    }
}

def publicAssetsTask = registerHtmlAppsAssetsTask('public')
def privateAssetsTask = registerHtmlAppsAssetsTask('private')

tasks.named('preBuild').configure {
    dependsOn(publicAssetsTask, privateAssetsTask)
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
