<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared VRML viewer browser fixture</title>
  <style>
    html, body { width:100%; height:100%; margin:0; background:#05080f; }
    #vrmlHost { position:relative; width:100vw; height:100vh; overflow:hidden; }
    #vrmlHost canvas { display:block; width:100%; height:100%; }
  </style>
</head>
<body>
  <div id="vrmlHost"></div>
  <script type="module">
    import { startVrmlViewer } from "../../js/ghs-viewer-three.js";
    const wrlText = `#VRML V2.0 utf8
Shape {
  appearance Appearance { material Material { diffuseColor 0.75 0.35 0.1 } }
  geometry Box { size 160 24 100 }
}
Transform {
  translation 25 0 0
  children [ Shape {
    appearance Appearance { material Material { diffuseColor 0.1 0.65 0.85 } }
    geometry Sphere { radius 20 }
  } ]
}
`;
    window.viewer = startVrmlViewer({ host: document.getElementById("vrmlHost"), wrlText });
  </script>
</body>
</html>
