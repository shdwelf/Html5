<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline DjVu sample</title><style>body{font:14px system-ui;margin:18px;color:#273c38}canvas{max-width:100%;height:auto;border:1px solid #ddd}button{padding:8px;margin:6px}#controls{display:flex;align-items:center;gap:10px}</style></head><body><p id="status" role="status">Loading bundled DjVu…</p><a href="wiki/media/djvu-smoke.djvu" download>Download original sample</a><div id="controls"><button id="prev" disabled>Previous</button><span id="label"></span><button id="next" disabled>Next</button></div><canvas id="page" aria-label="Rendered DjVu page"></canvas><script type="module">
import init,{WasmDocument} from './wiki/djvu-rs/djvu_rs.js';
const $=id=>document.getElementById(id);let doc,index=0;
function draw(){const p=doc.page(index);try{const edge=Math.max(p.width_at(96),p.height_at(96)),dpi=edge>1536?96*1536/edge:96,w=p.width_at(dpi),h=p.height_at(dpi);$('page').width=w;$('page').height=h;$('page').getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(p.render(dpi)),w,h),0,0);$('label').textContent='Page '+(index+1)+' of '+doc.page_count();$('prev').disabled=index===0;$('next').disabled=index+1>=doc.page_count();$('status').textContent='DjVu rendered locally with the bundled WebAssembly decoder.';}finally{p.free();}}
try{await init();const response=await fetch('./wiki/media/djvu-smoke.djvu');if(!response.ok)throw new Error('sample not found');doc=WasmDocument.from_bytes(new Uint8Array(await response.arrayBuffer()));draw();$('prev').onclick=()=>{if(index>0){index--;draw();}};$('next').onclick=()=>{if(index+1<doc.page_count()){index++;draw();}};window.addEventListener('pagehide',()=>doc.free(),{once:true});}catch(e){$('status').textContent='Preview unavailable: '+e.message+'. Use the download link.';}
</script></body></html>
